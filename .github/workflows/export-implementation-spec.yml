name: Export implementation spec

on:
  push:
    paths:
      - "rpg-rules.js"
      - "spec/spec-status.json"
      - "tools/export-implementation-spec.mjs"
      - ".github/workflows/export-implementation-spec.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate implementation mirrors
        run: node tools/export-implementation-spec.mjs
      - name: Commit generated mirrors when changed
        run: |
          if git diff --quiet -- spec/generated/implemented-skills.csv spec/generated/implemented-masteries.csv; then
            echo "Generated mirrors already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/generated/implemented-skills.csv spec/generated/implemented-masteries.csv
          git commit -m "Sync generated implementation spec"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: implementation-spec-export
          path: |
            spec/generated/implemented-skills.csv
            spec/generated/implemented-masteries.csv
          retention-days: 7
