name: Capture facility worlds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-facility-worlds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture facility screens
        run: |
          python -m http.server 8139 >/tmp/facility-http.log 2>&1 &
          python - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          async def snap(page,name):
              await page.wait_for_timeout(120)
              await page.screenshot(path=f"{name}.png", full_page=True)
              data=await page.evaluate("""()=>{const app=document.querySelector('#app'),s=document.querySelector('#screen'),n=document.querySelector('.facility-world-npc'),o=document.querySelector('.facility-world-overlay'),p=document.querySelector('#party'),v=document.querySelector('.hub-global-nav');const r=x=>x?x.getBoundingClientRect().toJSON():null;return {kind:app.dataset.facility||'',classes:app.className,screen:r(s),npc:r(n),overlay:r(o),party:r(p),nav:r(v),dialog:document.querySelector('.facility-world-dialogue span')?.textContent||''}}""")
              print(name,json.dumps(data,ensure_ascii=False))

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  page=await b.new_page(viewport={"width":390,"height":844},device_scale_factor=1)
                  await page.goto("http://127.0.0.1:8139/exploration/",wait_until="networkidle")
                  await snap(page,"home")
                  await page.evaluate("inn()")
                  await snap(page,"inn-home")
                  await page.evaluate("conversation()")
                  await snap(page,"inn-conversation")
                  await page.evaluate("memberTalk(0)")
                  await snap(page,"inn-member")
                  await page.evaluate("market()")
                  await snap(page,"market-home")
                  await page.evaluate("weaponShop()")
                  await snap(page,"market-weapons")
                  await page.evaluate("gearDetail('王国剣')")
                  await snap(page,"market-detail")
                  await page.evaluate("guild()")
                  await snap(page,"guild-home")
                  await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: facility-world-capture
          path: |
            home.png
            inn-home.png
            inn-conversation.png
            inn-member.png
            market-home.png
            market-weapons.png
            market-detail.png
            guild-home.png
          if-no-files-found: error
