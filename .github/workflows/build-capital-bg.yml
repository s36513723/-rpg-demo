name: Build capital background
on:
  push:
    branches: [main]
    paths:
      - 'tools/assets/capital-bg.part*'
      - '.github/workflows/build-capital-bg.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode capital background
        run: |
          cat tools/assets/capital-bg.part* | tr -d '\n\r' | base64 -d > images/hub-capital-bg.webp
          test "$(stat -c %s images/hub-capital-bg.webp)" -eq 30724
          echo "18762edb3a35da16eb97f3ee31e4d253916b3e32d50899b840078a85ce4de9fa  images/hub-capital-bg.webp" | sha256sum -c -
      - name: Commit generated asset
        run: |
          rm tools/assets/capital-bg.part*
          rm .github/workflows/build-capital-bg.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Install approved capital city background"
          git push
