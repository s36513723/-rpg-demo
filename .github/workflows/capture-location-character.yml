name: Capture location character screens
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-location-character.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture
        run: |
          python -m http.server 8139 >/tmp/hub-http.log 2>&1 &
          python - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          async def shot(page,name):
              await page.wait_for_timeout(150)
              await page.screenshot(path=f"{name}.png", full_page=True)
              data=await page.evaluate("""()=>{const app=document.querySelector('#app'),modal=document.querySelector('#modal'),panel=document.querySelector('#panel'),back=panel.querySelector('.actor-backdrop');return {appBg:getComputedStyle(app).backgroundImage,actorBg:back?getComputedStyle(back).backgroundImage:'',modal:modal.className,panel:panel.className,place:app.dataset.facility||'town'}}""")
              print(name,json.dumps(data,ensure_ascii=False))

          async def home(page):
              await page.evaluate("town()")

          async def facility(page,fn):
              await page.evaluate(fn+"()")

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  page=await b.new_page(viewport={"width":390,"height":844},device_scale_factor=1)
                  await page.goto("http://127.0.0.1:8139/exploration/",wait_until="networkidle")
                  await home(page); await page.evaluate("character(0)"); await shot(page,"town-character")
                  await page.click('.hub-global-nav [data-nav="home"]')
                  for fn,name in [("guild","guild-character"),("inn","inn-character"),("market","market-character")]:
                      await facility(page,fn); await page.evaluate("character(0)"); await shot(page,name); await page.click('.hub-global-nav [data-nav="home"]')
                  await facility(page,"guild"); await page.evaluate("equip(0)"); await shot(page,"guild-equipment")
                  await page.evaluate("skills(0)"); await shot(page,"guild-skills")
                  await page.evaluate("charAbility(0)"); await shot(page,"guild-growth")
                  await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: location-character-capture
          path: |
            town-character.png
            guild-character.png
            inn-character.png
            market-character.png
            guild-equipment.png
            guild-skills.png
            guild-growth.png
          if-no-files-found: error
