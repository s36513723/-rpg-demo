name: Upgrade capital background
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-capital-bg.yml'
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build high-resolution capital background
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageFilter
          p='images/hub-capital-bg.webp'
          im=Image.open(p).convert('RGB')
          im=im.resize((720,1280), Image.Resampling.LANCZOS)
          im=im.filter(ImageFilter.UnsharpMask(radius=1.1, percent=115, threshold=3))
          im.save(p,'WEBP',quality=88,method=6)
          check=Image.open(p)
          assert check.size == (720,1280), check.size
          print('capital background:', check.size)
          PY
      - name: Commit upgraded asset
        run: |
          rm .github/workflows/upgrade-capital-bg.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Upgrade capital background resolution"
          git push
