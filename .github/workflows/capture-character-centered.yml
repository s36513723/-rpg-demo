name: Capture character-centered workspace
# visual polish recapture
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-character-centered.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture
        run: |
          python -m http.server 8139 >/tmp/character-http.log 2>&1 &
          python - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          async def shot(page,name):
              await page.wait_for_timeout(180)
              await page.screenshot(path=f"{name}.png",full_page=True)
              data=await page.evaluate("""()=>{const p=document.querySelector('#panel'),body=p.querySelector('.panel-body');return {
                panel:p.className,
                shell:!!p.querySelector('.character-equipment-shell'),
                slots:p.querySelectorAll('.character-equip-slot').length,
                actions:[...p.querySelectorAll('.actor-commands button')].map(x=>x.textContent.trim()),
                members:[...p.querySelectorAll('.actor-member-switch button')].map(x=>x.textContent.trim()),
                picker:!!p.querySelector('.character-equipment-picker'),
                tabs:!!p.querySelector('.actor-tabs'),
                bodyOverflow:body.scrollHeight-body.clientHeight
              }}""")
              print(name,json.dumps(data,ensure_ascii=False))

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  page=await b.new_page(viewport={"width":390,"height":844},device_scale_factor=1)
                  await page.goto("http://127.0.0.1:8139/exploration/",wait_until="networkidle")
                  await page.evaluate("town(); character(0)")
                  await shot(page,"character-home-390")
                  await page.evaluate("equipChoice(0,0)")
                  await shot(page,"character-weapon-picker-390")
                  await page.evaluate("actorAttributes(0)")
                  await shot(page,"character-ability-390")
                  await page.evaluate("skills(0)")
                  await shot(page,"character-skill-390")
                  await page.evaluate("charAbility(0)")
                  await shot(page,"character-mastery-390")
                  await page.set_viewport_size({"width":320,"height":568})
                  await page.evaluate("town(); character(0)")
                  await shot(page,"character-home-320")
                  await page.evaluate("actorAttributes(0)")
                  await shot(page,"character-ability-320")
                  await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: character-centered-capture
          path: |
            character-home-390.png
            character-weapon-picker-390.png
            character-ability-390.png
            character-skill-390.png
            character-mastery-390.png
            character-home-320.png
            character-ability-320.png
