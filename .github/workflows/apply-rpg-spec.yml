name: Apply tested RPG spec upgrade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-rpg-spec.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve checksum-verified implementation bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          shas = [
              '050f47c1025ecdc4c3d0e496f0df73ba0313fea8',
              '26ec6c3a855df3963844d46eb030483130ac1101',
              'eadf6b592a7b0c6cd40171d8248cc4049f57f9d4',
              'e9c14233d3a4e60e9542d70c309a3973215b650e',
              '0c8384f74a6d481379a46708692c174b2353788d',
          ]
          chunks = []
          for sha in shas:
              url = 'https://api.github.com/repos/s36513723/-rpg-demo/git/blobs/' + sha
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              assert data['encoding'] == 'base64'
              raw = base64.b64decode(data['content'])
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert actual == sha, 'Blob checksum mismatch'
              chunks.append(raw)
          bundle = b''.join(chunks)
          assert hashlib.sha256(bundle).hexdigest() == 'ad454432354f432b9e6d38f7d4787edf3020f3d1637a8a91e0bf7be0aa4bb510'
          files = json.loads(lzma.decompress(bundle))
          allowed = {
              'tools/spec-upgrade/battle.js', 'tools/spec-upgrade/exploration.js',
              'tools/spec-upgrade/apply.cjs', 'rpg-rules.js', 'tests/syntax.cjs',
              'tests/battle-regression.js', 'tests/hub-regression.js',
              'tests/browser.py', 'docs/BATTLE_IMPLEMENTATION.md',
          }
          assert set(files) == allowed
          for name, content in files.items():
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          print('Verified and extracted', len(files), 'implementation files')
          PY
      - name: Apply guarded AST updates
        run: |
          npm install --prefix "$RUNNER_TEMP/rpg-deps" --no-save acorn@8.14.1
          NODE_PATH="$RUNNER_TEMP/rpg-deps/node_modules" node tools/spec-upgrade/apply.cjs
          node tests/syntax.cjs
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run native Chromium regression tests
        run: python tests/browser.py
      - name: Commit only verified implementation
        run: |
          cp test-results.json docs/test-results.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add battle-v29.js exploration/index.html index.html rpg-rules.js tests docs tools/spec-upgrade
          git commit -m 'Implement Mastery ranks, explicit skills, boss parts and single-action combat'
          git push origin HEAD:main
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpg-spec-verified
          path: |
            battle-v29.js
            exploration/index.html
            index.html
            ui-v29.css
            rpg-rules.js
            tests/
            docs/
            tools/spec-upgrade/
            images/
            test-results.json
          retention-days: 7
