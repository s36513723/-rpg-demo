name: Capture persistent hub nav
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-persistent-hub-nav.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture
        run: |
          python -m http.server 8139 >/tmp/hub-http.log 2>&1 &
          python - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          async def state(page,name):
              await page.screenshot(path=f"{name}.png",full_page=True)
              d=await page.evaluate("""()=>{const app=document.querySelector('#app'),modal=document.querySelector('#modal'),nav=document.querySelector('.hub-global-nav');return {bg:getComputedStyle(app).backgroundImage,classes:app.className,facility:app.dataset.facility||'',modal:modal.className,nav:nav.getBoundingClientRect().toJSON(),navInert:nav.inert,screenInert:document.querySelector('#screen').inert,partyInert:document.querySelector('#party').inert,route:HUB_UI.state.route?.name||null,stack:HUB_UI.state.stack.map(x=>x.route?.name)}}""")
              print(name,json.dumps(d,ensure_ascii=False))
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  page=await b.new_page(viewport={"width":390,"height":844},device_scale_factor=1)
                  await page.goto("http://127.0.0.1:8139/exploration/",wait_until="networkidle")
                  await page.wait_for_timeout(300)
                  await state(page,"home")
                  await page.click('#party .m')
                  await page.wait_for_timeout(200)
                  await state(page,"home-character")
                  await page.click('.hub-global-nav [data-nav="home"]')
                  await page.wait_for_timeout(200)
                  await page.click('.town-command-grid [data-hub="guild"]')
                  await page.wait_for_timeout(200)
                  await state(page,"guild")
                  await page.click('#party .m')
                  await page.wait_for_timeout(200)
                  await state(page,"guild-character")
                  await page.click('.hub-global-nav [data-nav="back"]')
                  await page.wait_for_timeout(200)
                  await state(page,"guild-back")
                  await page.click('.hub-global-nav [data-nav="map"]')
                  await page.wait_for_timeout(200)
                  await state(page,"map")
                  await page.click('.hub-global-nav [data-nav="back"]')
                  await page.wait_for_timeout(200)
                  await state(page,"guild-map-back")
                  await page.click('.hub-global-nav [data-nav="home"]')
                  await page.wait_for_timeout(200)
                  await state(page,"home-final")
                  await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: persistent-hub-nav-capture
          path: |
            home.png
            home-character.png
            guild.png
            guild-character.png
            guild-back.png
            map.png
            guild-map-back.png
            home-final.png
          if-no-files-found: error
