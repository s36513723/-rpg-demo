name: RPG validation
on:
  push:
    branches: [main]
    paths:
      - 'battle-v29.js'
      - 'index.html'
      - 'ui-v29.css'
      - 'exploration/**'
      - 'rpg-*.js'
      - 'tests/**'
      - '.github/workflows/rpg-validation.yml'
  pull_request:
    paths:
      - 'battle-v29.js'
      - 'index.html'
      - 'ui-v29.css'
      - 'exploration/**'
      - 'rpg-*.js'
      - 'tests/**'
      - '.github/workflows/rpg-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax and skill catalog
        run: node tests/syntax.cjs
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Native browser regression
        run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpg-regression-results
          path: test-results.json
          retention-days: 7
