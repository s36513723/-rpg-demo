<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101319">
<title>RPG 戦闘デモ — Character Battle</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0c1117;--panel:#131a22;--panel2:#19222c;--line:#ffffff24;--gold:#d8c391;--gold2:#8f7c55;
  --text:#f4efe5;--muted:#aeb5bc;--hp:#d66f75;--sp:#67adad;--enemy:#e6a2a0;--ok:#a7d7be;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080c11;color:var(--text);overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;display:flex;justify-content:center}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{width:min(100%,480px);min-height:100svh;background:linear-gradient(#0f151d,#0b1016);position:relative;overflow:hidden;box-shadow:0 0 60px #000}
.topbar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #ffffff12;background:#0b1016e8;position:relative;z-index:20}
.brand{display:flex;align-items:baseline;gap:7px}.brand b{font:600 15px Georgia,"Yu Mincho",serif;letter-spacing:.08em}.brand small{font-size:8px;color:var(--muted);letter-spacing:.15em}
.top-actions{display:flex;gap:6px}.icon-btn{min-width:38px;height:32px;border:1px solid #ffffff22;border-radius:8px;background:#ffffff08;font-size:10px;padding:0 8px}
.turn-strip{height:54px;border-bottom:1px solid #ffffff12;background:#0d131ae8;display:flex;align-items:center;gap:5px;padding:5px 8px;overflow:hidden;position:relative;z-index:15}
.turn-label{font-size:8px;line-height:1.1;color:#8f99a3;letter-spacing:.12em;width:28px;flex:none;text-align:center}.turn-label b{display:block;color:var(--gold);font-size:10px;margin-bottom:2px}
.turns{display:flex;gap:4px;min-width:0;flex:1;overflow:hidden}
.turn-chip{width:38px;height:42px;border-radius:7px;border:1px solid #ffffff20;background:#18212a;position:relative;overflow:hidden;flex:none;box-shadow:inset 0 -13px 14px #0b1015cc}
.turn-chip img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;transform:scale(1.45);transform-origin:50% 18%}.turn-chip.enemy img{display:none}.turn-chip.enemy::before{content:"";position:absolute;inset:6px;border:1px solid #bd7777;border-radius:50% 50% 43% 43%;background:radial-gradient(circle at 50% 35%,#b7777777,#4b252a88 45%,#171b22 70%)}
.turn-chip.enemy::after{content:"◆";position:absolute;inset:0;display:grid;place-items:center;color:#e2a6a2;font-size:14px}.turn-chip.next{border-color:var(--gold);box-shadow:0 0 0 1px #d8c39166,inset 0 -13px 14px #0b1015cc}.turn-chip.next .n{background:var(--gold);color:#171b20}.turn-chip .n{position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#0b1015d9;display:grid;place-items:center;font-size:8px;z-index:2}
.battlefield{height:clamp(380px,54svh,470px);position:relative;overflow:hidden;isolation:isolate;background:
 radial-gradient(ellipse at 50% 80%,#c4b6871c 0 18%,transparent 53%),
 radial-gradient(ellipse at 22% 17%,#729c9b22,transparent 32%),
 linear-gradient(#2e4650 0%,#263b43 25%,#25343a 54%,#1f292f 75%,#171f25 100%)}
.battlefield::before{content:"";position:absolute;inset:0;background:
 linear-gradient(80deg,transparent 0 8%,#c6d5ce10 9% 10%,transparent 11% 100%),
 radial-gradient(ellipse at 55% 67%,transparent 0 30%,#09101455 75%),
 linear-gradient(180deg,transparent 58%,#10161b44 88%,#0d1318bb 100%);pointer-events:none;z-index:0}
.ruin{position:absolute;inset:0;pointer-events:none;opacity:.42;z-index:0}.ruin::before,.ruin::after{content:"";position:absolute;bottom:95px;width:92px;height:255px;border:10px solid #7b918d25;border-bottom:0;border-radius:65px 65px 0 0}.ruin::before{left:-40px;transform:rotate(-5deg)}.ruin::after{right:-42px;transform:rotate(6deg)}
.mist{position:absolute;height:80px;left:-20%;right:-20%;bottom:80px;background:radial-gradient(ellipse,#d6e4df22,transparent 65%);filter:blur(8px);animation:mist 7s ease-in-out infinite alternate;pointer-events:none;z-index:1}@keyframes mist{to{transform:translateX(8%) scaleX(1.08)}}
.round-badge{position:absolute;left:10px;top:9px;font:10px Georgia,serif;color:#d8c391;letter-spacing:.1em;z-index:8;text-shadow:0 1px 3px #000}.round-badge b{font-size:18px;color:white;letter-spacing:0;margin-left:4px}
.enemy-zone{position:absolute;left:3px;right:3px;top:24px;height:205px;z-index:4}
.enemy{position:absolute;border:0;background:none;padding:0;min-width:82px;height:188px;color:#fff;filter:drop-shadow(0 8px 9px #0009);transition:transform .16s,filter .16s;cursor:pointer}.enemy:active{transform:translateY(2px) scale(.98)}.enemy.selected{filter:drop-shadow(0 0 7px #e5d18d) drop-shadow(0 8px 9px #0009)}.enemy.selected .enemy-body{stroke:#f0d99c;stroke-width:2}.enemy.dead{opacity:.22;filter:grayscale(1)}
.enemy[data-id="brute"]{left:3%;top:20px}.enemy[data-id="guard"]{left:35%;top:1px}.enemy[data-id="mage"]{right:1%;top:25px}
.enemy svg{width:100%;height:100%;overflow:visible}.enemy-body{stroke:#c7d0d2;stroke-width:1.2;fill:url(#metalGrad)}.enemy-shadow{fill:#11171c;opacity:.92}.enemy-accent{fill:#8f6f6d}.enemy-glow{fill:#d1a1ba}.enemy-name{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:max-content;max-width:110px;font-size:10px;text-shadow:0 2px 4px #000}.enemy-hp{position:absolute;left:12px;right:12px;bottom:-7px;height:3px;background:#301d20;border-radius:3px;overflow:hidden}.enemy-hp i{display:block;height:100%;background:#c76d70;width:100%;transition:width .25s}.enemy-status{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:8px;color:#f1ca9f;text-shadow:0 1px 3px #000;white-space:nowrap}
.enemy-intent{position:absolute;right:8px;top:8px;border:1px solid #ffffff1e;background:#10161bbb;border-radius:6px;padding:4px 6px;font-size:8px;color:#c8cdd1;z-index:7}.enemy-intent b{color:#e0a3a1;font-weight:600}
.front-line{position:absolute;top:224px;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,#d8c39144,transparent);z-index:2}.front-line::after{content:"FRONT";position:absolute;left:50%;top:-7px;transform:translateX(-50%);font-size:7px;color:#d8c39166;letter-spacing:.2em;background:#26343a;padding:0 4px}
.actor-wrap{position:absolute;left:-12px;bottom:0;width:68%;height:285px;z-index:5;pointer-events:none}.actor-art{width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 12px 10px #0008);transition:opacity .15s,transform .18s;transform-origin:50% 100%}.actor-art.swap{opacity:.1;transform:translateX(-18px) scale(.96)}
.actor-info{position:absolute;left:12px;bottom:8px;z-index:8;text-shadow:0 1px 4px #000}.actor-info .job{font:600 9px Georgia,serif;letter-spacing:.18em;color:#e3cd9b}.actor-info .state{font-size:9px;color:#d3d7d9;margin-top:2px}.actor-info .state b{font-size:12px;color:#fff;margin-right:5px}.actor-info .bars{width:145px;display:grid;gap:3px;margin-top:4px}.mini-bar{height:4px;background:#0d1116aa;border-radius:4px;overflow:hidden;border:1px solid #ffffff14}.mini-bar i{display:block;height:100%;transition:width .25s}.mini-bar.hp i{background:#d66f75}.mini-bar.sp i{background:#67adad}
.formation-mini{position:absolute;right:10px;bottom:11px;width:112px;z-index:9;background:#0b1116bb;border:1px solid #ffffff20;border-radius:9px;padding:7px;backdrop-filter:blur(7px)}.formation-mini header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.formation-mini small{font-size:7px;color:#b5bcc1;letter-spacing:.14em}.formation-mini button{border:0;background:none;color:#d7c38e;font-size:8px;padding:0;min-height:18px}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.mini-slot{aspect-ratio:1;border:1px solid #ffffff19;border-radius:4px;display:grid;place-items:center;position:relative;background:#ffffff06}.mini-slot img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;border-radius:3px}.mini-slot.active{border-color:#e0c98c;box-shadow:0 0 0 1px #e0c98c55}.mini-slot.back::after{content:"B";position:absolute;right:1px;bottom:0;font-size:6px;color:#9eb5bb;text-shadow:0 1px 2px #000}
.float{position:absolute;z-index:30;font:bold 22px Georgia,serif;pointer-events:none;text-shadow:0 2px 5px #000;animation:float 1s ease-out forwards}.float.damage{color:#fff0dd}.float.heal{color:#a9dfc3}.float.status{font-size:12px;color:#efd69e}@keyframes float{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-36px) scale(1.05)}}
.hit{animation:hit .34s ease}.cast{animation:cast .5s ease}@keyframes hit{35%{transform:translateX(4px);filter:brightness(1.7)}70%{transform:translateX(-2px)}}@keyframes cast{50%{filter:drop-shadow(0 0 12px #e8d7ac) brightness(1.2)}}
.party-strip{height:72px;background:#0d1319;border-top:1px solid #ffffff18;border-bottom:1px solid #ffffff12;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:5px;position:relative;z-index:20}.party-member{min-width:0;border:1px solid #ffffff18;background:#151d26;border-radius:6px;padding:0;overflow:hidden;position:relative}.party-member img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;transform:scale(1.18);filter:saturate(.86)}.party-member::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#0e1318ed 78%)}.party-member.active{border-color:#dfca91;box-shadow:0 0 0 1px #dfca9166}.party-member.queued::before{content:"✓";position:absolute;right:3px;top:2px;z-index:3;color:#dfca91;font-size:10px;text-shadow:0 1px 2px #000}.party-member.dead{filter:grayscale(1);opacity:.4}.pm-job{position:absolute;z-index:3;left:3px;bottom:12px;font:600 6px Georgia,serif;letter-spacing:.06em;color:#eee6d8;white-space:nowrap}.pm-bars{position:absolute;z-index:3;left:3px;right:3px;bottom:3px;display:grid;gap:2px}.pm-bar{height:2px;background:#0008;border-radius:2px;overflow:hidden}.pm-bar i{display:block;height:100%}.pm-bar.hp i{background:#d66f75}.pm-bar.sp i{background:#67adad}
.command{background:linear-gradient(160deg,#18212a,#10171e);min-height:178px;padding:8px 9px max(9px,env(safe-area-inset-bottom));position:relative;z-index:20}.command-top{height:30px;display:flex;align-items:center;justify-content:space-between;gap:8px}.command-title{font-size:11px;color:#d9ddd9;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.command-title b{font:600 14px Georgia,"Yu Mincho",serif;color:white;margin-right:6px}.target-tip{font-size:8px;color:#aeb6bc;text-align:right}.target-tip strong{color:#e3cd94;font-weight:500}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:4px}.action{height:50px;border:1px solid #ffffff20;border-radius:7px;background:#171f28;display:grid;place-items:center;padding:3px 2px}.action b{font-size:12px;font-weight:600}.action small{font-size:7px;color:#9fa8af;margin-top:2px}.action.selected{border-color:#d9c188;background:#28261f;box-shadow:inset 0 0 18px #b99e5a13}.action.primary{background:linear-gradient(#d8c497,#b49d70);color:#151a1f;border-color:#ead8ae}.action.primary small{color:#473f33}.action:disabled{opacity:.35}
.sub-actions{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:5px;margin-top:5px}.sub-actions button{height:36px;border:1px solid #ffffff1c;border-radius:7px;background:#111820;font-size:9px}.sub-actions .resolve{background:#d7c18c;color:#161b20;font-weight:700;border-color:#f0d9a5}.sub-actions .resolve:disabled{background:#393a36;color:#8d8d86;opacity:.7}.queue-info{height:22px;display:flex;align-items:center;justify-content:space-between;color:#8f979e;font-size:8px;padding:0 2px}.queue-info span:last-child{color:#c6b88f}
.sheet{position:fixed;inset:auto 0 0;margin:auto;width:min(100%,480px);max-height:72svh;background:linear-gradient(#202a34,#121920);border:1px solid #756a52;border-bottom:0;border-radius:17px 17px 0 0;padding:8px 12px max(14px,env(safe-area-inset-bottom));z-index:100;box-shadow:0 -12px 60px #000b;transform:translateY(110%);transition:transform .2s ease}.sheet.open{transform:translateY(0)}.scrim{position:fixed;inset:0;background:#0206099e;z-index:90;display:none}.scrim.open{display:block}.handle{width:32px;height:3px;background:#756c5a;border-radius:3px;margin:0 auto 8px}.sheet-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff16;padding-bottom:8px}.sheet-head h2{font:500 17px Georgia,"Yu Mincho",serif;margin:0}.sheet-head button{width:38px;height:34px;border:1px solid #ffffff20;border-radius:7px;background:#ffffff08}.skill-list{display:grid;gap:6px;padding-top:8px}.skill{min-height:64px;text-align:left;border:1px solid #ffffff20;border-radius:8px;background:#151e27;padding:8px 9px;display:grid;grid-template-columns:1fr auto;gap:2px 8px}.skill b{font-size:13px}.skill .cost{font-size:10px;color:#dbc78f}.skill p{grid-column:1/-1;margin:2px 0 0;font-size:9px;line-height:1.45;color:#b6bdc2}.skill:disabled{opacity:.38}.formation-sheet .boards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:12px}.formation-board h3{font-size:9px;color:#afb5ba;letter-spacing:.12em;text-align:center;margin:0 0 7px}.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.fslot{aspect-ratio:1;border:1px solid #ffffff1d;border-radius:6px;background:#0e151b;display:grid;place-items:center;position:relative;font-size:9px;color:#a6adb2}.fslot img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;border-radius:5px}.fslot.enemy-dot{background:#321f23;color:#e5aaa7}.formation-note{font-size:9px;color:#aeb5ba;line-height:1.55;margin:11px 2px 0}.result{position:absolute;z-index:80;inset:0;background:#080c11dc;display:none;place-items:center;text-align:center;backdrop-filter:blur(4px)}.result.show{display:grid}.result-card{width:78%;border:1px solid #847555;border-radius:12px;background:#151d25;padding:24px 18px;box-shadow:0 14px 50px #000}.result-card small{font-size:9px;letter-spacing:.2em;color:#cbb783}.result-card h2{font:600 28px Georgia,"Yu Mincho",serif;margin:6px 0 8px}.result-card p{font-size:10px;color:#b7bec3;line-height:1.7;margin:0 0 15px}.result-card button{height:44px;width:100%;border:1px solid #dcc796;background:#c9b382;color:#171b20;border-radius:8px;font-weight:700}.toast{position:absolute;left:50%;bottom:191px;transform:translateX(-50%);z-index:85;background:#111820ee;border:1px solid #8d7b58;border-radius:7px;padding:7px 11px;font-size:9px;white-space:nowrap;box-shadow:0 5px 20px #0008;pointer-events:none;animation:toast 1.7s ease forwards}@keyframes toast{0%{opacity:0;transform:translate(-50%,5px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media(max-height:760px){.battlefield{height:380px}.actor-wrap{height:250px}.enemy-zone{height:180px}.enemy{height:166px}.front-line{top:205px}.party-strip{height:63px}.command{min-height:165px}.action{height:45px}}
@media(min-width:430px){.battlefield{height:470px}.actor-wrap{height:305px}.enemy{height:200px}.enemy-zone{height:220px}.party-strip{height:77px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><b>天穹の回廊</b><small>TACTICAL BATTLE</small></div>
    <div class="top-actions"><button class="icon-btn" id="formationBtn">陣形</button><button class="icon-btn" id="restartBtn">再戦</button></div>
  </header>
  <section class="turn-strip"><div class="turn-label"><b>NEXT</b>ORDER</div><div class="turns" id="turns"></div></section>
  <section class="battlefield" id="battlefield">
    <div class="ruin"></div><div class="mist"></div>
    <div class="round-badge">ROUND <b id="roundNo">1</b></div>
    <div class="enemy-intent">ENEMY <b id="enemyIntent">攻撃予兆</b></div>
    <div class="enemy-zone" id="enemyZone"></div>
    <div class="front-line"></div>
    <div class="actor-wrap"><img id="actorArt" class="actor-art" alt="現在行動中のキャラクター"></div>
    <div class="actor-info"><div class="job" id="actorJob"></div><div class="state"><b id="actorName"></b><span id="actorPos"></span></div><div class="bars"><span class="mini-bar hp"><i id="actorHpBar"></i></span><span class="mini-bar sp"><i id="actorSpBar"></i></span></div></div>
    <div class="formation-mini"><header><small>FORMATION</small><button id="formationBtn2">3×3 ›</button></header><div class="mini-grid" id="miniGrid"></div></div>
    <div class="result" id="result"><div class="result-card"><small id="resultKicker">BATTLE COMPLETE</small><h2 id="resultTitle">VICTORY</h2><p id="resultText"></p><button id="resultRestart">もう一度戦う</button></div></div>
  </section>
  <section class="party-strip" id="partyStrip"></section>
  <section class="command">
    <div class="command-top"><div class="command-title"><b id="cmdActor">WARRIOR</b><span id="cmdState">行動を選択</span></div><div class="target-tip" id="targetTip">敵をタップして<strong>対象選択</strong></div></div>
    <div class="actions">
      <button class="action selected" id="attackBtn"><span><b>攻撃</b><small id="attackMeta">近距離・斬</small></span></button>
      <button class="action" id="skillBtn"><span><b>スキル</b><small>SP消費</small></span></button>
      <button class="action" id="defendBtn"><span><b>防御</b><small>被ダメージ↓</small></span></button>
      <button class="action" id="shiftBtn"><span><b>SHIFT</b><small>前後列変更</small></span></button>
    </div>
    <div class="sub-actions"><button class="resolve" id="resolveBtn" disabled>ROUND START</button><button id="confirmBtn">この行動で決定</button><button id="undoBtn">入力取消</button><button id="autoBtn">AUTO</button></div>
    <div class="queue-info"><span id="queueInfo">0 / 6 入力済み</span><span id="battleMsg">前列を倒すと後列へ届きます</span></div>
  </section>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="skillSheet"><div class="handle"></div><header class="sheet-head"><h2>スキル</h2><button data-close>×</button></header><div class="skill-list" id="skillList"></div></section>
  <section class="sheet formation-sheet" id="formationSheet"><div class="handle"></div><header class="sheet-head"><h2>陣形</h2><button data-close>×</button></header><div class="boards"><div class="formation-board"><h3>ENEMY</h3><div class="fgrid" id="enemyBoard"></div></div><div class="formation-board"><h3>PARTY</h3><div class="fgrid" id="allyBoard"></div></div></div><p class="formation-note">上段＝後列、下段＝前列。戦闘画面では盤面を常時見せず、人物を主役にしています。SHIFTで現在キャラの前後列を変更できます。</p></section>

let party=[],enemies=[],round=1,actorIndex=0,selectedEnemy='guard',draft={type:'attack',skill:null},busy=false,ended=false;
const deep=x=>JSON.parse(JSON.stringify(x));
function reset(){party=deep(partyTemplate);enemies=deep(enemiesTemplate);round=1;actorIndex=0;selectedEnemy='guard';draft={type:'attack',skill:null};busy=false;ended=false;party.forEach(x=>{x.queued=null;x.defending=false;x.guard=0});$('result').classList.remove('show');renderAll();toast('戦闘開始');}
function aliveParty(){return party.filter(x=>x.hp>0)}function aliveEnemies(){return enemies.filter(x=>x.hp>0)}function actor(){return party[actorIndex]}
function nextUnqueued(start=0){for(let k=0;k<party.length;k++){let i=(start+k)%party.length;if(party[i].hp>0&&!party[i].queued)return i}return party.findIndex(x=>x.hp>0)}
function validEnemyTarget(a,e,range){if(!e||e.hp<=0)return false;if(range==='far')return true;const frontAlive=enemies.some(x=>x.hp>0&&x.row==='front');if(range==='near')return a.row==='front'&&e.row==='front';if(range==='mid')return e.row==='front'||!frontAlive;return true}
function defaultEnemy(a,range){let current=enemies.find(x=>x.id===selectedEnemy&&validEnemyTarget(a,x,range));if(current)return current;return enemies.find(x=>validEnemyTarget(a,x,range))||aliveEnemies()[0]}
function enemySvg(e){
 const common=`<svg viewBox="0 0 100 180" aria-hidden="true"><defs><linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#829399"/><stop offset=".48" stop-color="#35434b"/><stop offset="1" stop-color="#1b2329"/></linearGradient></defs>`;
 if(e.id==='guard')return common+`<ellipse class="enemy-shadow" cx="50" cy="170" rx="31" ry="7"/><path class="enemy-body" d="M36 25 44 14h12l9 11-4 22 12 16-7 70-10 31H44l-8-31-9-70 12-16Z"/><path class="enemy-accent" d="M32 64h36l5 20-11 12H38L27 84Z"/><path class="enemy-body" d="M32 54 10 78l9 38 22-12-5-42M66 56l18 12 6 47-20 2-5-48"/><path class="enemy-shadow" d="M42 25h16l6 11-6 8H42l-6-8Z"/><rect class="enemy-glow" x="45" y="33" width="10" height="2" rx="1"/></svg>`;
 if(e.id==='mage')return common+`<ellipse class="enemy-shadow" cx="50" cy="170" rx="29" ry="7"/><path class="enemy-body" d="M50 21 67 42 60 64l22 77-17 20H35l-17-20 22-77-7-22Z"/><path class="enemy-shadow" d="M38 40q12-22 24 0l-4 18H42Z"/><circle class="enemy-glow" cx="47" cy="45" r="2"/><circle class="enemy-glow" cx="55" cy="45" r="2"/><path class="enemy-accent" d="M27 79 8 118l10 4 20-31M73 79l19 39-10 4-20-31"/><circle class="enemy-glow" cx="90" cy="116" r="7"/></svg>`;
 return common+`<ellipse class="enemy-shadow" cx="50" cy="171" rx="32" ry="6"/><path class="enemy-body" d="M25 67 39 43l7-20 9 19 19 14 8 24-12 25 5 45-18 17H39l-14-17 7-45-15-18Z"/><path class="enemy-shadow" d="M33 58 45 48l13 1 11 10-10 13H41Z"/><path class="enemy-accent" d="M18 91 4 127l12 8 22-38M82 92l14 35-12 9-22-39"/><path class="enemy-body" d="M39 164 27 178M59 164l13 14"/><circle class="enemy-glow" cx="43" cy="59" r="2.2"/><circle class="enemy-glow" cx="57" cy="59" r="2.2"/></svg>`;
}
function renderEnemies(){const zone=$('enemyZone');zone.innerHTML='';for(const e of enemies){const b=document.createElement('button');b.className='enemy'+(e.id===selectedEnemy?' selected':'')+(e.hp<=0?' dead':'');b.dataset.id=e.id;b.disabled=busy||e.hp<=0;b.innerHTML=enemySvg(e)+`<span class="enemy-status">${statusText(e)}</span><span class="enemy-name">${e.name}</span><span class="enemy-hp"><i style="width:${clamp(e.hp/e.maxHp*100,0,100)}%"></i></span>`;b.onclick=()=>selectEnemy(e.id);zone.append(b)}}
function statusText(e){const s=[];if((e.status.poison||0)>0)s.push('猛毒');if((e.status.stun||0)>0)s.push('気絶');if((e.status.break||0)>0)s.push('防御↓');if((e.status.slow||0)>0)s.push('速度↓');if((e.status.weaken||0)>0)s.push('攻撃↓');return s.join('・')}
function selectEnemy(id){if(busy)return;selectedEnemy=id;renderEnemies();renderCommand()}
function renderActor(){let a=actor();if(!a||a.hp<=0){actorIndex=nextUnqueued(actorIndex+1);a=actor()}const img=$('actorArt');if(img.src!==IMG[a.id]){img.classList.add('swap');setTimeout(()=>{img.src=IMG[a.id];img.onload=()=>img.classList.remove('swap')},80)}$('actorJob').textContent=a.job;$('actorName').textContent=a.name;$('actorPos').textContent=(a.row==='front'?'前列':'後列')+` / HP ${Math.max(0,a.hp)}  SP ${Math.max(0,a.sp)}`;$('actorHpBar').style.width=clamp(a.hp/a.maxHp*100,0,100)+'%';$('actorSpBar').style.width=clamp(a.sp/a.maxSp*100,0,100)+'%'}
function renderParty(){const box=$('partyStrip');box.innerHTML='';party.forEach((p,i)=>{const b=document.createElement('button');b.className='party-member'+(i===actorIndex?' active':'')+(p.queued?' queued':'')+(p.hp<=0?' dead':'');b.disabled=busy||p.hp<=0;b.innerHTML=`<img src="${IMG[p.id]}" alt=""><span class="pm-job">${p.job}</span><span class="pm-bars"><i class="pm-bar hp"><i style="width:${clamp(p.hp/p.maxHp*100,0,100)}%"></i></i><i class="pm-bar sp"><i style="width:${clamp(p.sp/p.maxSp*100,0,100)}%"></i></i></span>`;b.onclick=()=>{actorIndex=i;draft={type:'attack',skill:null};renderAll()};box.append(b)})}
function renderMini(){const g=$('miniGrid');g.innerHTML='';for(const p of party){const s=document.createElement('div');s.className='mini-slot '+(p.row==='back'?'back ':'')+(p===actor()?'active':'');s.style.gridColumn=p.col;s.style.gridRow=p.row==='back'?1:2;s.innerHTML=`<img src="${IMG[p.id]}" alt="">`;g.append(s)}}
function renderBoards(){const eg=$('enemyBoard'),ag=$('allyBoard');eg.innerHTML=ag.innerHTML='';for(let r=0;r<2;r++)for(let c=1;c<=3;c++){const es=document.createElement('div');es.className='fslot enemy-dot';const e=enemies.find(x=>x.col===c&&x.row===(r===0?'back':'front')&&x.hp>0);es.textContent=e?e.name.slice(0,2):'·';eg.append(es);const as=document.createElement('div');as.className='fslot';const p=party.find(x=>x.col===c&&x.row===(r===0?'back':'front')&&x.hp>0);if(p)as.innerHTML=`<img src="${IMG[p.id]}" alt="${p.name}">`;else as.textContent='·';ag.append(as)}}
function estimateOrder(){const all=[...aliveParty().map(x=>({id:x.id,side:'ally',speed:x.speed+(x.status?.slow?-8:0)})),...aliveEnemies().map(x=>({id:x.id,side:'enemy',speed:x.speed-(x.status.slow?8:0)}))];return all.sort((a,b)=>b.speed-a.speed)}
function renderTurns(){const box=$('turns');box.innerHTML='';estimateOrder().slice(0,9).forEach((o,i)=>{const c=document.createElement('div');c.className='turn-chip '+(o.side==='enemy'?'enemy ':'')+(i===0?'next':'');c.innerHTML=`<span class="n">${i+1}</span>`+(o.side==='ally'?`<img src="${IMG[o.id]}" alt="">`:'');box.append(c)})}
function renderCommand(){const a=actor(),sel= draft.type==='skill'?draft.skill:null;['attackBtn','skillBtn','defendBtn','shiftBtn'].forEach(id=>$(id).classList.remove('selected'));$(draft.type==='attack'?'attackBtn':draft.type==='skill'?'skillBtn':draft.type==='defend'?'defendBtn':'shiftBtn').classList.add('selected');$('cmdActor').textContent=a.job;$('cmdState').textContent=a.queued?'入力済み — 変更できます':draft.type==='skill'&&sel?sel.name:'行動を選択';$('attackMeta').textContent=`${a.range==='far'?'遠距離':'近距離'}・${a.attr}`;const range=draft.type==='skill'&&sel?sel.range:a.range;const e=defaultEnemy(a,range);if(e&&selectedEnemy!==e.id&&!validEnemyTarget(a,enemies.find(x=>x.id===selectedEnemy),range))selectedEnemy=e.id;const target=defaultEnemy(a,range);$('targetTip').innerHTML=draft.type==='defend'||draft.type==='shift'?'<strong>対象不要</strong>':sel&&(sel.range==='self'||sel.range==='ally')?'<strong>味方対象は自動選択</strong>':target?`対象 <strong>${target.name}</strong>`:'<strong>届く敵がいません</strong>';$('confirmBtn').disabled=busy||a.hp<=0||((draft.type==='attack'||draft.type==='skill')&&sel?.range!=='self'&&sel?.range!=='ally'&&!target);const count=party.filter(x=>x.hp<=0||x.queued).length;$('queueInfo').textContent=`${count} / 6 入力済み`;$('resolveBtn').disabled=busy||aliveParty().some(x=>!x.queued);$('battleMsg').textContent=busy?'行動処理中…':a.queued?'入力内容をタップで変更できます':'敵をタップして対象を選択';}
function renderAll(){renderActor();renderParty();renderEnemies();renderMini();renderBoards();renderTurns();renderCommand();$('roundNo').textContent=round;$('enemyIntent').textContent=round%3===0?'術導師が詠唱':'前列が攻勢'}
function chooseAttack(){draft={type:'attack',skill:null};renderAll()}function chooseDefend(){draft={type:'defend',skill:null};renderAll()}function chooseShift(){draft={type:'shift',skill:null};renderAll()}
function openSkills(){if(busy)return;const a=actor(),box=$('skillList');box.innerHTML='';a.skills.forEach(s=>{const b=document.createElement('button');b.className='skill';b.disabled=a.sp<s.cost;b.innerHTML=`<b>${s.name}</b><span class="cost">SP ${s.cost}</span><p>${s.desc}</p>`;b.onclick=()=>{draft={type:'skill',skill:s};closeSheets();renderAll()};box.append(b)});openSheet('skillSheet')}
function openSheet(id){$('scrim').classList.add('open');$(id).classList.add('open')}function closeSheets(){$('scrim').classList.remove('open');document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('open'))}
function queueCurrent(){if(busy)return;const a=actor();let action={type:draft.type};if(draft.type==='skill'){if(!draft.skill)return openSkills();if(a.sp<draft.skill.cost)return toast('SPが足りません');action.skill=deep(draft.skill);if(!['self','ally'].includes(draft.skill.range)){const e=defaultEnemy(a,draft.skill.range);if(!e)return toast('届く敵がいません');action.target=e.id}}else if(draft.type==='attack'){const e=defaultEnemy(a,a.range);if(!e)return toast('届く敵がいません');action.target=e.id}a.queued=action;const ni=nextUnqueued(actorIndex+1);if(ni>=0)actorIndex=ni;draft={type:'attack',skill:null};renderAll();if(!aliveParty().some(x=>!x.queued))toast('全員入力完了 — ROUND START')}
function undoCurrent(){if(busy)return;const a=actor();if(a.queued){a.queued=null;toast(a.name+'の入力を取消') }else{const q=[...party].reverse().find(x=>x.queued&&x.hp>0);if(q){q.queued=null;actorIndex=party.indexOf(q);toast(q.name+'の入力を取消')}}renderAll()}
function autoQueue(){if(busy)return;for(const a of aliveParty()){if(a.queued)continue;if(a.hp/a.maxHp<.45&&['alchemist','mystic'].includes(a.id)){const s=a.skills.find(x=>x.effect.startsWith('heal'));if(s&&a.sp>=s.cost){a.queued={type:'skill',skill:deep(s)};continue}}const s=a.skills[0];const e=defaultEnemy(a,s.range);a.queued=s&&a.sp>=s.cost&&e?{type:'skill',skill:deep(s),target:e.id}:{type:'attack',target:defaultEnemy(a,a.range)?.id}}renderAll();toast('未入力をAUTO設定')}
function selectTargetForEnemy(e){let taunt=aliveParty().find(x=>x.taunt>0);if(taunt)return taunt;const fronts=aliveParty().filter(x=>x.row==='front');const pool=fronts.length?fronts:aliveParty();return pool[Math.floor(Math.random()*pool.length)]}
function physicalDamage(pow,target,bonus=0){let d=pow+bonus+Math.floor(Math.random()*9)-4;if(target.defending)d=Math.round(d*.55);if(target.guard>0)d=Math.round(d*.45);return Math.max(6,d)}
function enemyDamage(e,target){let p=e.pow;if(e.status.weaken>0)p-=9;return physicalDamage(p,target,round%3===0&&e.id==='mage'?10:0)}
function hitEnemyVisual(e,txt,cls='damage'){const el=document.querySelector(`.enemy[data-id="${e.id}"]`);if(el){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');floating(el,txt,cls)}}function hitActorVisual(a,txt,cls='damage'){if(a===actor()){$('actorArt').classList.remove('hit');void $('actorArt').offsetWidth;$('actorArt').classList.add('hit');floating($('actorArt'),txt,cls)}}
function floating(anchor,text,cls){const r=anchor.getBoundingClientRect(),bf=$('battlefield').getBoundingClientRect(),f=document.createElement('div');f.className='float '+cls;f.textContent=text;f.style.left=(r.left-bf.left+r.width/2)+'px';f.style.top=(r.top-bf.top+r.height*.38)+'px';$('battlefield').append(f);setTimeout(()=>f.remove(),1050)}
function healTarget(amount,strong=false){const t=[...aliveParty()].sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];if(!t)return;const h=Math.min(amount,t.maxHp-t.hp);t.hp+=h;hitActorVisual(t,'+'+h,'heal');if(t!==actor())toast(t.name+' HP +'+h);}
async function allyAct(a){const q=a.queued;if(!q||a.hp<=0)return;actorIndex=party.indexOf(a);renderAll();await wait(260);if(q.type==='defend'){a.defending=true;toast(a.name+'は防御態勢');await wait(360);return}if(q.type==='shift'){a.row=a.row==='front'?'back':'front';toast(a.name+' → '+(a.row==='front'?'前列':'後列'));await wait(420);return}let skill=q.type==='skill'?q.skill:null;if(skill){if(a.sp<skill.cost){toast(a.name+' SP不足');return}a.sp-=skill.cost;if(skill.effect==='guard'){a.guard=1;$('actorArt').classList.add('cast');toast('守護祈願');await wait(450);return}if(skill.effect==='heal'){healTarget(46);await wait(500);return}if(skill.effect==='healStrong'){healTarget(62,true);await wait(500);return}}const range=skill?.range||a.range;let e=enemies.find(x=>x.id===q.target&&validEnemyTarget(a,x,range))||defaultEnemy(a,range);if(!e)return;let dmg=physicalDamage(skill?.power||a.pow,e,0);if(skill?.effect==='execute'&&Object.values(e.status).some(v=>v>0))dmg=Math.round(dmg*1.45);if(skill?.effect==='fire'&&e.type==='重装')dmg=Math.round(dmg*1.25);if((skill?.effect==='break'))e.status.break=2;if(skill?.effect==='poison')e.status.poison=3;if(skill?.effect==='stun'&&Math.random()<.58)e.status.stun=1;if(skill?.effect==='slow')e.status.slow=2;if(skill?.effect==='weaken')e.status.weaken=2;if(skill?.effect==='taunt')a.taunt=2;e.hp=Math.max(0,e.hp-dmg);hitEnemyVisual(e,'-'+dmg);$('battleMsg').textContent=`${a.name}「${skill?.name||'通常攻撃'}」 → ${e.name} ${dmg}`;renderEnemies();await wait(560)}
async function enemyAct(e){if(e.hp<=0)return;if(e.status.stun>0){toast(e.name+'は気絶して動けない');await wait(380);return}const t=selectTargetForEnemy(e);if(!t)return;let dmg=enemyDamage(e,t);t.hp=Math.max(0,t.hp-dmg);hitActorVisual(t,'-'+dmg);$('battleMsg').textContent=`${e.name} → ${t.name} ${dmg}`;await wait(520)}
function endRoundTicks(){for(const e of aliveEnemies()){if(e.status.poison>0){const d=12;e.hp=Math.max(0,e.hp-d);e.status.poison--;hitEnemyVisual(e,'毒 '+d,'status')}for(const k of ['break','slow','weaken','stun'])if(e.status[k]>0)e.status[k]--}for(const p of aliveParty()){p.sp=Math.min(p.maxSp,p.sp+6);p.defending=false;if(p.guard>0)p.guard--;if(p.taunt>0)p.taunt--}party.forEach(x=>x.queued=null)}
async function resolveRound(){if(busy||aliveParty().some(x=>!x.queued))return;busy=true;renderAll();const order=estimateOrder();for(const o of order){if(ended)break;if(o.side==='ally'){const a=party.find(x=>x.id===o.id);await allyAct(a)}else{const e=enemies.find(x=>x.id===o.id);await enemyAct(e)}renderAll();if(!aliveEnemies().length){finish(true);break}if(!aliveParty().length){finish(false);break}}if(!ended){endRoundTicks();round++;actorIndex=nextUnqueued(0);draft={type:'attack',skill:null};busy=false;renderAll();toast('ROUND '+round)} }
function finish(win){ended=true;busy=false;$('resultKicker').textContent=win?'BATTLE COMPLETE':'PARTY DEFEATED';$('resultTitle').textContent=win?'VICTORY':'DEFEAT';$('resultText').textContent=win?`Round ${round} で敵部隊を撃破。キャラクター画像・対象選択・SP・前後列・行動順の操作確認ができます。`:'全員が戦闘不能になりました。陣形と防御を使って再挑戦できます。';$('result').classList.add('show')}
function toast(text){const old=document.querySelector('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.textContent=text;$('app').append(t);setTimeout(()=>t.remove(),1750)}
$('attackBtn').onclick=chooseAttack;$('skillBtn').onclick=openSkills;$('defendBtn').onclick=chooseDefend;$('shiftBtn').onclick=chooseShift;$('confirmBtn').onclick=queueCurrent;$('undoBtn').onclick=undoCurrent;$('autoBtn').onclick=autoQueue;$('resolveBtn').onclick=resolveRound;$('restartBtn').onclick=reset;$('resultRestart').onclick=reset;$('formationBtn').onclick=()=>openSheet('formationSheet');$('formationBtn2').onclick=()=>openSheet('formationSheet');$('scrim').onclick=closeSheets;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
reset();
</script>
</body>
