<!doctype html>
<html lang="ja" data-build="40"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b121d"><title>薄明の回廊</title><link rel="stylesheet" href="ui-v32.css"><link rel="stylesheet" href="compact-v34.css"><link rel="stylesheet" href="stylish-v35.css"><link rel="stylesheet" href="turn-v36.css"><link rel="stylesheet" href="portrait-v37.css"><link rel="stylesheet" href="enemy-v38.css"><link rel="stylesheet" href="context-v39.css"><link rel="stylesheet" href="rear-v40.css"></head><body><aside id="bootStatus" class="boot-status"><p>読み込み中…</p><a href="https://s36513723.github.io/-rpg-demo/play-v33.html?v=40">ブラウザ版を開く</a></aside><svg aria-hidden="true" class="svg-library" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-sword" viewBox="0 0 24 24"><path d="m5 19 3-3m1-5 4 4M9 12 18 3l3 0 0 3-9 9M4 16l4 4M3 21l2-2"></path></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3L12 2Z"></path><path d="m19 3 2 2M3 3l2 2"></path></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6l8-3Z"></path><path d="M12 7v10"></path></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 20V4m-4 4 4-4 4 4M17 4v16m-4-4 4 4 4-4"></path></symbol>
<symbol id="i-equip" viewBox="0 0 24 24"><path d="M4 8a8 8 0 0 1 13-4l3 3M20 3v4h-4M20 16a8 8 0 0 1-13 4l-3-3M4 21v-4h4M9 15l6-6m-4 0 4 4"></path></symbol>
<symbol id="i-exit" viewBox="0 0 24 24"><path d="M10 3H4v18h6m4-5 4-4-4-4M9 12h12"></path></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 1v5m0 12v5M1 12h5m12 0h5"></path></symbol>
<symbol id="i-fire" viewBox="0 0 24 24"><path d="M13 2c2 6-5 7-3 12 2 0 4-3 5-5 4 4 6 7 3 11-4 4-12 2-13-3-1-5 3-7 3-11 1 3 2 3 2 3l3-7Z"></path></symbol>
<symbol id="i-bow" viewBox="0 0 24 24"><path d="M5 3c13 1 13 17 0 18l6-9-6-9ZM2 12h20m-4-3 4 3-4 3"></path></symbol>
<symbol id="i-hammer" viewBox="0 0 24 24"><path d="m6 3 11 5-3 7-11-5 3-7Zm5 11-3 7 3 1 3-7"></path></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20 4 12C-1 5 7 1 12 7 17 1 25 5 20 12l-8 8Z"></path><path d="M12 10v6m-3-3h6"></path></symbol>
<symbol id="i-scroll" viewBox="0 0 24 24"><path d="M7 3h12l-3 18H4L7 3Z M9 7h6m-7 4h6m-7 4h5"></path></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8V4Z"></path></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5c-4-3-8-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-2-1-6-2-10 1Zm0 0v15"></path></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol><symbol id="i-fast" viewBox="0 0 24 24"><path d="m3 5 8 7-8 7V5Zm10 0 8 7-8 7V5Z"/></symbol><symbol id="i-restart" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 8M3 3v7h7"/></symbol><symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15a9 9 0 0 1-11-12 9 9 0 1 0 11 12Z"/></symbol></defs></svg>
<main id="game">
 <header class="hud">
  <div class="round-label" aria-label="現在のラウンド"><small>R</small><b id="round">01</b></div>
  <nav id="turnOrder" class="order" aria-label="行動順の予測"></nav>
  <button id="auto" class="hud-button" title="このラウンドだけ自動戦闘">Auto</button>
  <button id="pace" class="hud-button" aria-label="再生速度を変更">1×</button>
  <button id="more" class="hud-button" aria-label="戦闘メニュー"><svg class="icon"><use href="#i-more"/></svg></button>
 </header>
 <div class="scene-meta"><button id="terrainButton" class="terrain-toggle" aria-label="地形の効果"><svg class="icon"><use href="#i-moon"/></svg><span id="terrainEffect">狭所</span></button><button id="historyButton" class="history-trigger" aria-label="戦闘履歴" aria-expanded="false"><svg class="icon"><use href="#i-book"/></svg></button></div>
 <section id="enemyStage" class="enemy-stage" aria-label="敵の全身表示。上段が後列、下段が前列">
  <div class="enemy-lane enemy-back-lane"><div id="eb" class="enemy-row" role="group" aria-label="敵・後列"></div></div>
  <div class="enemy-lane enemy-front-lane"><div id="ef" class="enemy-row" role="group" aria-label="敵・前列"></div></div>
 </section>
 <section id="allies" class="allies" aria-label="味方6人。上段が前列、下段が後列">
  <div id="pf" class="row ally-row" role="group" aria-label="味方・前列"></div>
  <div id="pb" class="row ally-row" role="group" aria-label="味方・後列"></div>
 </section>
 <section id="commandPanel" class="command-panel" aria-label="コマンド">
  <div id="actorArt" class="actor-art" aria-hidden="true"><img id="actorPortrait" alt="" draggable="false"></div>
  <div class="command-content">
   <button id="actor" class="actor-button" aria-label="操作する仲間を変更"><b id="actorName">ガルド</b></button>
   <div id="commandInput">
    <div class="target-line"><span id="targetHint" class="target-hint" aria-live="polite"></span><button id="cancelTarget" class="text-button" hidden>取消</button></div>
    <div class="command-buttons">
     <button id="attack" class="command attack"><svg class="icon"><use href="#i-sword"/></svg><b>攻撃</b></button>
     <button id="skills" class="command magic" aria-haspopup="dialog"><svg class="icon"><use href="#i-star"/></svg><b>技</b></button>
     <button id="defend" class="command guard"><svg class="icon"><use href="#i-shield"/></svg><b>防御</b></button>
     <button id="swap" class="command"><svg class="icon"><use href="#i-swap"/></svg><b>交代</b></button>
     <button id="switch" class="command"><svg class="icon"><use href="#i-equip"/></svg><b>換装</b></button>
     <button id="resolve" class="command round-start" disabled><svg class="icon"><use href="#i-play"/></svg><b>ラウンド開始</b><small id="queueCount">0/6</small></button>
    </div>
   </div>
   <div id="battleMessage" class="battle-message" hidden><p id="battleMessageText" role="status" aria-live="polite"></p><div class="playback-tools"><button id="pause" aria-label="一時停止" aria-pressed="false"><svg class="icon"><use href="#i-pause"/></svg></button><button id="nextMessage" aria-label="次のメッセージ"><svg class="icon"><use href="#i-fast"/></svg></button></div></div>
  </div>
 </section>
 <details id="history" class="history"><summary>履歴</summary><div id="log" class="log" role="log" aria-label="戦闘履歴" tabindex="0"></div></details>
 <div id="notice" class="notice" role="status" hidden></div>
 <div hidden><span id="engineStatus"></span><span id="actorJob"></span><span id="playbackTitle"></span><span id="inputHint"></span><span id="logCount"></span><span id="lastLog"></span><button id="new">新しい戦闘</button></div>
 <noscript><p>JavaScriptを有効にしたブラウザで開いてください。</p></noscript>
</main>
<dialog id="choiceSheet" class="choice-sheet" aria-labelledby="sheetTitle"><div class="sheet-handle" aria-hidden="true"></div><header class="sheet-head"><div><small id="sheetKicker"></small><h2 id="sheetTitle">技</h2></div><button id="closeSheet" aria-label="閉じる">×</button></header><p id="sheetHint" class="sheet-hint"></p><div id="sheetList" class="sheet-list"></div></dialog>
<script src="battle-v35.js" defer></script></body></html>
