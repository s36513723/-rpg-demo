<script>
var RPG_STORE=(function(){
  var PREFIX='RPG_DEMO_STATE_V1:';
  var mode=new URLSearchParams(location.search).get('demo');
  var hubPreview=mode==='hub',explorationDemo=mode==='exploration';
  var previewPrefix='rpg.exploration.preview:';
  function previewGet(k){try{return sessionStorage.getItem(previewPrefix+k)}catch(e){return null}}
  function previewSet(k,v){try{sessionStorage.setItem(previewPrefix+k,String(v))}catch(e){}}
  function previewRemove(k){try{sessionStorage.removeItem(previewPrefix+k)}catch(e){}}
  function storageKey(k){return explorationDemo?'rpg.exploration.demo:'+k:k}
  function named(){
    try{
      if(!window.name||window.name.indexOf(PREFIX)!==0)return {};
      var v=JSON.parse(window.name.slice(PREFIX.length));
      return v&&typeof v==='object'?v:{};
    }catch(e){return {}}
  }
  function saveNamed(v){try{window.name=PREFIX+JSON.stringify(v)}catch(e){}}
  function localGet(k){try{return window.localStorage.getItem(storageKey(k))}catch(e){return null}}
  function localSet(k,v){try{window.localStorage.setItem(storageKey(k),v)}catch(e){}}
  function localRemove(k){try{window.localStorage.removeItem(storageKey(k))}catch(e){}}
  return {
    isHubPreview:hubPreview,
    isExplorationDemo:explorationDemo,
    getItem:function(k){
      if(hubPreview)return previewGet(k);
      if(location.protocol==='file:'){
        var n=named();
        if(Object.prototype.hasOwnProperty.call(n,k))return n[k];
        var v=localGet(k);
        if(v!==null){n[k]=v;saveNamed(n)}
        return v;
      }
      return localGet(k);
    },
    setItem:function(k,v){
      if(hubPreview){previewSet(k,v);return}
      v=String(v);localSet(k,v);
      if(location.protocol==='file:'){var n=named();n[k]=v;saveNamed(n)}
    },
    removeItem:function(k){
      if(hubPreview){previewRemove(k);return}
      localRemove(k);
      if(location.protocol==='file:'){var n=named();delete n[k];saveNamed(n)}
    }
  };
})();
var RPG_NAV=(function(){
  function importHash(){
    var m=location.hash.match(/(?:^#|&)rpg=([^&]+)/);
    if(!m)return;
    try{
      var d=JSON.parse(decodeURIComponent(m[1]));
      Object.keys(d||{}).forEach(function(k){RPG_STORE.setItem(k,d[k])});
      if(window.history&&history.replaceState)history.replaceState(null,'',location.pathname+location.search);
    }catch(e){}
  }
  function href(path,keys){
    if(RPG_STORE.isHubPreview)return path+(path.includes('?')?'&':'?')+'demo=hub';
    var d={};
    (keys||['rpg.exploreBattle','rpg.exploration.save1']).forEach(function(k){
      var v=RPG_STORE.getItem(k);
      if(v!==null)d[k]=v;
    });
    if(RPG_STORE.isExplorationDemo)path+=(path.includes('?')?'&':'?')+'demo=exploration';
    return path+(Object.keys(d).length?'#rpg='+encodeURIComponent(JSON.stringify(d)):'');
  }
  importHash();
  return {href:href};
})();
</script>

<body>

async function executeItem(u,q,token){const x=q.item;if((carryRemaining[x]||0)<=0){await say(x+'が不足。',token,'sys');return}const target=party.find(t=>t.id===q.targetId&&t.alive)||u;if(x==='回復薬'&&target.hp===target.maxHp||x==='解毒薬'&&!target.status.poison){await say('使用が必要な対象なし。',token,'sys');return}recordCarryUse(x);if(x==='回復薬')target.hp=Math.min(target.maxHp,target.hp+Math.floor(target.maxHp*.35));if(x==='薬瓶'){target.hp=Math.min(target.maxHp,target.hp+25);target.sp=Math.min(target.maxSp,target.sp+12)}if(x==='解毒薬'){target.status.poison=0;target.statusPower.poison=0}if(x==='煙玉'){for(const e of live(enemies))await applyStatuses(u,e,{blind:75,stat:'SKL'},token)}if(x==='爆弾'){const t=enemies.find(e=>e.id===q.targetId&&e.alive)||live(enemies)[0];if(t){const d=damage(u,t,{kind:'throw',power:20,stat:'SKL',attr:'火',mult:1,range:'far',scope:'single',target:'enemy'});t.hp=Math.max(0,t.hp-d.value);await say(t.name+'に爆弾 '+d.value,token,'ok');await defeated(t,token)}}await say(u.name+'が'+x+'を使用。',token,'ok')}
function enemySkill(u,name,fallback=normal(u)){return importSkill(name,u)||fallback}
function enemyPreferredTarget(u,ts,mode){
 if(!ts.length)return null;
 if(mode==='back')return ts.slice().sort((a,b)=>(a.row==='back'?0:1)-(b.row==='back'?0:1)||a.hp-b.hp)[0];
 if(mode==='lowHp')return ts.slice().sort((a,b)=>a.hp-b.hp)[0];
 return preferredTarget(u,ts)
}
function planEnemy(u){
 if(u.status?.temptation>0){
  const a=normal(u),own=live(actorSide(u)).filter(t=>t.id!==u.id),t=own[0];
  if(t)return {type:'attack',action:a,targetId:t.id};
 }
 if(u.style==='BOSS'){const a=makeBossTelegraph(u),ts=targets(u,a),t=ts.find(x=>a.targetRow?x.row===a.targetRow:true)||preferredTarget(u,ts);return {type:'skill',action:a,targetId:t?.id}}
 if(u.casting)return {type:'cast',action:u.casting.action,targetId:u.casting.targetId};
 const kind=u.archetype||enemyArchetype(u.style)||'獣';
 if(['弓','飛行','魔術師'].includes(kind)&&u.row==='front'&&freeColumn('back',enemies)&&u.status.legBind<=0)return {type:'row'};
 if(kind==='重装'&&round%3===1)return {type:'defend'};
 let a,targetMode='normal';
 if(kind==='獣'){
  a=round%3===0?{...normal(u),name:'飛び掛かり',kind:'skill',range:'mid',mult:1.25,speed:8,stun:25,body:['legs'],cost:0}:normal(u);
  targetMode='lowHp'
 }else if(kind==='軽装'){
  a=round%3===2?{...normal(u),name:'煙幕斬り',kind:'skill',range:'mid',mult:.85,blind:55,speed:10,body:['arms'],cost:0}:normal(u);
  targetMode='back'
 }else if(kind==='重装'){
  a=round%3===0?{...normal(u),name:'重打',kind:'skill',scope:'row',mult:1.05,stun:30,speed:-8,body:['arms'],cost:0}:normal(u)
 }else if(kind==='魔術師'){
  a=enemySkill(u,/呪術師|死霊/.test(u.style)?'猛毒呪':/神官/.test(u.style)?'聖光':'火球');
  if(round%3===0)a={...a,cast:1,mult:(a.mult||1)*1.25,scope:'row',cost:Math.min(16,a.cost||16)}
 }else if(kind==='弓'){
  a=round%3===0?{...enemySkill(u,'脚封じ射ち'),name:'封脚矢',legBind:55,cost:0}:{...enemySkill(u,'狙撃'),cost:0};
  a.targeting={...(a.targeting||{}),side:'enemy',column:'select',order:'last',area:'single',ignoreTaunt:true};
  targetMode='back'
 }else if(kind==='飛行'){
  a=round%2===0?{...normal(u),name:'急降下',kind:'skill',range:'far',mult:1.25,speed:12,body:['legs'],cost:0}:{...enemySkill(u,'風刃'),cost:0};
  targetMode='back'
 }else if(kind==='ゴーレム'){
  a=round%3===0?{...enemySkill(u,'地震'),name:'地震',cost:0,cast:0,scope:'all',mult:.85,speed:-12}:{...normal(u),name:'重打',mult:1.2,speed:-8}
 }
 if(!a||blocked(u,a))a=normal(u);
 if(a.costType&&!enough(u,a))a={...a,cost:0,costType:null};
 if(u.elite&&round%2===0)a={...a,name:'強敵の'+a.name,mult:(a.mult||1)*1.12,stun:Math.max(a.stun||0,35),cost:0,costType:null};
 const ts=targets(u,a),t=enemyPreferredTarget(u,ts,targetMode);
 return {type:a.kind==='attack'?'attack':'skill',action:a,targetId:t?.id}
}
function preparePlans(){for(const u of live(enemies)){u.plan=planEnemy(u);u.defending=u.plan.type==='defend'}for(const u of party){u.queued=!u.alive?null:u.casting?{type:'cast',action:u.casting.action,targetId:u.casting.targetId,partId:u.casting.partId}:null;if(u.alive&&(u.status.sleep>0||u.status.stun>0))u.queued={type:'skip'}}}
async function endRound(token){for(const u of [...party,...enemies]){if(!u.alive)continue;if(terrain.name==='毒沼'&&u.status.poison<=0&&Math.random()*100<Math.max(5,18-statusResist(u,'poison')*.3)){u.status.poison=2;u.statusPower.poison=10;await say(u.name+'は毒沼で猛毒を受けた。',token,'sys')}if(u.status.poison>0){const n=Math.max(1,Math.floor(u.maxHp*.04*(u.style==='BOSS'?.5:1)+(u.statusPower.poison||0)*.04));u.hp=Math.max(0,u.hp-n);await say(u.name+'に猛毒 '+n,token,'sys');await defeated(u,token)}if(!u.alive)continue;const r=buff(u,'regen');if(r>0)u.hp=Math.min(u.maxHp,u.hp+Math.ceil(u.maxHp*r));for(const k of Object.keys(u.status)){if(u.status[k]>0){if(u.statusHold[k])u.statusHold[k]=false;else u.status[k]--}}for(const k of Object.keys(u.statusBuildup))u.statusBuildup[k]=Math.max(0,u.statusBuildup[k]-10);tickTimed(u);if(u.spOnceAvailable&&u.sp<u.maxSp){u.sp=Math.min(u.maxSp,u.sp+passive(u,'spOnce'));u.spOnceAvailable=false}}
 if(await checkEnd(token))return;
 for(const sm of summons){const owner=[...party,...enemies].find(u=>u.id===sm.owner);if(!owner?.alive){sm.turns=0;continue}const side=sm.enemy?enemies:party,opp=sm.enemy?party:enemies,t=live(opp)[0];if(sm.type==='guard'){for(const u of live(side))setTimed(u,'guard',.1,1,sm.name)}else if(t){const n=Math.max(1,Math.floor(sm.power*.25));t.hp=Math.max(0,t.hp-n);if(sm.type==='undead')owner.hp=Math.min(owner.maxHp,owner.hp+Math.floor(n*.3));await say(sm.name+'の追撃 '+n,token,'sys');await defeated(t,token)}sm.turns--;if(await checkEnd(token))break}summons=summons.filter(s=>s.turns>0)
}
