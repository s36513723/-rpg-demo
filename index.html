<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6人パーティ戦闘デモ</title><link rel="stylesheet" href="style-v3.css"></head><body><main>
<div class="top"><div><h1>6人パーティ戦闘デモ</h1><div class="muted">前後列・射程・弱点・SP/MP・状態異常・換装を試せます。</div></div>
<div class="pills"><span id="engineStatus" class="pill" style="color:var(--warn)">JavaScript未実行</span><span id="round" class="pill">Round 1</span><span id="terrain" class="pill">地形: 読込前</span><span id="phase" class="pill">待機</span></div></div>

<div class="rowtitle"><span>敵 後列</span><span>④－⑤－⑥</span></div><div id="eb" class="row"></div>
<div class="rowtitle"><span>敵 前列</span><span>①－②－③</span></div><div id="ef" class="row"></div>
<div class="divider"></div>
<div class="rowtitle"><span>味方 前列</span><span>①－②－③</span></div><div id="pf" class="row"></div>
<div class="rowtitle"><span>味方 後列</span><span>④－⑤－⑥</span></div><div id="pb" class="row"></div>

<section class="panel command-panel">
  <div class="command-head">
    <div>
      <div class="muted">現在の入力</div>
      <div id="actor" class="actor-name">-</div>
      <div id="ainfo" class="muted">味方カードをタップすると入力キャラを変更できます。</div>
    </div>
    <div class="pills"><button id="new" class="secondary" type="button">新しい戦闘</button><button id="resolve" class="primary" type="button" disabled>ラウンド開始</button></div>
  </div>

  <div class="command-stack">
    <label for="weaponSelect">換装</label>
    <select id="weaponSelect"></select>
    <button id="switch" class="secondary full" type="button">換装</button>

    <label for="action">行動</label>
    <select id="action"></select>

    <label for="target">対象</label>
    <select id="target"></select>

    <label for="swapSel">列変更</label>
    <select id="swapSel"></select>

    <div class="command-buttons">
      <button id="defend" class="secondary" type="button">防御</button>
      <button id="escape" class="secondary" type="button">逃走</button>
    </div>

    <div class="command-buttons">
      <button id="queue" class="primary" type="button">行動決定</button>
      <button id="swap" class="secondary" type="button">列変更</button>
    </div>
  </div>
</section>

<div id="jsWarning" class="panel" style="border-color:#8b6b2d;background:#211b10">
<strong>操作できない場合</strong>
<div class="muted" style="margin-top:5px">この表示が残っている場合、JavaScriptが実行されていません。</div>
</div>
<section class="panel"><div class="top"><strong>戦闘ログ</strong><button id="clear" class="secondary" type="button">ログ消去</button></div><div id="log" class="log" aria-live="polite"></div></section>
<div id="result" class="result hidden"><div id="rtitle" style="font-size:20px;font-weight:800"></div><div id="rtext" class="muted" style="margin-top:4px"></div></div>
<script src="data-v3.js"></script><script src="app-v3.js"></script></main></body></html>
