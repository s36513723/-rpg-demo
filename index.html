<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6人パーティ戦闘デモ</title><link rel="stylesheet" href="style-v18.css"></head><body><main>
<div class="title-row"><div class="title-main"><h1>6人パーティ戦闘デモ</h1><span id="engineStatus" class="js-status" style="color:var(--warn)">JavaScript未実行</span></div><button id="new" class="secondary title-new" type="button">新しい戦闘</button></div>

<div id="eb" class="row battlefield-row"></div>
<div id="ef" class="row battlefield-row"></div>
<div class="divider"></div>
<div id="pf" class="row battlefield-row"></div>
<div id="pb" class="row battlefield-row"></div>

<section class="panel command-panel">
  <div class="command-head"><div id="actor" class="actor-name">-</div><div class="command-main-actions"><span id="round" class="round-inline">Round 1</span><button id="resolve" class="primary" type="button" disabled>ラウンド開始</button><button id="auto" class="secondary auto-button" type="button">Auto</button></div></div>
  <div id="battleMessage" class="battle-message" aria-live="assertive"><div id="battleMessageText" class="battle-message-text"></div></div>

  <div class="command-stack">
    <div id="terrainEffect" class="terrain-effect plain"></div>
    <div class="field-row action-row"><button id="switch" class="secondary" type="button">換装</button><select id="action"></select></div>

    <select id="target" class="target-state" tabindex="-1" aria-hidden="true"></select>

    <div class="command-buttons four">
      <button id="queue" class="primary" type="button">決定</button>
      <button id="swap" class="secondary" type="button">交代</button>
      <button id="defend" class="secondary" type="button">防御</button>
      <button id="escape" class="secondary" type="button">逃走</button>
    </div>
  </div>
</section>

<div id="jsWarning" class="panel" style="border-color:#8b6b2d;background:#211b10">
<strong>操作できない場合</strong>
<div class="muted" style="margin-top:5px">この表示が残っている場合、JavaScriptが実行されていません。</div>
</div>
<section class="panel log-panel"><div id="log" class="log" aria-live="polite"></div></section>
<script src="data-v16.js"></script><script src="app-v16.js"></script></main></body></html>
