<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6人パーティ戦闘デモ</title><link rel="stylesheet" href="style-v7.css"></head><body><main>
<div class="top"><div><h1>6人パーティ戦闘デモ</h1></div>
<div class="pills"><span id="engineStatus" class="pill" style="color:var(--warn)">JavaScript未実行</span><span id="round" class="pill">Round 1</span><span id="terrain" class="pill">地形: 読込前</span><span id="phase" class="pill">待機</span></div></div>

<div class="battle-actions"><button id="new" class="secondary" type="button">新しい戦闘</button><button id="resolve" class="primary" type="button" disabled>ラウンド開始</button></div>
<div id="eb" class="row battlefield-row"></div>
<div id="ef" class="row battlefield-row"></div>
<div class="divider"></div>
<div id="pf" class="row battlefield-row"></div>
<div id="pb" class="row battlefield-row"></div>

<section class="panel command-panel">
  <div class="command-head"><div id="actor" class="actor-name">-</div></div>

  <div class="command-stack">
    <div class="terrain-switch-row"><div id="terrainEffect" class="terrain-effect"></div><button id="switch" class="secondary" type="button">換装</button></div>
    <div class="field-row"><label for="action">行動</label><select id="action"></select></div>

    <div class="field-row"><label for="target">対象</label><select id="target"></select></div>

    <div class="command-buttons four">
      <button id="queue" class="primary" type="button">攻撃</button>
      <button id="swap" class="secondary" type="button">交代</button>
      <button id="defend" class="secondary" type="button">防御</button>
      <button id="escape" class="secondary" type="button">逃走</button>
    </div>
  </div>
</section>

<div id="jsWarning" class="panel" style="border-color:#8b6b2d;background:#211b10">
<strong>操作できない場合</strong>
<div class="muted" style="margin-top:5px">この表示が残っている場合、JavaScriptが実行されていません。</div>
</div>
<section class="panel"><div class="top"><strong>戦闘ログ</strong><button id="clear" class="secondary" type="button">ログ消去</button></div><div id="log" class="log" aria-live="polite"></div></section>
<div id="result" class="result hidden"><div id="rtitle" style="font-size:20px;font-weight:800"></div><div id="rtext" class="muted" style="margin-top:4px"></div></div>
<script src="data-v7.js"></script><script src="app-v6.js"></script></main></body></html>
