<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6人パーティ戦闘デモ</title><link rel="stylesheet" href="style-v11.css"></head><body><main>
<div class="title-row"><h1>6人パーティ戦闘デモ</h1><span id="engineStatus" class="js-status" style="color:var(--warn)">JavaScript未実行</span></div>

<div id="eb" class="row battlefield-row"></div>
<div id="ef" class="row battlefield-row"></div>
<div class="divider"></div>
<div id="pf" class="row battlefield-row"></div>
<div id="pb" class="row battlefield-row"></div>

<section class="panel command-panel">
  <div class="command-head"><div id="actor" class="actor-name">-</div><div class="command-main-actions"><span id="round" class="round-inline">Round 1</span><button id="new" class="secondary" type="button">新しい戦闘</button><button id="resolve" class="primary" type="button" disabled>ラウンド開始</button></div></div>

  <div class="command-stack">
    <div class="terrain-switch-row"><button id="switch" class="secondary" type="button">換装</button><div id="terrainEffect" class="terrain-effect"></div></div>
    <div class="field-row"><label for="action">行動</label><select id="action"></select></div>

    <select id="target" class="target-state" tabindex="-1" aria-hidden="true"></select>

    <div class="command-buttons four">
      <button id="queue" class="primary" type="button">決定</button>
      <button id="swap" class="secondary" type="button">交代</button>
      <button id="defend" class="secondary" type="button">防御</button>
      <button id="escape" class="secondary" type="button">逃走</button>
    </div>
  </div>
</section>

<div id="jsWarning" class="panel" style="border-color:#8b6b2d;background:#211b10">
<strong>操作できない場合</strong>
<div class="muted" style="margin-top:5px">この表示が残っている場合、JavaScriptが実行されていません。</div>
</div>
<section class="panel"><div class="top"><strong>戦闘ログ</strong><button id="clear" class="secondary" type="button">ログ消去</button></div><div id="log" class="log" aria-live="polite"></div></section>
<div id="result" class="result hidden"><div id="rtitle" style="font-size:20px;font-weight:800"></div><div id="rtext" class="muted" style="margin-top:4px"></div></div>
<script src="data-v9.js"></script><script src="app-v11.js"></script></main></body></html>
