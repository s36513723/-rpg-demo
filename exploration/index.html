<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RPG LIVE 20260927</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07100c;color:#eee;font-family:system-ui}button{font:inherit;color:inherit}#app{height:100dvh;max-width:620px;margin:auto;padding:10px;display:grid;grid-template-rows:54px 1fr 105px 50px;gap:7px}header,#screen,#party,nav{border:1px solid #75602d;border-radius:10px;background:#0d1712}header{padding:8px 12px;display:flex;justify-content:space-between}h1{font-size:18px;color:#ead079;margin:0}.small{font-size:10px;color:#aeb8b0}#screen{position:relative;background:radial-gradient(circle at 50% 15%,#385845,#0b1712 60%)}.title{padding:13px;color:#e9cd73}.places{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.place,.row{border:1px solid #826e38;border-radius:9px;background:#14231b;text-align:left;padding:10px}.place{height:72px}.place b,.row b{display:block;color:#e8ca70}.place i{font-style:normal;font-size:25px;float:left;margin-right:9px}#party{padding:5px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.m{border:1px solid #405547;border-radius:6px;background:#101d17;text-align:center;padding:3px}.face{height:43px;border-radius:4px;background:#26392e;display:grid;place-items:center;font-size:20px}.m b{font-size:8px;display:block}.hp{height:3px;background:#3bad67}nav{display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden}nav button{border:0;background:#0e1813;font-size:9px}.ico{font-size:17px;display:block}#modal{position:fixed;inset:0;background:#020403cc;display:none;align-items:center;justify-content:center;padding:18px;z-index:9}#modal.on{display:flex}#panel{width:min(100%,550px);max-height:86dvh;overflow:auto;border:1px solid #a88c43;border-radius:12px;background:#0d1712;padding:13px}#panel h2{margin:0 0 8px;color:#e9cb70}.row{display:block;width:100%;margin:6px 0}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1;padding:9px;border:1px solid #806c38;border-radius:7px;background:#18251e}</style></head><body><div id="app"><header><div><h1>王都レクシア</h1><div class="small">冒険者区・中央広場</div></div><div id="money">12,480 G</div></header><main id="screen"><div class="title"><b>拠点 LIVE</b><div class="small">冒険の準備を整える</div></div><div class="places"><button class="place" onclick="inn()"><i>♨</i><b>宿・酒場</b><span class="small">会話・噂・休息</span></button><button class="place" onclick="guild()"><i>⚜</i><b>ギルド</b><span class="small">依頼・情報・査定</span></button><button class="place" onclick="market()"><i>⚒</i><b>市場</b><span class="small">購入・加工</span></button><button class="place" onclick="dungeon()"><i>♜</i><b>ダンジョン</b><span class="small">行き先・出撃</span></button></div></main><section id="party"><button class="m" onclick="character(0)"><div class="face">🛡️</div><b>ガルド</b><div class="hp"></div></button><button class="m" onclick="character(1)"><div class="face">🗡️</div><b>リゼ</b><div class="hp"></div></button><button class="m" onclick="character(2)"><div class="face">⚔️</div><b>エルン</b><div class="hp"></div></button><button class="m" onclick="character(3)"><div class="face">🏹</div><b>セナ</b><div class="hp"></div></button><button class="m" onclick="character(4)"><div class="face">🔮</div><b>ミレア</b><div class="hp"></div></button><button class="m" onclick="character(5)"><div class="face">✨</div><b>ユナ</b><div class="hp"></div></button></section><nav><button onclick="town()"><span class="ico">⌂</span>拠点</button><button onclick="partyMenu()"><span class="ico">♟</span>編成</button><button onclick="items()"><span class="ico">🎒</span>所持品</button><button onclick="records()"><span class="ico">▣</span>記録</button><button onclick="settings()"><span class="ico">⚙</span>設定</button></nav></div><div id="modal"><div id="panel"></div></div><script>
var names=['ガルド','リゼ','エルン','セナ','ミレア','ユナ'];var gold=12480;var eq=names.map(function(n,i){return ['主武器：'+['戦槌','短剣','王国剣','長弓','短杖','呪符'][i],'副手：'+['小盾','短剣','なし','なし','なし','なし'][i],'予備主：'+['戦斧','回刃','長槍','長槍','呪符','短杖'][i],'予備副：なし','頭：軽装','胴：軽装','手：軽装','足：軽装','装飾：護符','携行具：回復薬']});var rows=['前列','前列','前列','後列','後列','後列'];var skillOn=names.map(function(){return [1,1,0,0]});var mp=[7,7,7,7,7,7];
function show(x){document.getElementById('panel').innerHTML=x;document.getElementById('modal').className='on'}
function closeM(){document.getElementById('modal').className=''}
function back(){return '<div class="actions"><button onclick="closeM()">戻る</button></div>'}
function note(x){show('<h2>'+x+'</h2><p class="small">操作を反映しました。</p>'+back())}
function town(){closeM();document.querySelector('h1').textContent='王都レクシア';document.querySelector('header .small').textContent='冒険者区・中央広場';document.getElementById('screen').innerHTML='<div class="title"><b>拠点 LIVE</b><div class="small">冒険の準備を整える</div></div><div class="places"><button class="place" onclick="inn()"><i>♨</i><b>宿・酒場</b><span class="small">会話・噂・休息</span></button><button class="place" onclick="guild()"><i>⚜</i><b>ギルド</b><span class="small">依頼・情報・査定</span></button><button class="place" onclick="market()"><i>⚒</i><b>市場</b><span class="small">購入・加工</span></button><button class="place" onclick="dungeon()"><i>♜</i><b>ダンジョン</b><span class="small">行き先・出撃</span></button></div>'}
function inn(){show('<h2>宿・酒場</h2><button class="row" onclick="conversation()"><b>会話</b><span class="small">仲間・NPCとの任意会話</span></button><button class="row" onclick="rumors()"><b>噂</b><span class="small">未確認情報・隠し要素</span></button><button class="row" onclick="note(\'HP・SP・MPを全回復\')"><b>食事・休息</b><span class="small">帰還時の休息</span></button>'+back())}function conversation(){show('<h2>会話</h2>'+names.map(function(n,i){return '<button class="row" onclick="note(\''+n+'との会話イベント\')"><b>'+n+'</b><span class="small">会話する</span></button>'}).join('')+'<div class="actions"><button onclick="inn()">戻る</button></div>')}function rumors(){show('<h2>噂</h2><button class="row" onclick="note(\'古代迷宮：森林の祭壇を記録\')"><b>森林の隠し祭壇</b><span class="small">探索ノードに関する噂</span></button><button class="row" onclick="note(\'重装兵の巡回路を記録\')"><b>重装兵の巡回</b><span class="small">敵編成に関する噂</span></button><div class="actions"><button onclick="inn()">戻る</button></div>')}
function guild(){show('<h2>ギルド</h2><button class="row" onclick="questMenu()"><b>依頼</b><span class="small">受注・進行・報告</span></button><button class="row" onclick="infoMenu()"><b>情報</b><span class="small">地形・敵・既知弱点</span></button><button class="row" onclick="appraiseMenu()"><b>査定</b><span class="small">鑑定・引取・保管</span></button>'+back())}function questMenu(){show('<h2>依頼</h2><button class="row" onclick="note(\'森林巡回路の確保を受注\')"><b>森林巡回路の確保</b><span class="small">古代迷宮 / 報酬 1,800G</span></button><button class="row" onclick="note(\'遺物調査を受注\')"><b>古代遺物の調査</b><span class="small">探索ノードで遺物を発見</span></button><div class="actions"><button onclick="guild()">戻る</button></div>')}function infoMenu(){show('<h2>ダンジョン情報</h2><button class="row"><b>古代迷宮</b><span class="small">森林 / 洞窟 / 廃墟都市　重装：壊弱点　飛行：弓・投擲有効</span></button><div class="actions"><button onclick="guild()">戻る</button></div>')}function appraiseMenu(){show('<h2>査定</h2><button class="row" onclick="note(\'未鑑定の古器：1,200G\')"><b>未鑑定の古器 ×1</b><span class="small">鑑定する</span></button><div class="actions"><button onclick="guild()">戻る</button></div>')}
function market(){show('<h2>市場</h2><button class="row" onclick="weaponShop()"><b>武器・盾</b><span class="small">購入・性能確認</span></button><button class="row" onclick="armorShop()"><b>防具</b><span class="small">魔装・軽装・重装</span></button><button class="row" onclick="buy(120)"><b>道具</b><span class="small">回復薬 120G</span></button><button class="row" onclick="craftMenu()"><b>加工</b><span class="small">修理・強化・特性</span></button>'+back())}function weaponShop(){show('<h2>武器・盾</h2>'+[['戦槌','壊 / 近 / PHY',900],['短剣','斬 / 近 / SKL',700],['王国剣','斬 / 近 / PHY',900],['長槍','突 / 中 / PHY',850],['長弓','突 / 遠 / SKL',900],['短杖','壊 / 近 / ARC',780],['小盾','壊 / 近 / PHY',600]].map(function(x){return '<button class="row" onclick="buy('+x[2]+')"><b>'+x[0]+'　'+x[2]+'G</b><span class="small">'+x[1]+'</span></button>'}).join('')+'<div class="actions"><button onclick="market()">戻る</button></div>')}function armorShop(){show('<h2>防具</h2><button class="row" onclick="buy(650)"><b>魔装　650G</b><span class="small">術・魔防・状態対応</span></button><button class="row" onclick="buy(650)"><b>軽装　650G</b><span class="small">回避・速度・機動</span></button><button class="row" onclick="buy(900)"><b>重装　900G</b><span class="small">物防・不動・庇護</span></button><div class="actions"><button onclick="market()">戻る</button></div>')}function craftMenu(){show('<h2>加工</h2><button class="row" onclick="note(\'装備を修理\')"><b>修理</b></button><button class="row" onclick="buy(300)"><b>強化 +1　300G</b></button><button class="row" onclick="note(\'特性候補を表示\')"><b>特性加工</b><span class="small">対獣・軽量化・術式補助など</span></button><div class="actions"><button onclick="market()">戻る</button></div>')}
function buy(v){if(gold>=v){gold-=v;document.getElementById('money').textContent=gold.toLocaleString()+' G';market()}}
function partyMenu(){show('<h2>編成</h2>'+names.map(function(n,i){return '<button class="row" onclick="character('+i+')"><b>'+n+'</b><span class="small">'+rows[i]+' / '+eq[i][0]+'</span></button>'}).join('')+back())}
function character(i){show('<h2>'+names[i]+'</h2><p class="small">'+rows[i]+' / '+eq[i][0]+' / Mastery Pt '+mp[i]+'</p><button class="row" onclick="equip('+i+')"><b>装備</b><span class="small">主・副・予備・防具・装飾・携行具</span></button><button class="row" onclick="skills('+i+')"><b>スキル</b><span class="small">Set Cost管理</span></button><button class="row" onclick="mastery('+i+')"><b>Mastery</b><span class="small">武器・防具・源泉・術法・技能</span></button><div class="actions"><button onclick="partyMenu()">一覧</button><button onclick="toggleRow('+i+')">列変更</button></div>')}function toggleRow(i){rows[i]=rows[i]=='前列'?'後列':'前列';character(i)}
function equip(i){show('<h2>装備</h2>'+eq[i].map(function(x,k){return '<button class="row" onclick="equipChoice('+i+','+k+')"><b>'+x+'</b><span class="small">変更</span></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function equipChoice(i,k){var list=k<4?['なし','戦槌','戦斧','短剣','王国剣','長槍','長弓','短杖','小盾','回刃']:['魔装','軽装','重装','護符','回復薬'];show('<h2>装備候補</h2>'+list.map(function(x){return '<button class="row" onclick="setEquip('+i+','+k+',\''+x+'\')"><b>'+x+'</b></button>'}).join('')+'<div class="actions"><button onclick="equip('+i+')">戻る</button></div>')}function setEquip(i,k,x){var slot=eq[i][k].split('：')[0];eq[i][k]=slot+'：'+x;equip(i)}
function skills(i){var ns=['主力技 Cost5','反撃 Cost4','地形対応 Cost3','パッシブ Cost6'];var cs=[5,4,3,6],sum=skillOn[i].reduce(function(a,v,k){return a+v*cs[k]},0);show('<h2>スキル</h2><p class="small">Set Cost '+sum+' / 24</p>'+ns.map(function(x,k){return '<button class="row" onclick="toggleSkill('+i+','+k+')"><b>'+(skillOn[i][k]?'✓ ':'○ ')+x+'</b></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function toggleSkill(i,k){skillOn[i][k]=skillOn[i][k]?0:1;skills(i)}
function mastery(i){show('<h2>Mastery</h2><p class="small">Mastery Pt '+mp[i]+'</p>'+['武器','防具','源泉','術法','技能'].map(function(x){return '<button class="row" onclick="masteryType('+i+',\''+x+'\')"><b>'+x+' Mastery</b><span class="small">系統を見る</span></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function masteryType(i,t){var d={武器:['短剣','剣','槌','斧','槍','刀','弓','杖','盾','投擲'],防具:['魔装','軽装','重装'],源泉:['灼陽','霊峰','海神','森羅','星辰'],術法:['信仰','呪術','魔術','符術','機巧','異能'],技能:['探索','士気']}[t];show('<h2>'+t+' Mastery</h2>'+d.map(function(x){return '<button class="row" onclick="growMastery('+i+',\''+x+'\')"><b>'+x+'</b><span class="small">1 Ptで習得・成長</span></button>'}).join('')+'<div class="actions"><button onclick="mastery('+i+')">戻る</button></div>')}function growMastery(i,x){if(mp[i]<1)return note('Mastery Pt不足');mp[i]--;note(x+'を成長')}
function items(){show('<h2>所持品</h2><button class="row" onclick="note(\'回復薬を使用\')"><b>回復薬 ×5</b></button><button class="row"><b>解毒薬 ×3</b></button>'+back())}
function records(){show('<h2>記録</h2><button class="row" onclick="note(\'敵図鑑\')"><b>敵</b></button><button class="row" onclick="note(\'ダンジョン記録\')"><b>ダンジョン</b></button><button class="row" onclick="note(\'人物記録\')"><b>人物</b></button>'+back())}
function settings(){show('<h2>設定</h2><button class="row" onclick="note(\'UI設定\')"><b>UI設定</b></button>'+back())}
var floor=1;function dungeon(){show('<h2>ダンジョン選択</h2><button class="row" onclick="startDungeon()"><b>古代迷宮</b><span class="small">全3層 / テーマ可変 / 出撃</span></button><button class="row" onclick="note(\'辺境遺跡は未解放\')"><b>辺境遺跡</b></button>'+back())}function startDungeon(){floor=1;closeM();drawDungeon()}function drawDungeon(){document.querySelector('h1').textContent='古代迷宮';document.querySelector('header .small').textContent='第'+floor+'層・'+['森林','洞窟','廃墟都市'][floor-1];document.getElementById('screen').innerHTML='<div class="title"><b>分岐探索</b><button style="float:right" onclick="returnTown()">↩ 帰還</button></div><button class="place" style="position:absolute;left:20%;top:70%;width:70px;height:60px" onclick="nodeInfo(\'⚔ 通常戦\')">⚔</button><button class="place" style="position:absolute;left:60%;top:70%;width:70px;height:60px" onclick="nodeInfo(\'◇ 探索\')">◇</button><button class="place" style="position:absolute;left:40%;top:45%;width:70px;height:60px" onclick="nodeInfo(\'⛺ 野営\')">⛺</button><button class="place" style="position:absolute;left:40%;top:18%;width:70px;height:60px" onclick="nextFloor()">♛</button>'}function nodeInfo(x){show('<h2>'+x+'</h2><p class="small">敵・地形・報酬を確認。装備・列・スキルを調整して進みます。</p><button class="row" onclick="note(\'出撃準備\')"><b>出撃準備</b></button><div class="actions"><button onclick="closeM()">戻る</button></div>')}function nextFloor(){floor++;if(floor>3){floor=1;note('古代迷宮を踏破');setTimeout(returnTown,500)}else drawDungeon()}function returnTown(){closeM();town()}
town();
</script></body></html>
