var RPG_STORE=(function(){
  var PREFIX='RPG_DEMO_STATE_V1:';
  function named(){
    try{
      if(!window.name||window.name.indexOf(PREFIX)!==0)return {};
      var v=JSON.parse(window.name.slice(PREFIX.length));
      return v&&typeof v==='object'?v:{};
    }catch(e){return {}}
  }
  function saveNamed(v){try{window.name=PREFIX+JSON.stringify(v)}catch(e){}}
  function localGet(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
  function localSet(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}
  function localRemove(k){try{window.localStorage.removeItem(k)}catch(e){}}
  return {
    getItem:function(k){
      if(location.protocol==='file:'){
        var n=named();
        if(Object.prototype.hasOwnProperty.call(n,k))return n[k];
        var v=localGet(k);
        if(v!==null){n[k]=v;saveNamed(n)}
        return v;
      }
      return localGet(k);
    },
    setItem:function(k,v){
      v=String(v);localSet(k,v);
      if(location.protocol==='file:'){var n=named();n[k]=v;saveNamed(n)}
    },
    removeItem:function(k){
      localRemove(k);
      if(location.protocol==='file:'){var n=named();delete n[k];saveNamed(n)}
    }
  };
})();
var RPG_NAV=(function(){
  function importHash(){
    var m=location.hash.match(/(?:^#|&)rpg=([^&]+)/);
    if(!m)return;
    try{
      var d=JSON.parse(decodeURIComponent(m[1]));
      Object.keys(d||{}).forEach(function(k){RPG_STORE.setItem(k,d[k])});
      if(window.history&&history.replaceState)history.replaceState(null,'',location.pathname+location.search);
    }catch(e){}
  }
  function href(path,keys){
    var d={};
    (keys||['rpg.exploreBattle']).forEach(function(k){
      var v=RPG_STORE.getItem(k);
      if(v!==null)d[k]=v;
    });
    return path+(Object.keys(d).length?'#rpg='+encodeURIComponent(JSON.stringify(d)):'');
  }
  importHash();
  return {href:href};
})();

versation()">戻る</button></div>')}function addUnique(a,x){if(a.indexOf(x)<0)a.push(x)}function rumorPool(){var a=[['森林の隠し祭壇','森林のイベントで祭壇が見つかるらしい'],['重装兵の巡回','重装には壊攻撃が通りやすい'],['高台の射線','高台では後列の遠距離攻撃が有利']];if(unlocked.indexOf('辺境遺跡')<0)a.push(['辺境への古道','古代迷宮の奥に辺境へ続く記録がある']);if(unlocked.indexOf('深淵の樹海')>=0)a.push(['樹海の瘴気','樹海では解毒手段を用意した方がいい']);if(unlocked.indexOf('沈黙の砂都')>=0)a.push(['砂都の王墓','黄金王墓の番人は壊と闇に反応する']);return a}function addRumor(i){var a=rumorPool()[i];if(!a)return;addUnique(journal.rumors,a[0]+'：'+a[1]);persist();rumors()}function rumors(){var a=rumorPool();show('<h2>噂</h2>'+a.map(function(x,i){var known=journal.rumors.some(function(r){return r.indexOf(x[0])==0});return '<button class="row" onclick="addRumor('+i+')"><b>'+(known?'✓ ':'')+x[0]+'</b><span class="small">'+(known?x[1]:'聞き込みする')+'</span></button>'}).join('')+'<div class="actions"><button onclick="inn()">戻る</button></div>')}function guild(){var done=quests.filter(function(q){return q.state==2}).length;show('<h2>ギルド</h2>'+(done?'<button class="row" onclick="reportAll()"><b>達成報告 '+done+'件</b><span class="small">報酬をまとめて受領</span></button>':'')+'<button class="row" onclick="questMenu()"><b>依頼</b><span class="small">受注・進行・報告</span></button><button class="row" onclick="infoMenu()"><b>情報</b><span class="small">地形・敵・既知弱点</span></button><button class="row" onclick="appraiseMenu()"><b>査定</b><span class="small">鑑定・引取・保管</span></button>'+back())}function reportAll(){var sum=0;quests.forEach(function(q){if(q.state==2){sum+=q.reward;q.state=0}});gold+=sum;persist();note('依頼報酬 '+sum.toLocaleString()+'Gを受領')}function questMenu(){show('<h2>依頼</h2><p class="small">受注中 '+quests.filter(function(q){return q.state==1}).length+' / 達成待ち '+quests.filter(function(q){return q.state==2}).length+'</p>'+quests.map(function(q,i){var open=unlocked.indexOf(q.d)>=0;return '<button class="row" style="opacity:'+(open?1:.4)+'" '+(open?'onclick="questSelect('+i+')"':'')+'><b>'+q.n+'</b><span class="small">'+q.d+' / '+['未受注','進行中','達成'][q.state]+' / '+q.reward+'G</span></button>'}).join('')+'<div class="actions"><button onclick="guild()">戻る</button></div>')}function questSelect(i){var q=quests[i];if(q.state==0){q.state=1;persist();note(q.n+'を受注')}else if(q.state==2){gold+=q.reward;q.state=0;persist();note('達成報告：'+q.reward+'G獲得')}else show('<h2>'+q.n+'</h2><p class="small">'+q.d+' / 進行中<br>達成条件：'+(q.type=='clear'?'ダンジョン踏破':q.type=='elite'?'強敵撃破':q.type=='relic'?'遺物発見':q.type=='weak'?'新しい弱点を発見':q.type=='event'?'イベント成功':q.type=='boss'?'ボス撃破':'探索')+'</p><button class="row" onclick="deployment(\''+q.d+'\')"><b>対象地域へ</b><span class="small">出撃確認を開く</span></button><div class="actions"><button onclick="questMenu()">戻る</button></div>')}function infoMenu(){show('<h2>ダンジョン情報</h2>'+Object.keys(DUNGEONS).filter(function(x){return unlocked.indexOf(x)>=0}).map(function(x){var p=dungeonProgress[x];return '<button class="row" onclick="dungeonIntel(\''+x+'\')"><b>'+x+'</b><span class="small">踏破 '+p.clear+' / 最高 '+p.best+'層</span></button>'}).join('')+'<button class="row" onclick="enemyBook()"><b>敵情報</b><span class="small">'+journal.enemies.length+'種記録</span></button><div class="actions"><button onclick="guild()">戻る</button></div>')}function dungeonIntel(x){var known=journal.weakness.slice(-4).join(' / ')||'未判明';show('<h2>'+x+'</h2><p class="small">'+DINFO[x]+'<br>固有：'+DGIMMICK[x]+'<br>候補地形：'+DUNGEONS[x].join('・')+'<br>既知情報：'+known+'</p><button class="row" onclick="deployment(\''+x+'\')"><b>この地域へ出撃</b></button><div class="actions"><button onclick="infoMenu()">戻る</button></div>')}function appraiseMenu(){show('<h2>査定</h2><p class="small">未鑑定古器 '+loot.古器+' / 希少装備 '+rareGear.length+' / 保管 '+storage.length+'</p>'+(loot.古器?'<button class="row" onclick="appraise()"><b>古器をまとめて査定</b><span class="small">希少装備・魔力結晶・換金品を判定</span></button>':'')+rareGear.map(function(x,i){return '<button class="row" onclick="rareAppraise('+i+')"><b>'+x.name+'</b><span class="small">'+x.attr+' / '+x.trait+' / '+x.value+'G</span></button>'}).join('')+'<button class="row" onclick="storageMenu()"><b>保管庫</b><span class="small">'+storage.length+'件</span></button><div class="actions"><button onclick="guild()">戻る</button></div>')}
function appraise(){var n=loot.古器;if(!n)return note('査定する古器がありません');var before=rareGear.length,crystal=0,cash=0;loot.古器=0;for(var i=0;i<n;i++){var r=Math.random();if(r<.3)dropRare();else if(r<.55){loot.結晶++;crystal++}else cash+=180+Math.floor(Math.random()*5)*70}gold+=cash;var found=rareGear.length-before;persist();show('<h2>査定結果</h2><p class="small">古器 '+n+'点を査定しました。</p><button class="row"><b>希少装備 '+found+'点</b><span class="small">査定一覧に追加</span></button><button class="row"><b>魔力結晶 '+crystal+'個</b></button><button class="row"><b>換金品 '+cash.toLocaleString()+'G</b></button><div class="actions"><button onclick="appraiseMenu()">査定一覧へ</button></div>')}function rareAppraise(i){var x=rareGear[i];show('<h2>'+x.name+'</h2><p class="small">'+x.attr+'<br>重量 '+x.weight+' / 要求 '+x.req+'<br>特性：'+x.trait+'</p><button class="row" onclick="keepRare('+i+')"><b>装備として引き取る</b></button><button class="row" onclick="sellRare('+i+')"><b>'+x.value+'Gで売却</b></button><button class="row" onclick="storeRare('+i+')"><b>保管庫へ</b></button><div class="actions"><button onclick="appraiseMenu()">戻る</button></div>')}function keepRare(i){var x=rareGear.splice(i,1)[0];inventory.weapons.push(x.name);WM[x.name]=[x.attr.split('/')[0],x.attr.split('/')[1],x.weight,x.req.split(' ')[0],+(x.req.split(' ')[1]||0)];traits[x.name]=x.trait;persist();appraiseMenu()}function sellRare(i){var x=rareGear.splice(i,1)[0];gold+=x.value;persist();appraiseMenu()}function storeRare(i){storage.push(rareGear.splice(i,1)[0]);persist();appraiseMenu()}function storageMenu(){show('<h2>保管庫</h2>'+(storage.length?storage.map(function(x,i){return '<button class="row" onclick="restoreRare('+i+')"><b>'+x.name+'</b><span class="small">'+x.attr+' / '+x.trait+'　引き出す</span></button>'}).join(''):'<p class="small">保管品なし</p>')+'<div class="actions"><button onclick="appraiseMenu()">戻る</button></div>')}function restoreRare(i){rareGear.push(storage.splice(i,1)[0]);persist();storageMenu()}function upgradeMenu(){show('<h2>武器強化</h2>'+inventory.weapons.map(function(x){return '<button class="row" onclick="upgradeGear(\''+x+'\')"><b>'+x+' +'+(upgrades[x]||0)+'</b><span class="small">300G / 魔力結晶1</span></button>'}).join('')+'<div class="actions"><button onclick="craftMenu()">戻る</button></div>')}function upgradeGear(x){if((upgrades[x]||0)>=3)return note('強化上限 +3');if(gold<300||loot.結晶<1)return note('Gまたは魔力結晶が不足');gold-=300;loot.結晶--;upgrades[x]=(upgrades[x]||0)+1;persist();upgradeMenu()}function traitMenu(){show('<h2>特性加工</h2><p class="small">森獣の皮 '+loot.皮+' / 武器に戦術特性を付与</p>'+inventory.weapons.map(function(x){return '<button class="row" onclick="traitChoice(\''+x+'\')"><b>'+x+'</b><span class="small">現在：'+(traits[x]||'なし')+'</span></button>'}).join('')+'<div class="actions"><button onclick="craftMenu()">戻る</button></div>')}function traitChoice(x){var a=['対獣','軽量化','術式補助','重装特効','飛行特効','状態特効'];show('<h2>'+x+' / 特性</h2>'+a.map(function(t){return '<button class="row" onclick="setTrait(\''+x+'\',\''+t+'\')"><b>'+t+'</b><span class="small">'+({対獣:'獣への威力上昇',軽量化:'重量ペナルティ軽減',術式補助:'術威力上昇',重装特効:'重装・機械への威力上昇',飛行特効:'飛行への威力上昇',状態特効:'異常・封じ中の敵へ威力上昇'}[t])+'</span></button>'}).join('')+'<div class="actions"><button onclick="traitMenu()">戻る</button></div>')}function setTrait(x,t){if(loot.皮<2)return note('森獣の皮が不足');loot.皮-=2;traits[x]=t;persist();traitMenu()}function toolShop(){const goods=[['回復薬',120],['解毒薬',100],['爆弾',280],['煙玉',220],['薬瓶',240],['投げナイフ',40],['鉄針',30],['投石',20]];show('<h2>道具</h2>'+goods.map(([n,p])=>'<button class="row" onclick="buyTool(\''+n+'\','+p+')"><b>'+n+'　'+p+'G</b><span class="small">所持 '+(inventory.tools[n]||0)+'</span></button>').join('')+'<div class="actions"><button onclick="market()">戻る</button></div>')}function buyTool(x,v){if(gold<v)return note('所持金不足');gold-=v;inventory.tools[x]=(inventory.tools[x]||0)+1;persist();toolShop()}function market(){show('<h2>市場</h2><button class="row" onclick="weaponShop()"><b>武器・盾</b><span class="small">購入・性能確認</span></button><button class="row" onclick="armorShop()"><b>防具</b><span class="small">魔装・軽装・重装</span></button><button class="row" onclick="toolShop()"><b>道具</b><span class="small">薬・爆弾・煙玉・薬瓶</span></button><button class="row" onclick="craftMenu()"><b>加工</b><span class="small">強化・特性</span></button><button class="row" onclick="materialTrade()"><b>素材取引</b><span class="small">余剰素材を売却</span></button>'+back())}
function materialTrade(){show('<h2>素材取引</h2><p class="small">未鑑定古器はギルド査定へ。ここでは加工素材を売却できます。</p><button class="row" onclick="sellMaterial(\'皮\',1)"><b>森獣の皮　90G</b><span class="small">所持 '+loot.皮+' / 1個売却</span></button><button class="row" onclick="sellMaterial(\'皮\',loot.皮)"><b>森獣の皮を全売却</b></button><button class="row" onclick="sellMaterial(\'結晶\',1)"><b>魔力結晶　280G</b><span class="small">所持 '+loot.結晶+' / 1個売却</span></button><button class="row" onclick="sellMaterial(\'結晶\',loot.結晶)"><b>魔力結晶を全売却</b></button><div class="actions"><button onclick="market()">戻る</button></div>')}
function sellMaterial(x,n){n=Math.max(0,Math.min(n||0,loot[x]||0));if(!n)return note('売却できる素材がありません');var unit=x=='皮'?90:280;loot[x]-=n;gold+=unit*n;persist();materialTrade()}function weaponShop(){var goods=[['拳甲','壊 / 近 / PHY',650],['短剣','斬 / 近 / SKL',700],['王国剣','斬 / 近 / PHY',900],['戦槌','壊 / 近 / PHY',900],['戦斧','斬 / 近 / PHY',920],['長槍','突 / 中 / PHY',850],['鞭','斬 / 中 / SKL',780],['鎌','斬 / 近 / PHY・ARC',1050],['刀','斬 / 近 / SKL・MND',1100],['長弓','突 / 遠 / SKL',900],['銃','突 / 遠 / SKL',1200],['短杖','壊 / 近 / ARC',780],['小盾','壊 / 近 / PHY',600],['回刃','斬 / 中遠 / SKL',760]];show('<h2>武器・盾</h2>'+goods.map(function(x){var own=inventory.weapons.indexOf(x[0])>=0;return '<button class="row" '+(own?'':'onclick="buyGear(\''+x[0]+'\','+x[2]+',\'weapon\')"')+'><b>'+(own?'✓ ':'')+x[0]+'　'+x[2]+'G</b><span class="small">'+x[1]+'</span></button>'}).join('')+'<div class="actions"><button onclick="market()">戻る</button></div>')}function buyArmor(i){var a=[['魔装',650],['軽装',650],['重装',900]][i];buyGear(a[0],a[1],'armor')}function armorShop(){var a=[['魔装',650,'魔法・属性・状態異常に強い'],['軽装',650,'速度・回避・列変更に強い'],['重装',900,'斬突壊・気絶・動揺に強い']];show('<h2>防具</h2><p class="small">現在：'+names.map(function(n,i){return n+' '+eq[i][4].split('：')[1]}).join(' / ')+'</p>'+a.map(function(x,i){var own=inventory.armor.indexOf(x[0])>=0;return '<button class="row" '+(own?'onclick="partyMenu()"':'onclick="buyArmor('+i+')"')+'><b>'+(own?'✓ ':'')+x[0]+'　'+x[1]+'G</b><span class="small">'+x[2]+'</span></button>'}).join('')+'<div class="actions"><button onclick="market()">戻る</button></div>')}function craftMenu(){show('<h2>加工</h2><p class="small">素材：森獣の皮 '+loot.皮+' / 魔力結晶 '+loot.結晶+'</p><button class="row" onclick="upgradeMenu()"><b>強化</b><span class="small">300G＋魔力結晶1</span></button><button class="row" onclick="traitMenu()"><b>特性加工</b><span class="small">森獣の皮2などを使用</span></button><div class="actions"><button onclick="market()">戻る</button></div>')}
function buyGear(n,v,t){if(gold<v)return note('所持金不足');gold-=v;if(t=='weapon'&&inventory.weapons.indexOf(n)<0)inventory.weapons.push(n);if(t=='armor'&&inventory.armor.indexOf(n)<0)inventory.armor.push(n);persist();show('<h2>'+n+'を購入</h2><p class="small">所持品に追加しました。</p><button class="row" onclick="partyMenu()"><b>装備を変更する</b><span class="small">6人から装備者を選ぶ</span></button><div class="actions"><button onclick="market()">市場へ戻る</button></div>')}function buy(v){if(gold>=v){gold-=v;if(v==120)inventory.tools.回復薬++;persist();market()}}
function partyMenu(){show('<h2>編成 / 6人</h2><button class="row" onclick="squadMenu()"><b>隊列編成</b><span class="small">前列3人 / 後列3人を入れ替える</span></button>'+names.map(function(n,i){return '<button class="row" onclick="character('+i+')"><b>'+n+'　'+rows[i]+'</b><span class="small">'+battleStyle(i)+' / '+eq[i][0].split('：')[1]+' ⇄ '+eq[i][2].split('：')[1]+' / Cost '+skillCost(i)+'/'+skillCap(i)+'</span></button>'}).join('')+back())}
function squadMenu(){show('<h2>隊列編成</h2><p class="small">出撃は6人固定。前列・後列は各3人まで。</p>'+names.map(function(n,i){return '<button class="row" onclick="toggleRow('+i+')"><b>'+n+'　'+rows[i]+'</b><span class="small">反対列のメンバーと交代</span></button>'}).join('')+'<button class="row" onclick="readiness()"><b>出撃準備診断</b><span class="small">列・重量・携行具・スキルを確認</span></button><div class="actions"><button onclick="partyMenu()">戻る</button></div>')}

function readiness(){var front=rows.filter(function(x){return x=='前列'}).length,backc=6-front,ids=[0,1,2,3,4,5],over=ids.filter(function(i){return weightInfo(i).level>0}),noCarry=ids.filter(function(i){var x=eq[i][9].split('：')[1];return x=='なし'||!(inventory.tools[x]>0)}),noSkill=ids.filter(function(i){return skillSet[i].length==0}),warn=[];if(front!=3||backc!=3)warn.push('前列・後列を3人ずつにしてください');if(over.length)warn.push('重量超過：'+over.map(function(i){return names[i]}).join('・'));if(noCarry.length)warn.push('携行具不足：'+noCarry.map(function(i){return names[i]}).join('・'));if(noSkill.length)warn.push('セットスキルなし：'+noSkill.map(function(i){return names[i]}).join('・'));show('<h2>出撃準備診断</h2><p class="small">前列 '+front+' / 後列 '+backc+'<br>対象地域：'+dungeonId+'<br>'+DGIMMICK[dungeonId]+'</p><button class="row"><b>'+(warn.length?'要確認 '+warn.length+'件':'準備完了')+'</b><span class="small">'+(warn.join('<br>')||'大きな準備不足はありません')+'</span></button><div class="actions"><button onclick="squadMenu()">戻る</button><button onclick="deployment(dungeonId)">出撃確認</button></div>')}function battleStyle(i){var a=stats[i],m=eq[i][0].split('：')[1],o=masteryOwned[i],ss=skillSet[i];if(o.術法.indexOf('信仰')>=0&&ss.some(x=>/治癒|祝福|加護|浄化/.test(x)))return '聖護支援';if(o.術法.indexOf('呪術')>=0)return '呪詛・吸収';if(o.術法.indexOf('魔術')>=0)return '元素術式';if(o.術法.indexOf('符術')>=0)return '符術・式神';if(o.術法.indexOf('機巧')>=0)return '魔工兵装';if(o.術法.indexOf('異能')>=0)return '念動異能';if(o.技能.indexOf('士気')>=0&&ss.some(x=>/歌|舞|号令|旋律/.test(x)))return '士気支援';if(eq[i][1].indexOf('盾')>=0)return '盾衛前衛';if(/長弓|銃/.test(m))return '遠距離射撃';if(/短剣|刀/.test(m)&&a[1]>=a[0])return '技巧・急襲';if(/槌|斧|剣|槍/.test(m)&&a[0]>=40)return '前衛打撃';if(a[2]>=45)return '異能術攻撃';if(a[3]>=45)return '精神支援';return '複合型'}function mainMastery(i){var x=learnedTree[i];return x.length?x[x.length-1]:'未設定'}function character(i){var a=stats[i];show('<h2>'+names[i]+'</h2><p class="small">'+battleStyle(i)+' / '+rows[i]+'</p><button class="row" onclick="charOverview('+i+')"><b>概要</b><span class="small">主力武器・Mastery・スキル</span></button><button class="row" onclick="charAbility('+i+')"><b>能力</b><span class="small">能力値・派生値・耐性</span></button><button class="row" onclick="charMastery('+i+')"><b>Mastery取得状況</b></button><button class="row" onclick="equip('+i+')"><b>装備</b></button><button class="row" onclick="skills('+i+')"><b>スキル</b></button><div class="actions"><button onclick="partyMenu()">一覧</button><button onclick="toggleRow('+i+')">列変更</button></div>')}function charOverview(i){show('<h2>'+names[i]+' / 概要</h2><p class="small">戦闘スタイル：'+battleStyle(i)+'<br>列：'+rows[i]+'<br>主力武器：'+eq[i][0].split('：')[1]+'<br>主力Mastery：'+mainMastery(i)+'<br>主力スキル：'+(learned[i][learned[i].length-1]||'通常攻撃')+'</p><div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function charAbility(i){var a=stats[i],d=derivedValues(a),arm=eq[i][4].split('：')[1],ad=ARM[arm]||[0,'',0,0];show('<h2>'+names[i]+' / 能力</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px">'+['PHY','SKL','ARC','MND'].map(function(x,k){return '<button class="row" style="text-align:center" onclick="addStat('+i+','+k+')"><b>'+x+' '+a[k]+'</b></button>'}).join('')+'</div><p class="small">Stat Pt '+statPt[i]+' / 総能力 '+(a[0]+a[1]+a[2]+a[3])+'<br>HP '+d.hp+' / SP '+d.sp+' / MP '+d.mp+'<br>物防 '+(a[0]+ad[2])+' / 魔防 '+(a[2]+a[3]+ad[3])+' / 重量制限 '+a[0]+'</p><button class="row" onclick="resistView('+i+')"><b>耐性</b><span class="small">属性・状態異常・封じ</span></button><div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function calcResist(i){const r={...resist[i]},armor=eq[i][4].split('：')[1];if(armor==='魔装')for(const k of ['火','水','風','土','光','闇'])r[k]=(r[k]||0)+10;if(armor==='重装')for(const k of ['斬','突','壊'])r[k]=(r[k]||0)+12;return r}function resistView(i){var r=calcResist(i);show('<h2>耐性</h2>'+Object.keys(r).map(function(x){return '<button class="row"><b>'+x+'</b><span class="small">'+(r[x]>0?'耐性 +'+r[x]:r[x]<0?'弱点 '+r[x]:'標準')+'</span></button>'}).join('')+'<div class="actions"><button onclick="charAbility('+i+')">戻る</button></div>')}function charMastery(i){show('<h2>'+names[i]+' / Mastery</h2><p class="small">残り '+mp[i]+' Pt</p>'+Object.entries(ranksFor(i)).filter(([g,v])=>v>0).map(([g,v])=>'<button class="row" onclick="growMastery('+i+',\''+g+'\')"><b>'+g+'　'+v+'/50</b></button>').join('')+'<div class="actions"><button onclick="mastery('+i+')">育成する</button><button onclick="character('+i+')">戻る</button></div>')}function toggleRow(i){var target=rows[i]=='前列'?'後列':'前列',members=[0,1,2,3,4,5].filter(function(j){return rows[j]==target});if(members.length>=3)return rowSwapMenu(i);rows[i]=target;persist();character(i)}
function rowSwapMenu(i){var target=rows[i]=='前列'?'後列':'前列',members=[0,1,2,3,4,5].filter(function(j){return rows[j]==target});show('<h2>'+names[i]+' / 列交代</h2><p class="small">'+target+'は満員です。交代する相手を選択してください。</p>'+members.map(function(j){return '<button class="row" onclick="swapFormation('+i+','+j+')"><b>'+names[j]+'</b><span class="small">'+rows[j]+' / '+battleStyle(j)+'</span></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}

function addStat(i,k){if(statPt[i]<1||![0,1,2,3].includes(k))return note('Stat Pt不足');const old=rules().derived(stats[i]);stats[i][k]++;statPt[i]--;const now=rules().derived(stats[i]);for(const key of ['hp','sp','mp'])if(key!=='hp'||vitals[i].hp>0)vitals[i][key]+=now[key]-old[key];persist();charAbility(i)}
function weightInfo(i){const slots=[0,1,4,5,6,7,8],raw=slots.reduce((s,k)=>{const n=eq[i][k].split('：')[1];return s+(WM[n]?.[2]??ARM[n]?.[0]??(n==='なし'?0:1))},0),weight=Math.round(raw*(1-Math.min(.4,rules().effect(skillSet[i],'loadReduction')))*100)/100,limit=stats[i][0],ratio=weight/limit,level=ratio<=1?0:ratio<=1.2?1:ratio<=1.5?2:3;return {weight,limit,ratio,level,text:['重量正常','速度・回避-5 / 武器95%','速度・回避-15 / 武器90%','速度・回避-30 / 武器80%'][level]}}
function stanceInfo(i){var main=eq[i][0].split('：')[1],off=eq[i][1].split('：')[1],carry=eq[i][9].split('：')[1],s=(main=='なし'&&off=='なし')?'無手':off=='なし'?'両手持ち':off.indexOf('盾')>=0?'盾併用':'二刀流',fx=s=='両手持ち'?'実効重量軽減 / 威力・崩し・命中↑':s=='二刀流'?'主副武器技を使用 / 高Cost':s=='盾併用'?'盾技・防御・反撃を使用':'無手Mastery最大適用';if(carry.indexOf('投')>=0)s+='＋投擲';return {name:s,effect:fx}}function equip(i){var a=stats[i],wi=weightInfo(i),stance=stanceInfo(i);var slots=[0,1,2,3,4,8,9];show('<h2>'+names[i]+' / 装備</h2><p class="small">'+stance.name+' — '+stance.effect+'<br>重量 '+wi.weight+' / '+a[0]+'　'+wi.text+'</p>'+slots.map(function(k){var label=k==4?'防具：'+eq[i][4].split('：')[1]+'（4部位）':eq[i][k];return '<button class="row" onclick="equipChoice('+i+','+k+')"><b>'+label+'</b><span class="small">変更</span></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function equipChoice(i,k){const list=k<4?['なし',...inventory.weapons]:k>=4&&k<=7?inventory.armor:k===9?['なし',...Object.keys(inventory.tools)]:['なし','護符'];show('<h2>装備候補</h2>'+list.map(n=>{const m=WM[n],idx={PHY:0,SKL:1,ARC:2,MND:3}[m?.[3]],valid=k>=4||(!m||m[3]==='―'||stats[i][idx]>=m[4])&&handEquipAllowed(i,k,n);return '<button class="row" '+(valid?'onclick="setEquip('+i+','+k+',\''+n+'\')"':'disabled')+'><b>'+hesc(n)+'</b><span class="small">'+(m?m[0]+' / '+m[1]+' / 重量'+m[2]+' / '+m[3]+' '+m[4]:'')+(k===9?' / 所持'+(inventory.tools[n]||0):'')+'</span></button>'}).join('')+'<div class="actions"><button onclick="equip('+i+')">戻る</button></div>')}
function isTwoHanded(n){return /鞭|鎌|刀|弓|銃/.test(n||'')}
function handEquipAllowed(i,k,x){if(x=='なし')return true;if(k!=1&&k!=3)return true;if(isTwoHanded(x))return false;var main=eq[i][k-1].split('：')[1];return !isTwoHanded(main)}
function setEquip(i,k,x){if(k>=4&&k<=7&&(x=='魔装'||x=='軽装'||x=='重装')){for(var z=4;z<=7;z++){var sl=eq[i][z].split('：')[0];eq[i][z]=sl+'：'+x}persist();return equip(i)}if(k<4&&!handEquipAllowed(i,k,x))return note('両手武器は副手に装備できず、両手武器の副手も空ける必要があります');if((k==1||k==3)&&x!='なし'&&x.indexOf('盾')<0&&stats[i][1]<30)return note('二刀流にはSKL 30以上が必要');var slot=eq[i][k].split('：')[0];eq[i][k]=slot+'：'+x;if((k==0||k==2)&&isTwoHanded(x)){var off=k+1,offSlot=eq[i][off].split('：')[0];eq[i][off]=offSlot+'：なし'}persist();equip(i)}
function weaponKind(n){if(/拳甲|格闘/.test(n))return '格闘';if(/槌/.test(n))return '槌';if(/斧/.test(n))return '斧';if(/短剣/.test(n))return '短剣';if(/剣/.test(n))return '剣';if(/槍/.test(n))return '槍';if(/弓/.test(n))return '弓';if(/杖/.test(n))return '杖';if(/盾/.test(n))return '盾';if(/回刃/.test(n))return '投擲';return n}
function rebuildSkillWeaponMap(){skillWeapon={};for(const [n,d] of Object.entries(rules().skills))if(d.weapons?.length===1)skillWeapon[n]=d.weapons[0]}
function skillUsable(i,n){const d=rules().meta(n);if(!d)return false;const req=d.weapons;if(!req?.length)return true;const held=eq[i].slice(0,4).map(x=>weaponKind(x.split('：')[1]));if(req.includes('格闘')&&((held[0]==='なし'&&held[1]==='なし')||held.includes('格闘')))return true;if(req.includes('投擲')&&['投げナイフ','鉄針','投石'].includes(eq[i][9].split('：')[1]))return true;return req.some(x=>held.includes(x))}function skillMeta(n){const d=rules().meta(n);return d?[d.setCost,d.mode]:[0,'Active']}function skillCap(i){return rules().capacity(stats[i],skillSet[i])}
function effectiveCost(i,n){return rules().cost(n,skillSet[i])}function skillCost(i){return rules().setCost(skillSet[i])}function skills(i,filter='All'){const ns=learned[i].filter(n=>rules().meta(n)&&(filter==='All'||rules().meta(n).mode===filter));show('<h2>'+names[i]+' / スキルセット</h2><p class="small">Cost '+skillCost(i)+'/'+skillCap(i)+' / パッシブもセット中だけ有効</p><div class="actions"><button onclick="skills('+i+')">すべて</button><button onclick="skills('+i+',\'Active\')">Active</button><button onclick="skills('+i+',\'Passive\')">Passive</button></div>'+ns.map(n=>{const d=rules().meta(n),on=skillSet[i].includes(n);return '<button class="row" onclick="toggleLearnedSkill('+i+',\''+n+'\')"><b>'+(on?'✓ ':'○ ')+n+'</b><span class="small">'+d.mode+' / Cost '+effectiveCost(i,n)+(d.costType?' / '+d.costType+' '+d.cost:'')+'<br>'+hesc(skillDescription(d))+(!skillUsable(i,n)?'<br>対応装備が必要':'')+'</span></button>'}).join('')+'<div class="actions"><button onclick="mastery('+i+')">習得・育成</button><button onclick="character('+i+')">戻る</button></div>')}function toggleLearnedSkill(i,n){if(!learned[i].includes(n)||!rules().meta(n))return;const next=skillSet[i].includes(n)?skillSet[i].filter(x=>x!==n):skillSet[i].concat(n);if(!rules().fits(stats[i],next))return note('Cost上限を超えます。他のスキルを先に外してください');skillSet[i]=next;persist();skills(i)}
function mastery(i){show('<h2>'+names[i]+' / Mastery</h2><p class="small">'+mp[i]+' Pt / 成長 +5 に1 Pt / 上限50</p>'+['武器','防具','源泉','術法','技能'].map(t=>'<button class="row" onclick="masteryType('+i+',\''+t+'\')"><b>'+t+'</b></button>').join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function masteryType(i,t){show('<h2>'+t+' Mastery</h2><p class="small">'+mp[i]+' Pt'+(t==='源泉'?' / 1系統まで':['術法','技能'].includes(t)?' / 2系統まで':'')+'</p>'+Object.entries(rules().masteries).filter(([g,d])=>d.category===t).map(([g,d])=>'<button class="row" onclick="growMastery('+i+',\''+g+'\')"><b>'+g+'　'+(ranksFor(i)[g]||0)+'/50</b><span class="small">'+Object.keys(d.branches).join(' / ')+'</span></button>').join('')+'<div class="actions"><button onclick="mastery('+i+')">戻る</button></div>')}function growMastery(i,g){const data=rules().masteries[g];if(!data)return;const rank=ranksFor(i)[g]||0;show('<h2>'+g+'　'+rank+'/50</h2><p class="small">Mastery Pt '+mp[i]+' / +5ごとに1 Pt<br>5 基礎 / 15 初級 / 25 中級 / 35 上級 / 45 最高位 / 50 完成</p><button class="row" '+(rank>=50?'disabled':'onclick="trainMastery('+i+',\''+g+'\')"')+'><b>成長 +5</b><span class="small">1 Pt / スキル習得は別途1 Pt</span></button>'+Object.entries(data.branches).map(([b,ns])=>'<button class="row" onclick="masterySkills('+i+',\''+g+'\',\''+b+'\')"><b>'+b+'</b><span class="small">'+ns.join(' / ')+'</span></button>').join('')+'<div class="actions"><button onclick="masteryType('+i+',\''+data.category+'\')">戻る</button></div>')}function gearBranches(i,g){growMastery(i,g)}function gearSkills(i,g,b){masterySkills(i,g,b)}function learnGear(i,g,b,n){learnSkill(i,g,b,n)}
function masteryBranches(i,g){growMastery(i,g)}function masterySkills(i,g,b){const ns=rules().masteries[g]?.branches[b];if(!ns)return;show('<h2>'+g+' / '+b+'</h2><p class="small">Rank '+(ranksFor(i)[g]||0)+' / 50　'+mp[i]+' Pt</p>'+ns.map(n=>{const d=rules().meta(n),u=d.unlocks.find(u=>u.mastery===g&&u.branch===b),owned=learned[i].includes(n),ok=rules().canLearn(n,g,ranksFor(i),stats[i]);return '<button class="row" '+(owned?'onclick="skills('+i+')"':ok?'onclick="learnSkill('+i+',\''+g+'\',\''+b+'\',\''+n+'\')"':'disabled')+'><b>'+(owned?'✓ ':'')+n+'</b><span class="small">'+d.mode+' / Cost '+d.setCost+' / '+(d.costType?d.costType+' '+d.cost:'常時効果')+'<br>要求：Rank '+u.rank+' / '+u.stat+' '+u.value+' / 習得1 Pt<br>'+hesc(skillDescription(d))+'</span></button>'}).join('')+'<div class="actions"><button onclick="growMastery('+i+',\''+g+'\')">戻る</button></div>')}function learnSkill(i,g,b,n){const d=rules().meta(n);if(!d||!rules().masteries[g]?.branches[b]?.includes(n))return note('不正なスキル');if(learned[i].includes(n))return note('習得済み');if(mp[i]<1)return note('Mastery Pt不足');if(!rules().canLearn(n,g,ranksFor(i),stats[i]))return note('Masteryランクまたは能力値が不足');const category=rules().masteries[g].category;if(['源泉','術法','技能'].includes(category)&&!masteryOwned[i][category].includes(g))return note('系統を先に取得してください');mp[i]--;learned[i].push(n);learnedTree[i].push(n);persist();masterySkills(i,g,b)}
function items(){show('<h2>所持品</h2><button class="row" onclick="itemCategory(\'道具\')"><b>道具</b><span class="small">回復・状態回復</span></button><button class="row" onclick="itemCategory(\'素材\')"><b>素材</b><span class="small">加工・売却</span></button><button class="row" onclick="itemCategory(\'装備\')"><b>装備</b><span class="small">武器・盾・防具</span></button><button class="row" onclick="useTool(\'回復薬\')"><b>回復薬 ×'+inventory.tools.回復薬+'</b></button><button class="row"><b>解毒薬 ×'+inventory.tools.解毒薬+'</b></button><button class="row"><b>武器・盾 '+inventory.weapons.length+'種</b><span class="small">'+inventory.weapons.join(' / ')+'</span></button><button class="row"><b>防具 '+inventory.armor.length+'種</b><span class="small">'+inventory.armor.join(' / ')+'</span></button><button class="row"><b>森獣の皮 ×'+loot.皮+'</b></button><button class="row"><b>未鑑定の古器 ×'+loot.古器+'</b></button><button class="row"><b>魔力結晶 ×'+loot.結晶+'</b></button>'+back())}
