<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RPG</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07100c;color:#eee;font-family:system-ui}button{font:inherit;color:inherit}#app{height:100dvh;max-width:620px;margin:auto;padding:10px;display:grid;grid-template-rows:54px 1fr 105px 50px;gap:7px}header,#screen,#party,nav{border:1px solid #75602d;border-radius:10px;background:#0d1712}header{padding:8px 12px;display:flex;justify-content:space-between}h1{font-size:18px;color:#ead079;margin:0}.small{font-size:10px;color:#aeb8b0}#screen{position:relative;background:radial-gradient(circle at 50% 15%,#385845,#0b1712 60%)}.title{padding:13px;color:#e9cd73}.places{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.place,.row{border:1px solid #826e38;border-radius:9px;background:#14231b;text-align:left;padding:10px}.place{height:72px}.place b,.row b{display:block;color:#e8ca70}.place i{font-style:normal;font-size:25px;float:left;margin-right:9px}#party{padding:5px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.m{border:1px solid #405547;border-radius:6px;background:#101d17;text-align:center;padding:3px}.face{height:43px;border-radius:4px;background:#26392e;display:grid;place-items:center;font-size:20px}.m b{font-size:8px;display:block}.hp{height:3px;background:#3bad67}nav{display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden}nav button{border:0;background:#0e1813;font-size:9px}.ico{font-size:17px;display:block}#modal{position:fixed;inset:0;background:#020403cc;display:none;align-items:center;justify-content:center;padding:18px;z-index:9}#modal.on{display:flex}#panel{width:min(100%,550px);max-height:86dvh;overflow:auto;border:1px solid #a88c43;border-radius:12px;background:#0d1712;padding:13px}#panel h2{margin:0 0 8px;color:#e9cb70}.row{display:block;width:100%;margin:6px 0}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1;padding:9px;border:1px solid #806c38;border-radius:7px;background:#18251e}</style></head><body><div id="app"><header><div><h1>王都レクシア</h1><div class="small">冒険者区・中央広場</div></div><div id="money">12,480 G</div></header><main id="screen"><div class="title"><b>拠点</b><div class="small">冒険の準備を整える</div></div><div class="places"><button class="place" onclick="inn()"><i>♨</i><b>宿・酒場</b><span class="small">会話・噂・休息</span></button><button class="place" onclick="guild()"><i>⚜</i><b>ギルド</b><span class="small">依頼・情報・査定</span></button><button class="place" onclick="market()"><i>⚒</i><b>市場</b><span class="small">購入・加工</span></button><button class="place" onclick="dungeon()"><i>♜</i><b>ダンジョン</b><span class="small">行き先・出撃</span></button></div></main><section id="party"><button class="m" onclick="character(0)"><div class="face">🛡️</div><b>ガルド</b><div class="hp"></div></button><button class="m" onclick="character(1)"><div class="face">🗡️</div><b>リゼ</b><div class="hp"></div></button><button class="m" onclick="character(2)"><div class="face">⚔️</div><b>エルン</b><div class="hp"></div></button><button class="m" onclick="character(3)"><div class="face">🏹</div><b>セナ</b><div class="hp"></div></button><button class="m" onclick="character(4)"><div class="face">🔮</div><b>ミレア</b><div class="hp"></div></button><button class="m" onclick="character(5)"><div class="face">✨</div><b>ユナ</b><div class="hp"></div></button></section><nav><button onclick="town()"><span class="ico">⌂</span>拠点</button><button onclick="partyMenu()"><span class="ico">♟</span>編成</button><button onclick="items()"><span class="ico">🎒</span>所持品</button><button onclick="records()"><span class="ico">▣</span>記録</button><button onclick="settings()"><span class="ico">⚙</span>設定</button></nav></div><div id="modal"><div id="panel"></div></div><script>
var names=['ガルド','リゼ','エルン','セナ','ミレア','ユナ'];var gold=12480;
function show(x){document.getElementById('panel').innerHTML=x;document.getElementById('modal').className='on'}
function closeM(){document.getElementById('modal').className=''}
function back(){return '<div class="actions"><button onclick="closeM()">戻る</button></div>'}
function note(x){show('<h2>'+x+'</h2><p class="small">操作を反映しました。</p>'+back())}
function town(){closeM()}
function inn(){show('<h2>宿・酒場</h2><button class="row" onclick="note(\'仲間との会話\')"><b>会話</b></button><button class="row" onclick="note(\'噂を入手\')"><b>噂</b></button><button class="row" onclick="note(\'6人が全回復\')"><b>食事・休息</b></button>'+back())}
function guild(){show('<h2>ギルド</h2><button class="row" onclick="note(\'依頼を受注\')"><b>依頼</b></button><button class="row" onclick="note(\'敵・地形情報\')"><b>情報</b></button><button class="row" onclick="note(\'戦利品を査定\')"><b>査定</b></button>'+back())}
function market(){show('<h2>市場</h2><button class="row" onclick="buy(900)"><b>王国剣 900G</b></button><button class="row" onclick="buy(120)"><b>回復薬 120G</b></button><button class="row" onclick="note(\'加工画面\')"><b>加工</b></button>'+back())}
function buy(v){if(gold>=v){gold-=v;document.getElementById('money').textContent=gold.toLocaleString()+' G';market()}}
function partyMenu(){show('<h2>編成</h2>'+names.map(function(n,i){return '<button class="row" onclick="character('+i+')"><b>'+n+'</b><span class="small">'+(i<3?'前列':'後列')+' / 詳細</span></button>'}).join('')+back())}
function character(i){show('<h2>'+names[i]+'</h2><button class="row" onclick="equip('+i+')"><b>装備</b><span class="small">10枠</span></button><button class="row" onclick="skills('+i+')"><b>スキル</b></button><button class="row" onclick="mastery('+i+')"><b>Mastery</b></button><div class="actions"><button onclick="partyMenu()">一覧</button><button onclick="note(\'列変更\')">列変更</button></div>')}
function equip(i){show('<h2>装備</h2>'+['主武器','副手','予備主武器','予備副手','頭','胴','手','足','装飾品','携行具'].map(function(x){return '<button class="row" onclick="note(\''+x+'変更\')"><b>'+x+'</b></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}
function skills(i){show('<h2>スキル</h2><button class="row" onclick="note(\'主力技セット\')"><b>主力技 Cost5</b></button><button class="row" onclick="note(\'反撃セット\')"><b>反撃 Cost4</b></button><div class="actions"><button onclick="character('+i+')">戻る</button></div>')}
function mastery(i){show('<h2>Mastery</h2>'+['武器','防具','源泉','術法','技能'].map(function(x){return '<button class="row" onclick="note(\''+x+' Mastery\')"><b>'+x+'</b></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}
function items(){show('<h2>所持品</h2><button class="row" onclick="note(\'回復薬を使用\')"><b>回復薬 ×5</b></button><button class="row"><b>解毒薬 ×3</b></button>'+back())}
function records(){show('<h2>記録</h2><button class="row" onclick="note(\'敵図鑑\')"><b>敵</b></button><button class="row" onclick="note(\'ダンジョン記録\')"><b>ダンジョン</b></button><button class="row" onclick="note(\'人物記録\')"><b>人物</b></button>'+back())}
function settings(){show('<h2>設定</h2><button class="row" onclick="note(\'UI設定\')"><b>UI設定</b></button>'+back())}
function dungeon(){show('<h2>ダンジョン</h2><button class="row" onclick="location.href=\'dungeon-v3.html\'"><b>古代迷宮</b><span class="small">全3層 / 出撃</span></button>'+back())}
</script></body></html>
