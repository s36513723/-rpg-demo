<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>街・探索デモ</title><style>body{margin:0;background:#101712;color:#eee;font-family:system-ui}main{max-width:760px;margin:auto;padding:18px}.card{background:#18231b;border:1px solid #78652d;border-radius:14px;padding:16px;margin:12px 0}h1,h2{color:#e1c56e}.party{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.unit{background:#222f25;padding:12px;border-radius:10px;text-align:center}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{background:#27372b;color:#fff;border:1px solid #9b8240;border-radius:9px;padding:12px}.primary{background:#80691f}small{color:#b8c1b9}@media(max-width:560px){.party{grid-template-columns:repeat(2,1fr)}.nav{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><h1>街・探索デモ</h1><small>戦闘開始までのゲームフロー</small><section class="card"><h2>パーティ</h2><p>基本編成：6人 / 前列3人・後列3人</p><div class="party"><div class="unit">ガルド<br>前列</div><div class="unit">リゼ<br>前列</div><div class="unit">エルン<br>前列</div><div class="unit">セナ<br>後列</div><div class="unit">ミレア<br>後列</div><div class="unit">ユナ<br>後列</div></div></section><section class="card"><h2>街・拠点</h2><div class="nav"><button>宿・酒場</button><button>ギルド</button><button>市場</button><button class="primary" onclick="document.querySelector('#d').scrollIntoView()">ダンジョン</button></div></section><section class="card" id="d"><h2>古代迷宮</h2><p>全3層。挑戦ごとに各層のテーマが変化します。</p><p>第1層　森林　→　⚔ 通常戦 / ◇ 探索 / ? イベント</p><p>第2層　洞窟　→　☠ 強敵 / ⛺ 野営 / ⚒ 鍛冶</p><p>第3層　廃墟都市　→　⚔ 通常戦 / 🛒 商人 / 👑 ボス</p><button class="primary" onclick="document.querySelector('#battle').hidden=false">⚔ 戦闘地点へ進む</button></section><section class="card" id="battle" hidden><h2>戦闘直前</h2><p>地形：狭所　敵：重装兵×2・弓兵・魔術師</p><p>既知弱点：重装兵＝壊 / 魔術師＝斬</p><p>6人の列・装備・予備武器・スキルセットを確認して戦闘へ。</p><button class="primary" onclick="location.href='../index.html'">戦闘デモへ</button></section></main></body></html>
