<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RPG PLAY</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#060a08;color:#eee;font-family:system-ui,sans-serif}button{color:inherit;font:inherit}#app{height:100dvh;max-width:620px;margin:auto;padding:10px;display:grid;grid-template-rows:54px 1fr 106px 50px;gap:7px;background:#08100c}.box{border:1px solid #75602d;border-radius:10px;background:#0d1712}header{padding:8px 12px;display:flex;justify-content:space-between}h1{font-size:18px;color:#ead079;margin:0}.small{font-size:10px;color:#aeb8b0}#screen{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 18%,#365442,#0b1712 58%)}.label{padding:13px;color:#e9cd73}.places{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.place{height:72px;border:1px solid #8a7439;border-radius:9px;background:#14231b;text-align:left;padding:10px}.place.hot{background:#302817}.place b{display:block;color:#e9cb70}.place i{font-style:normal;font-size:26px;float:left;margin-right:10px}.party{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:5px}.m{border:1px solid #405547;border-radius:6px;background:#101d17;text-align:center;padding:3px}.face{height:44px;border-radius:4px;background:#26392e;display:grid;place-items:center;font-size:21px}.m b{font-size:8px;display:block}.hp{height:3px;background:#3bad67}nav{display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden}nav button{border:0;border-right:1px solid #35442e;background:#0e1813;font-size:9px}.ico{font-size:17px;display:block}.modal{position:fixed;inset:0;background:#020403cc;display:none;align-items:center;justify-content:center;padding:18px;z-index:9}.modal.on{display:flex}.panel{width:min(100%,550px);max-height:86dvh;overflow:auto;border:1px solid #a88c43;border-radius:12px;background:#0d1712;padding:13px}.panel h2{margin:0 0 8px;color:#e9cb70}.row{display:block;width:100%;margin:6px 0;padding:10px;border:1px solid #746438;border-radius:8px;background:#14231b;text-align:left}.row b{display:block;color:#e8ca70}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1;padding:9px;border:1px solid #806c38;border-radius:7px;background:#18251e}.toast{position:fixed;left:50%;bottom:180px;transform:translateX(-50%);padding:8px 12px;background:#111b15;border:1px solid #a78c43;border-radius:7px;display:none;z-index:20}.toast.on{display:block}</style></head><body><div id="app"><header class="box"><div><h1>王都レクシア</h1><div class="small">冒険者区・中央広場</div></div><div id="money">12,480 G</div></header><main id="screen" class="box"><div class="label"><b>拠点</b><div class="small">冒険の準備を整える</div></div><div class="places"><button class="place" onclick="inn()"><i>♨</i><b>宿・酒場</b><span class="small">会話・噂・休息</span></button><button class="place" onclick="guild()"><i>⚜</i><b>ギルド</b><span class="small">依頼・情報・査定</span></button><button class="place" onclick="market()"><i>⚒</i><b>市場</b><span class="small">武器・防具・加工</span></button><button class="place hot" onclick="dungeon()"><i>♜</i><b>ダンジョン</b><span class="small">行き先・出撃</span></button></div></main><section class="party box" id="party"><button class="m" data-char="0"><div class="face">🛡️</div><b>ガルド</b><div class="hp"></div></button><button class="m" data-char="1"><div class="face">🗡️</div><b>リゼ</b><div class="hp"></div></button><button class="m" data-char="2"><div class="face">⚔️</div><b>エルン</b><div class="hp"></div></button><button class="m" data-char="3"><div class="face">🏹</div><b>セナ</b><div class="hp"></div></button><button class="m" data-char="4"><div class="face">🔮</div><b>ミレア</b><div class="hp"></div></button><button class="m" data-char="5"><div class="face">✨</div><b>ユナ</b><div class="hp"></div></button></section><nav class="box"><button onclick="town()"><span class="ico">⌂</span>拠点</button><button onclick="party()"><span class="ico">♟</span>編成</button><button onclick="items()"><span class="ico">🎒</span>所持品</button><button onclick="records()"><span class="ico">▣</span>記録</button><button onclick="settings()"><span class="ico">⚙</span>設定</button></nav></div><div class="modal" id="modal"><div class="panel" id="panel"></div></div><div class="toast" id="toast"></div><script>
(function(){var S={gold:12480,potions:5,quest:false};try{var q=localStorage.getItem('rpgplay');if(q)S=Object.assign(S,JSON.parse(q))}catch(e){}var modal=document.getElementById('modal'),panel=document.getElementById('panel'),money=document.getElementById('money');function save(){try{localStorage.setItem('rpgplay',JSON.stringify(S))}catch(e){}money.textContent=S.gold.toLocaleString()+' G'}function msg(t){var x=document.getElementById('toast');x.textContent=t;x.className='toast on';setTimeout(function(){x.className='toast'},1000)}function closeM(){modal.className='modal'}function show(h){panel.innerHTML=h;modal.className='modal on'}function back(){return '<div class="actions"><button onclick="closeM()">戻る</button></div>'}function town(){closeM();document.querySelector('h1').textContent='王都レクシア'}function inn(){show('<h2>宿・酒場</h2><button class="row" data-msg="仲間との会話"><b>会話</b><span class="small">仲間・NPCとの任意会話</span></button><button class="row" data-msg="噂：森の奥に隠し祭壇"><b>噂</b></button><button class="row" data-msg="6人が全回復"><b>食事・休息</b></button>'+back())}function guild(){show('<h2>ギルド</h2><button class="row" data-quest><b>依頼</b><span class="small">'+(S.quest?'森林巡回路：進行中':'森林巡回路：未受注')+'</span></button><button class="row" data-msg="重装兵：壊弱点 / 斬耐性"><b>情報</b></button><button class="row" data-msg="未鑑定の古器：1200G"><b>査定</b></button>'+back())}function market(){show('<h2>市場</h2><button class="row" data-buy="900"><b>王国剣　900G</b></button><button class="row" data-buy="650"><b>軽装胴　650G</b></button><button class="row" data-buy="120" data-potion><b>回復薬　120G</b></button><button class="row" data-msg="加工：修理・強化・特性変更"><b>加工</b></button>'+back())}function party(){show('<h2>編成</h2>'+['ガルド　前列　槌/斧','リゼ　前列　短剣/投擲','エルン　前列　剣/槍','セナ　後列　弓/槍','ミレア　後列　杖/魔術','ユナ　後列　符/信仰'].map(function(x,i){return '<button class="row" data-char="'+i+'"><b>'+x+'</b><span class="small">能力・装備・スキル・Mastery</span></button>'}).join('')+back())}function char(i){var n=['ガルド','リゼ','エルン','セナ','ミレア','ユナ'][i];show('<h2>'+n+'</h2><button class="row" data-msg="装備10枠を表示"><b>装備</b><span class="small">主・副・予備・防具・装飾・携行具</span></button><button class="row" data-msg="スキルセットを表示"><b>スキル</b></button><button class="row" data-msg="Masteryツリーを表示"><b>Mastery</b></button>'+back())}function items(){show('<h2>所持品</h2><button class="row" data-use><b>回復薬 ×'+S.potions+'</b></button><button class="row"><b>解毒薬 ×3</b></button>'+back())}function records(){show('<h2>記録</h2><button class="row" data-msg="敵図鑑を表示"><b>敵図鑑</b></button><button class="row" data-msg="ダンジョン記録を表示"><b>ダンジョン</b></button><button class="row" data-msg="人物記録を表示"><b>人物</b></button>'+back())}function settings(){show('<h2>設定</h2><button class="row" data-msg="UI設定"><b>UI設定</b></button><button class="row" data-reset><b>データ初期化</b></button>'+back())}function dungeon(){show('<h2>ダンジョン選択</h2><button class="row" data-go><b>古代迷宮</b><span class="small">全3層・テーマ可変</span></button><button class="row" data-msg="未解放"><b>辺境遺跡</b></button>'+back())}
save()})();
</script></body></html>
