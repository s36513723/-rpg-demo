function battleStyle(i){var a=stats[i],m=eq[i][0].split('：')[1];if(a[2]>=45)return '術式攻撃';if(a[3]>=45)return '支援・防護';if(a[1]>=45)return m=='長弓'?'遠距離射撃':'技巧・急襲';if(a[0]>=45)return eq[i][1].indexOf('盾')>=0?'重装防衛':'前衛打撃';return '万能型'}function mainMastery(i){var x=learnedTree[i];return x.length?x[x.length-1]:'未設定'}function character(i){var a=stats[i];show('<h2>'+names[i]+'</h2><p class="small">'+battleStyle(i)+' / '+rows[i]+'</p><button class="row" onclick="charOverview('+i+')"><b>概要</b><span class="small">主力武器・Mastery・スキル</span></button><button class="row" onclick="charAbility('+i+')"><b>能力</b><span class="small">能力値・派生値・耐性</span></button><button class="row" onclick="charMastery('+i+')"><b>Mastery取得状況</b></button><button class="row" onclick="equip('+i+')"><b>装備</b></button><button class="row" onclick="skills('+i+')"><b>スキル</b></button><div class="actions"><button onclick="partyMenu()">一覧</button><button onclick="toggleRow('+i+')">列変更</button></div>')}function charOverview(i){show('<h2>'+names[i]+' / 概要</h2><p class="small">戦闘スタイル：'+battleStyle(i)+'<br>列：'+rows[i]+'<br>主力武器：'+eq[i][0].split('：')[1]+'<br>主力Mastery：'+mainMastery(i)+'<br>主力スキル：'+(learned[i][learned[i].length-1]||'通常攻撃')+'</p><div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function charAbility(i){var a=stats[i],r=resist[i];show('<h2>'+names[i]+' / 能力</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px">'+['PHY','SKL','ARC','MND'].map(function(x,k){return '<button class="row" style="text-align:center" onclick="addStat('+i+','+k+')"><b>'+x+' '+a[k]+'</b></button>'}).join('')+'</div><p class="small">Stat Pt '+statPt[i]+'<br>HP '+a[0]+' / SP '+(a[0]+a[1]*2)+' / MP '+(a[2]+a[3])+'<br>物防 '+a[0]+' / 魔防 '+(a[2]+a[3])+' / 重量制限 '+a[0]+'</p><button class="row" onclick="resistView('+i+')"><b>耐性</b><span class="small">属性・状態異常・封じ</span></button><div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function resistView(i){var r=resist[i];show('<h2>耐性</h function stanceInfo(i){var main=eq[i][0].split('：')[1],off=eq[i][1].split('：')[1],carry=eq[i][9].split('：')[1],s=(main=='なし'&&off=='なし')?'無手':off=='なし'?'両手持ち':off.indexOf('盾')>=0?'盾併用':'二刀流',fx=s=='両手持ち'?'実効重量軽減 / 威力・崩し・命中↑':s=='二刀流'?'主副武器技を使用 / 高Cost':s=='盾併用'?'盾技・防御・反撃を使用':'無手Mastery最大適用';if(carry.indexOf('投')>=0)s+='＋投擲';return {name:s,effect:fx}}function equip(i){var a=stats[i],main=eq[i][0].split('：')[1],off=eq[i][1].split('：')[1],w=eq[i].reduce(function(z,x){var v=x.split('：')[1];return z+(WM[v]?WM[v][2]:ARM[v]?ARM[v][0]:v=='なし'?0:1)},0),stance=stanceInfo(i).name,pen=w>a[0]?'⚠ 重量超過：速度・回避・武器性能低下':'重量正常';show('<h2>装備</h2><p class="small">運用：'+stance+'<br>'+stanceInfo(i).effect+'<br>防具：'+eq[i][4].split('：')[1]+'統一 / 重量 '+w+' / '+a[0]+'　'+pen+'</p>'+eq[i].map(function(x,k){return '<button class="row" onclick="equipChoice('+i+','+k+')"><b>'+x+'</b><span class="small">変更</span></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function equipChoice(i,k){var current=eq[i][k].split('：')[1];var list=k<4?['なし'].concat(inventory.weapons):(k>=4&&k<=7?inventory.armor:['護符','回復薬']);show('<h2>装備候補</h2><p class="small">現在：'+current+'</p>'+list.map(function(x){var meta='',ok=true;if(k<4&&WM[x]){var m=WM[x],idx={PHY:0,SKL:1,ARC:2,MND:3}[m[3]];ok=m[3]=='―'||stats[i][idx]>=m[4];meta=m[0]+' / '+m[1]+' / 重量'+m[2]+' / '+m[3]+' '+m[4]+' / +'+(upgrades[x]||0)+' / '+(traits[x]||'特性なし')+(ok?'':'　⚠要求不足')}else if(ARM[x])meta='重量'+ARM[x][0]+' / '+ARM[x][1];var mark=x==current?'✓ ':'';return '<button class="row" style="opacity:'+(ok?1:.5)+'" '+(ok?'onclick="setEquip('+i+','+k+',\''+x+'\')"':'')+'><b>'+mark+x+'</b><span class="small">'+meta+'</span></button>'}).join('')+'<div class="actions"><button onclick="equip('+i+')">戻る</button></div>')}function setEquip(i,k,x){if(k>=4&&k<=7&&(x=='魔装'||x=='軽装'||x=='重装')){for(var z=4;z<=7;z++){var sl=eq[i][z].split('：')[0];eq[i][z]=sl+'：'+x}persist();return equip(i)}if(k==1&&x!='なし'&&x.indexOf('盾')<0&&stats[i][1]<30)return note('二刀流にはSKL 30以上が必要');var slot=eq[i][k].split('：')[0];eq[i][k]=slot+'：'+x;persist();equip(i)}
function weaponKind(n){if(/槌/.test(n))return '槌';if(/斧/.test(n))return '斧';if(/短剣/.test(n))return '短剣';if(/剣/.test(n))return '剣';if(/槍/.test(n))return '槍';if(/弓/.test(n))return '弓';if(/杖/.test(n))return '杖';if(/盾/.test(n))return '盾';if(/回刃/.test(n))return '投擲';return n}function skillUsable(i,s){var w=skillWeapon[s];if(!w)return true;var held=[eq[i][0],eq[i][1],eq[i][2],eq[i][3]].map(function(x){return weaponKind(x.split('：')[1])});if(w=='格闘')return held[0]=='なし'&&held[1]=='なし';if(w=='投擲')return held.indexOf('投擲')>=0||eq[i][9].indexOf('投')>=0||learnedTree[i].indexOf('携行強化')>=0;return held.indexOf(w)>=0}function skillMeta(s){if(SKILLMETA[s])return SKILLMETA[s];var passive=/軽減|強化|耐性|補助|特効|心眼|先制|回復$/.test(s);return [passive?3:4,passive?'Passive':'Active']}function skillCap(i){return 24+(learnedTree[i].indexOf('容量拡張')>=0?4:0)}function effectiveCost(i,s){var n=skillMeta(s)[0];if(learnedTree[i].indexOf('Cost軽減')>=0&&n>0)n=Math.max(1,n-1);return n}function skillCost(i){return skillSet[i].reduce(function(z,s){return z+effectiveCost(i,s)},0)}function skills(i){var all=learned[i].filter(function(s){return s!='通常攻撃'&&s!='防御'}),cost=skillCost(i);show('<h2>スキルセット</h2><p class="small">Set Cost '+cost+' / '+skillCap(i)+'　Active / Passive</p><button class="row"><b>通常攻撃 / 防御</b><span class="small">基本行動・Cost 0</span></button>'+all.map(function(s){var m=skillMeta(s),ec=effectiveCost(i,s),on=skillSet[i].indexOf(s)>=0,use=skillUsable(i,s);return '<button class="row" style="opacity:'+(use?1:.5)+'" onclick="toggleLearnedSkill('+i+',\''+s+'\')"><b>'+(on?'✓ ':'○ ')+s+'</b><span class="small">'+m[1]+' / Cost '+ec+(use?'':' / ⚠対応武器なし')+'</span></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function toggleLearnedSkill(i,s){if(!skillUsable(i,s))return note('現在の主・副・予備装備では使用できません');var p=skillSet[i].indexOf(s),m=skillMeta(s);if(p>=0)skillSet[i].splice(p,1);else{if(skillCost(i)+effectiveCost(i,s)>skillCap(i))return note('Set Cost上限を超えます');skillSet ons"><button onclick="closeM();drawDungeon()">進む</button></div>')}function camp(){show('<h2>野営</h2><p class="small">HP・SP・MPを部分回復。装備・スキルを調整できます。</p><button class="row" onclick="partyMenu()"><b>編成・装備</b></button><button class="row" onclick="skills(0)"><b>スキルセット</b></button><button class="row" onclick="moraleMenu()"><b>士気行動</b><span class="small">現在：'+morale+'</span></button><div class="actions"><button onclick="closeM();drawDungeon()">探索へ戻る</button></div>')}function trapEvent(){if(hasSkill('罠解除')||hasSkill('解錠'))return show('<h2>仕掛けを発見</h2><p class="small">探索Masteryにより罠を看破した。</p><button class="row" onclick="loot.古器+=2;nodeResult(\'罠解除成功\',\'未鑑定の古器×2\')"><b>盗技で解除</b></button><button class="row" onclick="eventChoice()"><b>別の方法を試す</b></button>');eventChoice()}function moraleMenu(){var opts=[];if(hasSkill('鼓舞歌')||hasSkill('戦歌'))opts.push(['歌唱','次戦：士気・回復補助']);if(hasSkill('回避舞')||hasSkill('速度舞'))opts.push(['舞踏','次戦：速度・回避補助']);if(hasSkill('旋律')||hasSkill('SP支援'))opts.push(['奏楽','次戦：SP支援']);if(hasSkill('攻勢号令')||hasSkill('防勢号令'))opts.push(['号令','次戦：攻勢・防勢']);if(!opts.length)return note('士気Masteryの個別スキルが必要');show('<h2>士気行動</h2>'+opts.map(function(x){return '<button class="row" onclick="setMorale(\''+x[0]+'\')"><b>'+x[0]+'</b><span class="small">'+x[1]+'</span></button>'}).join('')+'<div class="actions"><button onclick="camp()">戻る</button></div>')}function setMorale(x){morale=x;camp()}function eventChoice(){show('<h2>イベント</h2><p class="small">崩れた祠の奥から魔力を感じる。</p><button class="row" onclick="loot.古器++;nodeResult(\'遺物を調べる\',\'未鑑定の古器×1\')"><b>遺物を調べる</b></button><button class="row" onclick="mp=mp.map(function(x){return x+1});nodeResult(\'祈りを捧げる\',\'全員 Mastery Pt +1\')"><b>祈りを捧げる</b></button><button class="row" onclick="nodeResult(\'立ち去る\',\'何も起こらなかった\')"><b>立ち去る</b></button></div>')}function encounterData(td){var e=td.enemy.split('・');return {front:e.slice(0,Math.max(1,Math.ceil(e.length/2))),back:e.slice(Math.max(1,Math.ceil(e.length/2))),status:td.t=='沼地'?'猛毒・盲目':td.t=='地下神殿'?'睡眠・動揺':td.t=='洞窟'?'気絶・腕封じ':'頭/腕/脚封じ'}}function nodeInfo(x){var td=themeData(),intel=intelLevel(),idx=routeDone[routeDone.length-1],nt=nodeTerrain[idx]||terrainPool(td.t)[0],enc=encounterData(td);td.enemy.split('・').forEach(function(e){addUnique(journal.enemies,e);if(!journal.enemyData[e])journal.enemyData[e]={seen:1,physical:'未判明',magic:'未判明',status:'未判明'};else journal.enemyData[e].seen++});if(intel>1){addUnique(journal.weakness,td.tactic);td.enemy.split('・').forEach(function(e){var d=journal.enemyData[e];if(e.indexOf('重装')>=0)d.physical='壊○ / 斬△';else if(e.indexOf('飛行')>=0)d.physical='突○ / 弓・投擲○';else d.physical='斬突壊：調査中';d.magic='火水土風：調査中';d.status='封じ・異常：調査中'})}var detail='層テーマ：'+td.t+'<br>戦闘地点：'+nt+' — '+terrainEffect(nt)+(intel>0?'<br>敵前列：'+enc.front.join('・')+'<br>敵後列：'+(enc.back.join('・')||'なし'):'')+(intel>1?'<br>既知弱点・推奨：'+td.tactic+'<br>警戒：'+enc.status:'');show('<h2>'+x+'</h2><p class="small">'+detail+'</p><button class="row" onclick="battlePrep()"><b>出撃準備</b><span class="small">6人の列・主武器・予備武器を確認</span></button><div class="actions"><button onclick="closeM()">戻る</button><button onclick="battleDemo()">戦闘へ</button></div>')}function battlePrep(){var td=themeData(),idx=routeDone[routeDone.length-1],nt=nodeTerrain[idx]||terrainPool(td.t)[0];show('<h2>戦闘直前</h2><p class="small">'+nt+' — '+terrainEffect(nt)+'</p>'+names.map(function(n,i){return '<button class="row" onclick="prepMember('+i+')"><b>'+n+'　'+rows[i]+'</b><span class="small">'+eq[i][0]+' ⇄ '+eq[i][2]+'</span></button>'}).join('')+'<div class="actions"><button onclick="closeM();drawDungeon()">マップ</button><button onclick="battleDemo()">戦闘へ</button></div>')}function prepMember(i){show('<h2>'+names[i]+' / 戦闘準備</h2><p class="small">'+rows[i]+'<br>'+eq[i][0]+'<br>'+eq[i][2]+'</p><button class="row" onclick="swapMain('+i+')"><b>主武器 ⇄ 予備主武器</b></button><button class="row" onclick="rows['+i+']=rows['+i+']==\'前列\'?\'後列\':\'前列\';persist();prepMember('+i+')"><b>列変更</b></button><button class="row" onclick="skills('+i+')"><b>スキルセット</b></button><div class="actions"><button onclick="battlePrep()">戻る</button></div>')}function swapMain(i){var a=eq[i][0].split('：')[1],b=eq[i][2].split('：')[1];eq[i][0]='主武器：'+b;eq[i][2]='予備主：'+a;persist();prepMember(i)}function battleDemo(){var td=themeData();var ctx={morale:morale,floor:floor,themes:floorThemes,routeOpen:routeOpen,routeDone:routeDone,terrain:(nodeTerrain[routeDone[routeDone.length-1]]||td.terrain),enemy:td.enemy,rows:rows,equipment:eq,stances:names.map(function(n,i){return stanceInfo(i)}),skillSet:skillSet,result:null};morale='なし';try{localStorage.setItem('rpg.exploreBattle',JSON.stringify(ctx))}catch(e){}location.href='../index.html'}function nextFloor(){nodeTerrain={};dungeonProgress[dungeonId].best=Math.max(dungeonProgress[dungeonId].best,floor);floor++;routeOpen=[0,1];routeDone=[];if(floor>3){dungeonProgress[dungeonId].clear++;dungeonProgress[dungeonId].best=3;if(dungeonId=='古代迷宮'&&unlocked.indexOf('辺境遺跡')<0)unlocked.push('辺境遺跡');if(dungeonId=='辺境遺跡'&&unlocked.indexOf('深淵の樹海')<0)unlocked.push('深淵の樹海');if(dungeonId=='深淵の樹海'&&unlocked.indexOf('沈黙の砂都')<0)unlocked.push('沈黙の砂都');floor=1;quests.forEach(function(q){if(q.state==1&&q.type=='clear'&&q.d==dungeonId)q.state=2});gold+=2500;persist();persist();note('古代迷宮を踏破：2,500G獲得');setTimeout(returnTown,500)}else drawDungeon()}function returnTown(){closeM();town()}
function resumeBattle(){var ctx=null;try{ctx=JSON.parse(localStorage.getItem('rpg.exploreBattle')||'null')}catch(e){}if(!ctx||!ctx.result)return false;floor=ctx.floor||1;floorThemes=ctx.themes||floorThemes;routeOpen=ctx.routeOpen||[0,1];routeDone=ctx.routeDone||[];if(ctx.result=='win'){gold+=300;persist();note('戦闘勝利：300G獲得');setTimeout(function(){closeM();drawDungeon()},450)}else{returnTown();setTimeout(function(){note(ctx.result=='escape'?'戦闘から撤退した':'敗北して街へ撤退した')},100)}try{localStorage.removeItem('rpg.exploreBattle')}catch(e){}return true}loadGame();if(ui.compact)document.body.style.fontSize='14px';persist();if(location.search.indexOf('resume=1')>=0){if(!resumeBattle())town()}else town();
