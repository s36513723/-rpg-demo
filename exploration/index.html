<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>古代迷宮 | 探索</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070c0a;color:#eee;font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif}button{font:inherit;color:inherit}
#app{height:100dvh;max-width:620px;margin:auto;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-rows:54px minmax(0,1fr) 112px 52px;gap:8px;background:radial-gradient(circle at 50% 30%,#153126aa,#08110dcc 55%,#050806 100%)}
.top,.party,.nav{border:1px solid #725f2d;background:#0c1511eF;box-shadow:0 0 18px #0008}.top{border-radius:10px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:18px;margin:0;color:#e6ca72}.sub{font-size:11px;color:#aab7ad;margin-top:2px}.floor{color:#d9bd63;font-size:13px;text-align:right}
.map{position:relative;min-height:0;border:1px solid #4e4a2b;border-radius:12px;overflow:hidden;background:linear-gradient(#07100dc9,#0a1512a8),radial-gradient(ellipse at 50% 90%,#24523c 0,#102a20 35%,transparent 65%),linear-gradient(145deg,#162d26,#06100d);box-shadow:inset 0 0 60px #000}
.map:before{content:"";position:absolute;inset:0;opacity:.22;background-image:repeating-linear-gradient(115deg,transparent 0 38px,#8aa38d14 39px 40px),radial-gradient(circle at 20% 30%,#7fae8355 0 1px,transparent 2px);pointer-events:none}
.map-title{position:absolute;top:10px;left:12px;z-index:3;font-size:12px;color:#d7c686}.legend{position:absolute;top:9px;right:10px;z-index:4;background:#07100dcc;border:1px solid #665729;border-radius:7px;padding:5px 7px;font-size:9px;line-height:1.55;color:#c5c9c5}
svg.paths{position:absolute;inset:0;width:100%;height:100%;z-index:1}.path{stroke:#b9ae7a;stroke-width:1.6;stroke-dasharray:3 5;opacity:.65}
.node{position:absolute;z-index:2;width:43px;height:43px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #a08a48;background:#0b1713;display:grid;place-items:center;font-size:20px;box-shadow:0 0 0 4px #07100dbb,0 4px 12px #000;cursor:pointer}.node.done{opacity:.45}.node.active{border-color:#ffe47a;box-shadow:0 0 0 4px #4b3c13,0 0 22px #ffc928}.node.lock{opacity:.5;filter:grayscale(.7)}.start{font-size:9px;width:46px;height:28px;border-radius:8px}.party{border-radius:10px;padding:7px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.member{min-width:0;border:1px solid #3f5949;border-radius:7px;background:#101d17;padding:4px 3px;text-align:center;position:relative}.portrait{height:48px;border-radius:5px;background:linear-gradient(145deg,#52675a,#18251e);display:grid;place-items:center;font-size:23px}.member b{display:block;font-size:9px;white-space:nowrap;overflow:hidden}.bars i{display:block;height:3px;margin-top:2px;border-radius:2px;background:#3eb66c}.bars i:nth-child(2){background:#398fd0;width:70%}.nav{border-radius:10px;display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden}.nav button{border:0;border-right:1px solid #3d482e;background:transparent;font-size:10px}.nav button:first-child{background:#27351d;color:#f1d77d}.ico{font-size:18px;display:block}.sheet{position:absolute;z-index:10;left:12px;right:12px;bottom:180px;background:#0b1511f7;border:1px solid #9a8040;border-radius:12px;padding:14px;box-shadow:0 10px 40px #000;display:none}.sheet.show{display:block}.sheet h2{margin:0 0 6px;color:#e4c76e;font-size:17px}.sheet p{font-size:12px;color:#c3cac4;line-height:1.55;margin:5px 0}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;padding:9px;border-radius:7px;border:1px solid #8e7940;background:#16221b}.actions .go{background:linear-gradient(#8e762a,#5b4816);color:white}
</style></head><body><main id="app"><header class="top"><div><h1>古代迷宮</h1><div class="sub">失われた文明の遺構</div></div><div class="floor">第1層<br><span class="sub">森林・峡所</span></div></header>
<section class="map" id="map"><div class="map-title">探索経路　● 現在地</div><div class="legend">⚔ 戦闘　☠ 強敵<br>？イベント　⛺ 野営<br>◇ 探索　⚒ 鍛冶<br>🛒 商人　♛ ボス</div><svg class="paths" viewBox="0 0 100 100" preserveAspectRatio="none">
<path class="path" d="M50 91 L35 75 M50 91 L65 75 M35 75 L22 58 M35 75 L48 58 M65 75 L48 58 M65 75 L78 58 M22 58 L30 40 M48 58 L45 40 M48 58 L62 40 M78 58 L62 40 M30 40 L50 23 M45 40 L50 23 M62 40 L50 23 M50 23 L50 9"/></svg>
<button class="node start done" style="left:50%;top:91%">START</button>
<button class="node active" data-title="獣道の伏兵" data-info="地形：茂み・狭所｜敵：獣×3、弓兵×1" style="left:35%;top:75%">⚔</button><button class="node active" data-title="苔むした祭壇" data-info="探索判定。素材・遺物・隠し経路を発見できる。" style="left:65%;top:75%">◇</button>
<button class="node lock" data-title="旅人の野営地" data-info="部分回復・装備調整・スキルセット変更。" style="left:22%;top:58%">⛺</button><button class="node lock" data-title="森の異変" data-info="何かが木々の奥で動いている。" style="left:48%;top:58%">？</button><button class="node lock" data-title="森の番人" data-info="強敵。Mastery Ptと希少装備の可能性。" style="left:78%;top:58%">☠</button>
<button class="node lock" style="left:30%;top:40%">⚔</button><button class="node lock" style="left:45%;top:40%">🛒</button><button class="node lock" style="left:62%;top:40%">⚒</button><button class="node lock" style="left:50%;top:23%">⚔</button><button class="node lock" style="left:50%;top:9%">♛</button>
</section>
<section class="party"><div class="member"><div class="portrait">🛡️</div><b>ガルド</b><div class="bars"><i></i><i></i></div></div><div class="member"><div class="portrait">🗡️</div><b>リゼ</b><div class="bars"><i></i><i></i></div></div><div class="member"><div class="portrait">⚔️</div><b>エルン</b><div class="bars"><i></i><i></i></div></div><div class="member"><div class="portrait">🏹</div><b>セナ</b><div class="bars"><i></i><i></i></div></div><div class="member"><div class="portrait">🔮</div><b>ミレア</b><div class="bars"><i></i><i></i></div></div><div class="member"><div class="portrait">✨</div><b>ユナ</b><div class="bars"><i></i><i></i></div></div></section>
<nav class="nav"><button><span class="ico">⌂</span>探索</button><button><span class="ico">♟</span>編成</button><button><span class="ico">🎒</span>所持品</button><button><span class="ico">▣</span>記録</button><button><span class="ico">⚙</span>設定</button></nav>
<div class="sheet" id="sheet"><h2 id="st"></h2><p id="si"></p><p>進行前に6人の装備・列・予備武器を変更できます。</p><div class="actions"><button onclick="sheet.classList.remove('show')">戻る</button><button>編成・装備</button><button class="go" onclick="location.href='../index.html'">進む</button></div></div>
</main><script>const sheet=document.querySelector('#sheet'),st=document.querySelector('#st'),si=document.querySelector('#si');document.querySelectorAll('.node[data-title]').forEach(n=>n.onclick=()=>{st.textContent=n.dataset.title;si.textContent=n.dataset.info;sheet.classList.add('show')});</script></body></html>
