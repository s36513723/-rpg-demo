<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>王都レクシア</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080b09;color:#eee;font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif}button{font:inherit;color:inherit}#app{height:100dvh;max-width:620px;margin:auto;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-rows:58px minmax(0,1fr) 108px 50px;gap:8px;background:#070c09}.top,.party,.nav{border:1px solid #725f2d;background:#0c1511ef}.top{border-radius:10px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:19px;margin:0;color:#ead17b}.sub{font-size:10px;color:#aab7ad}.money{font-size:12px;color:#e5cc7a}
.scene{position:relative;min-height:0;border:1px solid #554b29;border-radius:12px;overflow:hidden;background:linear-gradient(#08111630,#07100de8),radial-gradient(circle at 50% 20%,#8da8b744 0,#314a4866 24%,transparent 55%),linear-gradient(150deg,#1b3331,#0b1713);box-shadow:inset 0 -80px 80px #050906}.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent 45%,#16241c 46% 48%,transparent 49%),linear-gradient(25deg,transparent 55%,#27372c 56% 58%,transparent 59%);opacity:.45}.skyline{position:absolute;inset:7% 7% 42%;opacity:.65;background:linear-gradient(135deg,transparent 0 9%,#1c2825 10% 20%,transparent 21% 28%,#24322d 29% 44%,transparent 45% 55%,#17231f 56% 68%,transparent 69%);clip-path:polygon(0 100%,0 65%,9% 65%,12% 30%,16% 65%,30% 65%,35% 15%,39% 65%,52% 65%,57% 35%,62% 65%,75% 65%,81% 5%,87% 65%,100% 65%,100% 100%)}.caption{position:absolute;top:14px;left:15px;z-index:2}.caption b{color:#f0d783;font-size:16px}.places{position:absolute;z-index:3;left:12px;right:12px;bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.place{height:68px;text-align:left;border:1px solid #9b8140;border-radius:9px;background:linear-gradient(100deg,#101c17f2,#14231bcf);padding:9px 10px;box-shadow:0 5px 15px #0008}.place strong{display:block;color:#ecd17b;font-size:14px}.place span{font-size:9px;color:#b6c0b8}.place .icon{float:left;font-size:25px;margin-right:9px}.place.dungeon{background:linear-gradient(100deg,#202417f2,#423616dc);border-color:#d1ad4e}
.party{border-radius:10px;padding:6px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.member{min-width:0;border:1px solid #3f5949;border-radius:7px;background:#101d17;padding:3px;text-align:center}.portrait{height:44px;border-radius:5px;background:linear-gradient(145deg,#52675a,#18251e);display:grid;place-items:center;font-size:21px}.member b{display:block;font-size:9px;white-space:nowrap;overflow:hidden}.bar{height:3px;margin-top:2px;border-radius:2px;background:#3eb66c}.nav{border-radius:10px;display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden}.nav button{border:0;border-right:1px solid #3d482e;background:transparent;font-size:9px}.nav button:first-child{background:#27351d;color:#f1d77d}.ico{font-size:17px;display:block}
.modal{position:absolute;z-index:20;inset:0;background:#030604b8;display:none;align-items:center;justify-content:center;padding:22px}.modal.show{display:flex}.panel{width:min(100%,520px);max-height:82%;overflow:auto;background:#0b1511;border:1px solid #a18843;border-radius:12px;padding:14px;box-shadow:0 20px 50px #000}.panel h2{margin:0;color:#e6ca72;font-size:18px}.panel p{font-size:11px;color:#b9c1bb}.dest{width:100%;margin:7px 0;border:1px solid #566246;border-radius:8px;background:#111d18;padding:10px;text-align:left}.dest strong{color:#e4c86f}.dest span{display:block;font-size:10px;color:#adb7af;margin-top:3px}.dest.sel{border-color:#d8b854;background:#20251a}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;padding:10px;border:1px solid #806d39;border-radius:7px;background:#16221b}.actions .go{background:linear-gradient(#947b2e,#5c4916)}
</style></head><body><main id="app"><header class="top"><div><h1>王都レクシア</h1><div class="sub">冒険者区・中央広場</div></div><div class="money">◉ 12,480 G</div></header>
<section class="scene"><div class="skyline"></div><div class="caption"><b>拠点</b><div class="sub">冒険の準備を整える</div></div><div class="places">
<button class="place" onclick="inn()"><span class="icon">♨</span><strong>宿・酒場</strong><span>仲間との語らい・噂</span></button>
<button class="place" onclick="guild()"><span class="icon">⚜</span><strong>ギルド</strong><span>依頼・情報・査定</span></button>
<button class="place" onclick="market()"><span class="icon">⚒</span><strong>市場</strong><span>武器・防具・道具・加工</span></button>
<button class="place dungeon" onclick="destinations()"><span class="icon">♜</span><strong>ダンジョン</strong><span>行き先選択・出撃</span></button></div></section>
<section class="party"><div class="member"><div class="portrait">🛡️</div><b>ガルド</b><div class="bar"></div></div><div class="member"><div class="portrait">🗡️</div><b>リゼ</b><div class="bar"></div></div><div class="member"><div class="portrait">⚔️</div><b>エルン</b><div class="bar"></div></div><div class="member"><div class="portrait">🏹</div><b>セナ</b><div class="bar"></div></div><div class="member"><div class="portrait">🔮</div><b>ミレア</b><div class="bar"></div></div><div class="member"><div class="portrait">✨</div><b>ユナ</b><div class="bar"></div></div></section>
<nav class="nav"><button><span class="ico">⌂</span>拠点</button><button><span class="ico">♟</span>編成</button><button><span class="ico">🎒</span>所持品</button><button><span class="ico">▣</span>記録</button><button><span class="ico">⚙</span>設定</button></nav></main>
<div class="modal" id="modal"><div class="panel" id="panel"></div></div><script>
let gold=+(localStorage.rpgGold||12480),quest=localStorage.rpgQuest||'未受注';const m=document.querySelector('#modal'),p=document.querySelector('#panel');function closeM(){m.classList.remove('show')}function inn(){p.innerHTML='<h2>宿・酒場</h2><p>暖炉のそばで仲間と情報を交換する。</p><button class="dest" onclick="alert(\'ガルド：次は壊属性を用意しておこう。\')"><strong>会話</strong><span>仲間との任意会話</span></button><button class="dest" onclick="alert(\'噂：森林の奥に隠し祭壇があるらしい。\')"><strong>噂</strong><span>未確認情報・隠し要素</span></button><button class="dest" onclick="alert(\'6人のHP・SP・MPが全回復した\')"><strong>食事・休息</strong><span>全回復</span></button><div class="actions"><button onclick="closeM()">戻る</button></div>';m.classList.add('show')}function guild(){p.innerHTML='<h2>冒険者ギルド</h2><p>依頼・情報・査定</p><button class="dest" onclick="quest=quest===\'未受注\'?\'進行中\':quest;localStorage.rpgQuest=quest;alert(\'依頼：森林の巡回路を確保せよ / \'+quest)"><strong>依頼</strong><span>受注・進行確認・達成報告</span></button><button class="dest" onclick="alert(\'古代迷宮：森林・洞窟・廃墟都市 / 重装は壊に弱い\')"><strong>情報</strong><span>地形・敵・既知弱点・探索報告</span></button><button class="dest" onclick="alert(\'未査定戦利品はありません\')"><strong>査定</strong><span>鑑定・引取・保管</span></button><div class="actions"><button onclick="closeM()">戻る</button></div>';m.classList.add('show')}function market(){p.innerHTML='<h2>市場</h2><p>所持金 '+gold.toLocaleString()+' G</p><button class="dest" onclick="buy(900,\'王国の剣\')"><strong>武器</strong><span>王国の剣 900G</span></button><button class="dest" onclick="buy(650,\'軽装胴\')"><strong>防具</strong><span>軽装胴 650G</span></button><button class="dest" onclick="buy(120,\'回復薬\')"><strong>道具</strong><span>回復薬 120G</span></button><button class="dest" onclick="alert(\'装備の修理・強化・特性加工画面\')"><strong>加工</strong><span>修理・強化・特性変更</span></button><div class="actions"><button onclick="closeM()">戻る</button></div>';m.classList.add('show')}function buy(v,n){if(gold<v)return alert(\'所持金が足りません\');gold-=v;localStorage.rpgGold=gold;document.querySelector(\'.money\').textContent='◉ '+gold.toLocaleString()+' G';alert(n+'を購入しました');market()}function openInfo(t,d){p.innerHTML='<h2>'+t+'</h2><p>'+d+'</p><div class="actions"><button onclick="closeM()">戻る</button><button class="go" onclick="closeM()">入る</button></div>';m.classList.add('show')}function destinations(){p.innerHTML='<h2>ダンジョン選択</h2><p>探索する地域を選択してください。</p><button class="dest sel"><strong>古代迷宮</strong><span>推奨 Lv.15〜　全3層 / 今回の第1層候補：森林・洞窟・廃墟</span></button><button class="dest"><strong>辺境の遺跡</strong><span>推奨 Lv.10〜　山岳・森林・地下遺構</span></button><button class="dest"><strong>深淵の樹海</strong><span>推奨 Lv.22〜　沼地・森林・地下神殿</span></button><button class="dest"><strong>沈黙の砂都</strong><span>推奨 Lv.28〜　砂漠遺跡・地下神殿</span></button><div class="actions"><button onclick="closeM()">戻る</button><button>情報</button><button class="go" onclick="location.href=\'dungeon.html\'">出撃</button></div>';m.classList.add('show')}m.onclick=e=>{if(e.target===m)closeM()}
</script></body></html>
