for(const slot of ['main','off','reserveMain','reserveOff','carry'])give(slot,bp[slot]);
ARMOR_SLOTS.forEach(s=>give(s,bp.armor+s));give('accessory','charm');
h.learned=SKILLS.filter(s=>(!s.mastery||(h.masteries[s.mastery]||0)>=s.rank)&&h.stats[s.stat]>=s.req).map(s=>s.id);
let cost=0;for(const s of SKILLS.filter(s=>h.learned.includes(s.id)).sort((a,b)=>(a.type==='active'?-1:1)-(b.type==='active'?-1:1))){if(cost+s.cost<=h.capacity){h.skillSet.push(s.id);cost+=s.cost;}}
return h;
});

function portrait(h){
const female=['rog','ran','arc','mys'].includes(h.id),long=['arc','mys'].includes(h.id);
return `<div class="portrait" style="--accent:${h.accent}"><svg viewBox="0 0 62 74" aria-hidden="true"><circle cx="31" cy="28" r="20" fill="none" stroke="currentColor" opacity=".25"/><path d="${long?'M16 65V29C13 6 48 4 48 28v37Z':female?'M16 47V26c-1-20 29-20 30 0l-1 20Z':'M19 34V23C17 6 45 5 45 23v11Z'}" fill="currentColor" opacity=".28"/><path d="M11 74l3-21 13-10v-7h10v7l13 10 3 21" fill="currentColor" opacity=".35"/><path d="M23 19q10-11 17 0v13q-3 10-9 10t-8-10Z" fill="currentColor" opacity=".72"/><path d="${female?'M19 29l3-14q17-8 22 9l-10-6-8 6Z':'M19 25V16l10-4 15 7v6l-12-7Z'}" fill="#25342d"/><path d="M21 50l10 12 10-12M31 62v12" stroke="currentColor" fill="none" opacity=".75"/><path d="M10 73h43M31 1v7M3 36h5m46 0h5" stroke="currentColor" opacity=".3"/></svg><span class="monogram">${h.mark}</span></div>`;
}
function loadState(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const d=JSON.parse(raw);if(d.version===APP_VERSION&&Array.isArray(d.heroes)&&d.heroes.length===6&&Array.isArray(d.gear))return d;}}catch(e){console.warn('Save unavailable',e);}return initialState();}
let state=loadState(),view={page:state.run?(state.pendingBattle?'encounter':'map'):'town',tab:null,hero:'war',group:'武器',dialogue:null},modalState=null,toastTimer=null,storageOK=true;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const heroBy=id=>state.heroes.find(h=>h.id===id);const currentHero=()=>heroBy(view.hero)||state.heroes[0];
const activeHeroes=()=>state.heroes.filter(h=>h.active);
const gearBy=id=>state.gear.find(g=>g.uid===id);
const baseBy=id=>ITEMS[gearBy(id)?.baseId];
const gearOwner=id=>state.heroes.find(h=>Object.values(h.equip).includes(id));
const equippedName=id=>{const g=gearBy(id);return g?ITEMS[g.baseId].name+(g.plus?' ＋'+g.plus:''):'未装備';};
function derived(h){return {hp:h.stats.PHY,sp:h.stats.PHY+2*h.stats.SKL,mp:h.stats.ARC+h.stats.MND,physicalDefense:h.stats.PHY,magicalDefense:h.stats.ARC+h.stats.MND,normalAttack:h.stats.PHY,weightLimit:h.stats.PHY};}
function itemWeight(g){const b=ITEMS[g.baseId];return Math.max(0,(b.weight||0)-(g.trait==='軽量'?2:0));}
function weight(h){let w=0;for(const [slot,id] of Object.entries(h.equip)){if(slot.startsWith('reserve'))continue;const g=gearBy(id);if(g)w+=itemWeight(g);}const main=gearBy(h.equip.main);if(main&&ITEMS[main.baseId].hands===1&&!h.equip.off&&h.skillSet.includes('twohand'))w-=Math.floor(itemWeight(main)*.2);return w;}
function weightPenalty(h){const over=Math.max(0,weight(h)-h.stats.PHY);return {over,speedPenaltyPercent:Math.min(50,over*2),evasionPenaltyPercent:Math.min(50,over*2),weaponPowerPenaltyPercent:Math.min(40,over)};}
const skillCost=h=>h.skillSet.reduce((v,id)=>v+(SKILLS.find(s=>s.id===id)?.cost||0),0);
function log(text){state.history.unshift({time:new Date().toISOString(),text});state.history=state.history.slice(0,150);}
function persist(){state.lastSaved=new Date().toISOString();try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}}
function toast(msg,error=false){$('#toast')?.remove();const t=document.createElement('div');t.id='toast';t.className='toast'+(error?' error':'');t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),4200);}
function fail(msg){toast(msg,true);return false;}
function downloadFile(filename,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function go(page,tab=null){closeModal();view.page=page;view.tab=tab;view.dialogue=null;render();window.scrollTo({top:0,behavior:'instant'});}
function onPage(page){if(['tavern','guild','market','gate'].includes(view.page))return page==='town';if(['equipment','skills','mastery','character'].includes(view.page))return page==='party';if(view.page==='encounter')return page==='map';return page===view.page;}
const NAV=[['town','town','街・拠点'],['map','map','ダンジョン'],['party','party','編成'],['equipment','sword','装備'],['skills','spark','スキル'],['mastery','star','Mastery'],['character','scroll','キャラクター'],['inventory','bag','所持品'],['records','book','記録'],['settings','gear','設定']];
function navButton(p,i,n,cls='nav-item'){return `<button class="${cls} ${onPage(p)?'active':''}" data-action="nav" data-page="${p}">${icon(i)}<span>${n}</span></button>`;}
function layout(content){
const d=state.run&&DUNGEONS.find(d=>d.id===state.run.dungeonId);
return `<div id="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">${icon('star')}</div><div><div class="brand-name">AURIEL</div><div class="eyebrow" style="font-size:7px;letter-spacing:.13em;margin-top:3px">THE CHANGING LABYRINTH</div></div></div><div class="nav-group"><div class="nav-label">WORLD</div>${NAV.slice(0,2).map(x=>navButton(...x)).join('')}</div><div class="nav-group"><div class="nav-label">COMPANY</div>${NAV.slice(2,7).map(x=>navButton(...x)).join('')}</div><div class="nav-group"><div class="nav-label">JOURNAL</div>${NAV.slice(7).map(x=>navButton(...x)).join('')}</div><div class="sidebar-footer"><div class="panel"><div class="eyebrow" style="font-size:8px">${state.run?'ON EXPEDITION':'A PLACE TO RETURN'}</div><p style="margin-top:5px">${state.run?esc(d.name)+' · 第'+(state.run.floor+1)+'層':'灯のある場所へ、また。'}</p></div><span>街と探索のプロトタイプ · v1.0</span></div></aside><div class="main-shell"><header class="topbar"><div class="crumb">${icon('star')}<span>変わりゆく迷宮</span><span>／</span><span>${state.run?'探索中':'アウレル'}</span></div><div class="mobile-logo">${icon('star')} AURIEL</div><div class="top-tools"><div class="saved"><span class="badge-dot"></span> ${storageOK?'自動保存':'保存できません'}</div><div class="purse"><span class="coin">G</span><span class="num">${fmt(state.gold)}</span></div></div></header><div class="layout"><main class="content" id="main-content">${content}</main>${rightRail()}</div></div></div><nav class="bottomnav" aria-label="メインメニュー">${[['town','town','街'],['map','map','探索'],['party','party','編成'],['inventory','bag','所持品']].map(x=>navButton(...x,'bottom-item')).join('')}<button class="${['records','settings'].includes(view.page)?'active':''}" data-action="more">${icon('more')}<span>その他</span></button></nav>`;
}
function rightRail(){const d=state.run&&DUNGEONS.find(d=>d.id===state.run.dungeonId);return `<aside class="right-rail"><section><div class="rail-title">出撃メンバー <span class="gold">${activeHeroes().length} / 5</span></div>${activeHeroes().map(h=>`<div class="rail-hero">${portrait(h)}<div class="grow"><div class="spread"><div class="name">${h.name}</div><span class="tiny muted">${h.row==='front'?'前列':'後列'}</span></div><div class="sub">${esc(h.style)}</div><div class="progress"><i style="width:${h.hp/derived(h).hp*100}%"></i></div></div></div>`).join('')}<button class="textbtn small" data-action="nav" data-page="party">編成を確認する →</button></section><section><div class="rail-title">EXPLORATION NOTES</div><div class="rail-foot">${state.run?`${d.name}<br>第${state.run.floor+1}層 · ${THEMES[state.run.floors[state.run.floor].theme].name}<br>通過地点 ${state.run.visited.length} ／ 戦利品 ${state.run.rewards.items} 点`:'出発の前に、依頼を確認。<br>予備武器と携行具も忘れずに。'}</div><div class="divider"></div><div class="rail-foot">${Object.values(state.quests).filter(q=>q.status==='active').length} 件の依頼を受注中</div><p class="rail-quote">「迷宮は変わる。<br>帰る場所は、変わらない。」</p></section></aside>`;}
function heading(eyebrow,title,desc='',action=''){return `<div class="screen-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div>${action}</div>`;}
function tabs(list,current){return `<div class="tabs">${list.map(([id,n])=>`<button class="tab ${current===id?'active':''}" data-action="tab" data-tab="${id}">${n}</button>`).join('')}</div>`;}
function render(){
const pages={town:townPage,tavern:tavernPage,guild:guildPage,market:marketPage,gate:gatePage,party:partyPage,equipment:equipmentPage,skills:skillsPage,mastery:masteryPage,character:characterPage,inventory:inventoryPage,records:recordsPage,settings:settingsPage,map:mapPage,encounter:encounterPage};
document.body.className=[state.settings.motion?'motion-on':'',state.settings.font==='large'?'font-large':'',state.settings.contrast?'high-contrast':''].join(' ');
const html=(pages[view.page]||townPage)();$('#app').innerHTML=layout(html);if(modalState)renderModal();
}
function townPage(){const activeQ=QUESTS.filter(q=>state.quests[q.id]?.status==='active');return `${heading('THE CITY BETWEEN JOURNEYS','街・拠点','次の一歩は、この街から。')}<section class="hero"><div class="hero-art">${landscape()}</div><div class="hero-shade"></div><div class="hero-copy"><div class="eyebrow">THE LANTERN CITY</div><h1>灯都 アウレル</h1><p>遠征者の足音と、食卓の灯。<br>変わりゆく迷宮のほとりに、<br>変わらない居場所がある。</p><span class="tag">${icon('sun')} ${state.run?'遠征中 · 帰還まで施設は利用不可':'探索の準備ができています'}</span></div></section><div class="section-label"><h2>街を歩く</h2><span>CHOOSE A PLACE</span></div><div class="place-grid">${[['tavern','inn','THE WAYFARER','宿・酒場','会話 ／ 噂'],['guild','guild','ADVENTURERS’ GUILD','ギルド','依頼 ／ 情報 ／ 査定'],['market','market','THE OLD MARKET','市場','武器 ／ 防具 ／ 道具 ／ 加工'],['gate','gate','BEYOND THE GATE','ダンジョン','行き先選択 ／ パーティ']].map(([p,i,en,n,d])=>`<button class="place" data-action="place" data-page="${p}">${building(i)}<div class="place-copy"><div class="eyebrow">${en}</div><h3>${n}</h3><div class="small">${d}</div></div><span class="arrow">↗</span></button>`).join('')}</div>${state.run?`<div class="brief-strip">${icon('map')}<div><p>遠征は途中です</p><span class="tiny muted">街の施設を使うには帰還してください。</span></div><button class="textbtn" data-action="nav" data-page="map">探索に戻る →</button></div>`:`<div class="brief-strip">${icon('guild')}<div><p>${activeQ.length?activeQ[0].name:'ギルドに新しい依頼が届いています'}</p><span class="tiny muted">${activeQ.length?'受注中 '+activeQ.length+' 件 · 出発前に進行を確認':'調査と探索の記録が、次の旅につながる。'}</span></div><button class="textbtn" data-action="place" data-page="guild">確認 →</button></div>`}${state.reports.length?`<div class="section-label"><h2>前回の遠征</h2><span>LAST EXPEDITION</span></div><div class="panel slim"><div class="spread"><div><p class="small">${esc(state.reports[0].title)}</p><p class="tiny muted mt" style="margin-top:5px">${esc(state.reports[0].summary)}</p></div><button class="iconbtn" aria-label="探索記録を見る" data-action="nav" data-page="records" data-tab="journeys">${icon('chevron')}</button></div></div>`:''}`;}
function placeHeader(type,title,en,copy){return `<section class="hero place-banner mb"><div class="hero-art">${landscape(type==='inn'?'town':type)}</div><div class="hero-shade"></div><div class="hero-copy"><div class="eyebrow">${en}</div><h1>${title}</h1><p>${copy}</p></div></section>`;}
function tavernPage(){const t=view.tab||'talk';return `${heading('THE WAYFARER','宿・酒場','会いたい人の席へ。会話はいつでも任意です。')}${tabs([['talk','会話'],['rumors','噂'],['return','遠征の食卓']],t)}${t==='rumors'?`<div class="stack">${RUMORS.map(r=>`<div class="dialogue"><div class="spread"><span class="speaker">${r.speaker}</span><span class="tag">未確認の噂</span></div><p>${r.text}</p>${state.rumors.includes(r.id)?`<div class="note">手帳に書き留めた：${r.hint}</div>`:`<button class="btn ghost full" data-action="rumor" data-id="${r.id}">続きを聞く →</button>`}</div>`).join('')}</div>`:t==='return'?returnDialogue():`<div class="dialogue mb"><span class="speaker">酒場の女主人 · ネリ</span><p>「椅子なら空いているよ。<br>出かける前でも、帰ってきた後でもね。」</p><span class="tiny muted">帰還時に全員のHP・SP・MPと状態異常を自動回復。</span></div><div class="hero-grid">${state.heroes.map(h=>`<div class="hero-card"><div class="row">${portrait(h)}<div><h3>${h.name}</h3><p class="style">${esc(h.style)}</p></div></div><button class="textbtn small" data-action="talk" data-id="${h.id}">同じテーブルにつく →</button></div>`).join('')}</div>`}`;}
function returnDialogue(){const r=state.reports[0];return r?`<div class="dialogue"><span class="speaker">ユナ</span><p>「お帰りなさい。温かいうちに、食べましょう。<br>${r.cleared?'最奥まで辿り着けたのですね。':'無事に戻れたことが、いちばん大切です。'}」</p><div class="divider"></div><div class="speaker">ミレア</div><p>「今回の記録を、まとめておきました。」</p><div class="note">${esc(r.summary)}<br>通過地点 ${r.nodes} ／ 戦闘勝利 ${r.battles} ／ 獲得金 ${r.gold} G<br>全員のHP・SP・MP、状態異常は回復済みです。</div><button class="btn ghost mt" data-action="nav" data-page="records" data-tab="journeys">探索記録を読む</button></div>`:`<div class="dialogue"><span class="speaker">酒場の女主人 · ネリ</span><p>「帰ってきたら、旅の話を聞かせておくれ。<br>最初の食事は、温かいものにしようね。」</p></div>`;}
function questProgress(q){const rec=state.quests[q.id];if(!rec)return 0;if(rec.status==='done')return q.target;if(q.metric==='relicShard')return Math.min(q.target,state.bag.relicShard||0);return Math.min(q.target,Math.max(0,state.stats[q.metric]-(rec.start||0)));}
function guildPage(){const t=view.tab||'quests';return `${heading('ADVENTURERS’ GUILD','ギルド','確かな情報も、まだ名のない発見も。')}${tabs([['quests','依頼'],['info','情報'],['appraise','査定']],t)}${t==='quests'?`<div class="stack">${QUESTS.map(q=>{const rec=state.quests[q.id],p=questProgress(q),done=rec?.status==='done';return `<article class="quest-card"><div class="spread"><span class="eyebrow">GUILD REQUEST</span><span class="tag ${done?'green':rec?'gold':''}">${done?'報酬受領済':rec?'受注中':q.type+'依頼'}</span></div><h3>${q.name}</h3><p>${q.desc}</p>${rec?`<div class="progress"><i style="width:${p/q.target*100}%"></i></div><div class="tiny muted">進行 ${p} / ${q.target}</div>`:''}<div class="rewards">${fmt(q.gold)} G ＋ 全員に Mastery Pt ${q.mp}</div><button class="btn ${!rec?'primary':'ghost'} full" data-action="quest" data-id="${q.id}" ${done||(rec&&p<q.target)?'disabled':''}>${done?'報酬は受領済み':!rec?'依頼を受ける':p>=q.target?'達成報告・報酬を受け取る':'探索を進めてください'}</button></article>`;}).join('')}</div>`:t==='info'?guildInfo():appraisalPage()}`;}
function guildInfo(){return `<div class="note mb">層のテーマは挑戦ごとに変化します。以下は候補と既知の報告です。現地の地形は戦闘地点ごとに異なります。</div><div class="stack">${DUNGEONS.map(d=>`<section class="panel"><div class="eyebrow">FIELD REPORT</div><h3 style="margin:6px 0 12px">${d.name}</h3>${d.pool.map(k=>{const th=THEMES[k];return `<div class="list-item"><div class="spread"><b class="small">${th.name}</b><span class="tiny muted">${th.enemies.map(e=>ENEMIES[e][1]).join('・')}</span></div><p class="tiny muted" style="margin-top:8px">${th.impact}</p></div>`;}).join('')}<button class="btn ghost full mt" data-action="read-report" data-id="${d.id}">探索報告を記録する</button></section>`).join('')}</div>`;}
function appraisalPage(){return `<div class="note mb">鑑定は1点30 G。鑑定後に引取・保管を選べます。保管品は売却できません。</div>${state.relics.length?state.relics.map(r=>`<div class="panel mb"><div class="row">${icon(r.identified?'explore':'event')}<div class="grow"><h3 style="font-size:16px">${esc(r.name)}</h3><div class="tiny muted">${r.stored?'ギルド保管中':r.identified?'鑑定済 · 引取額 '+r.value+' G':'未鑑定の戦利品'}</div></div></div><div class="row mt wrap">${!r.identified?`<button class="btn primary" data-action="appraise" data-id="${r.uid}">鑑定 · 30 G</button>`:`<button class="btn ghost" data-action="relic-store" data-id="${r.uid}">${r.stored?'手元に戻す':'ギルドへ保管'}</button><button class="btn" data-action="relic-sell" data-id="${r.uid}" ${r.stored?'disabled':''}>引取 · ${r.value} G</button>`}</div></div>`).join(''):'<div class="empty">未鑑定の戦利品はありません。</div>'}`;}
function marketPage(){const t=view.tab||'weapons';return `${heading('THE OLD MARKET','市場','次の探索に備える。')}${tabs([['weapons','武器'],['armor','防具'],['tools','道具'],['forge','加工']],t)}${t==='forge'?forgePage(false):shopList(t,false)}`;}
function shopList(t,travel){const list=Object.values(ITEMS).filter(b=>t==='travel'?['weapon','shield','armor','carry','consumable'].includes(b.type):t==='weapons'?['weapon','shield'].includes(b.type):t==='armor'?['armor','accessory'].includes(b.type):['carry','consumable','material'].includes(b.type));return `<div class="shop-grid">${list.filter(b=>!travel||['sword','dagger','spear','buckler','軽装body','魔装body','重装body','potion','ether','antidote','needles','herbkit'].includes(b.id)).map(b=>`<article class="shop-card"><div class="row gap8"><div class="shop-icon">${icon(b.type==='weapon'?'sword':b.type==='shield'||b.type==='armor'?'shield':b.type==='consumable'?'water':'bag')}</div><h3>${b.name}</h3></div><p>${itemDescription(b)}<br>${b.req&&Object.keys(b.req).length?Object.entries(b.req).map(([k,v])=>k+v).join('・')+' 以上':'装備要求なし'}${b.weight!=null?' ／ 重量 '+b.weight:''}</p><div class="spread"><span class="gold small">${fmt(b.price)} <small>G</small></span><button class="btn sm" data-action="buy" data-id="${b.id}" ${state.gold<b.price?'disabled':''}>購入</button></div></article>`).join('')}</div>`;}
function itemDescription(b){return b.type==='weapon'?`${b.mastery} ／ ${b.hands===2?'両手':'片手'} ／ ${b.attr}・${b.range}距離<br>武器威力 ${b.power}`:b.type==='shield'?`${b.mastery} ／ 片手 ／ ${b.attr}・${b.range}距離`:b.type==='armor'?`${b.category} ／ ${SLOTS.find(s=>s[0]===b.slot)[1]}用`:b.desc||'';}
function forgePage(travel){return `<div class="note mb">装備中・所持中の品を選んで加工。強化・特性・耐久値は戦闘への受け渡しデータにも含まれます。</div><div class="stack">${state.gear.filter(g=>['weapon','shield','armor'].includes(ITEMS[g.baseId].type)).map(g=>{const b=ITEMS[g.baseId],owner=gearOwner(g.uid);return `<div class="panel slim"><div class="spread"><div><b class="small">${equippedName(g.uid)}</b><div class="tiny muted">${owner?owner.name+'が装備中':'所持品'} ／ 耐久 ${g.durability}%${g.trait?' ／ '+g.trait:''}</div></div>${icon(b.type==='armor'?'shield':'sword')}</div><div class="row wrap gap8 mt" style="margin-top:12px"><button class="btn sm ghost" data-action="repair" data-id="${g.uid}" ${g.durability===100?'disabled':''}>修理 ${Math.ceil((100-g.durability)*.8)} G</button><button class="btn sm" data-action="upgrade" data-id="${g.uid}" ${g.plus>=5?'disabled':''}>${g.plus>=5?'強化上限':'強化 '+(60*(g.plus+1))+' G / 鉄片2'}</button><button class="btn sm ghost" data-action="trait" data-id="${g.uid}">特性加工</button></div></div>`;}).join('')}</div>`;}
function gatePage(){if(state.run)return mapPage();const t=view.tab||'destination';return `${heading('BEYOND THE GATE','ダンジョン','行き先と、共に行く仲間を選ぶ。')}${tabs([['destination','行き先選択'],['party','パーティ']],t)}${t==='party'?partyContent(true):DUNGEONS.map(d=>{const locked=state.stats.clears<d.unlock;return `<article class="dungeon-card ${locked?'locked':''}"><div class="dungeon-seal" style="color:${THEMES[d.theme].color}">${building('gate')}</div><div><div class="eyebrow">${d.subtitle}</div><h3>${d.name}</h3><div class="tiny muted">${d.region} ／ 全3層</div><p style="margin-top:11px">${d.desc}</p><div class="theme-dots">${d.pool.map(k=>`<span class="tag">${THEMES[k].name}</span>`).join('')}</div><div class="spread"><span class="tiny muted">${locked?'いずれかのダンジョンを1回踏破で解放':d.difficulty}</span><button class="btn ${locked?'ghost':'primary'}" data-action="departure" data-id="${d.id}" ${locked?'disabled':''}>${locked?'未解放':`出発準備 ${icon('chevron')}`}</button></div></div></article>`;}).join('')}`;}
function partyPage(){return heading('YOUR COMPANY','編成','登録6人から、出撃する5人を選択。')+partyContent(false);}
function miniStats(h){const d=derived(h);return `<div class="mini-stats">${[['HP',h.hp,d.hp],['SP',h.sp,d.sp],['MP',h.mp,d.mp]].map(([n,v,m])=>`<div>${n} <b>${v}</b> / ${m}<div class="progress" style="margin-top:5px"><i style="width:${m?v/m*100:0}%"></i></div></div>`).join('')}</div>`;}
function partyContent(inGate){return `<div class="panel slim mb"><div class="spread"><div><span class="gold">出撃 ${activeHeroes().length} / 5</span><span class="small muted">　控え ${6-activeHeroes().length}人</span></div><span class="tag">前列 ${activeHeroes().filter(h=>h.row==='front').length} ／ 後列 ${activeHeroes().filter(h=>h.row==='back').length}</span></div><p class="tiny muted" style="margin-top:9px">${state.run?'遠征中は控えとの入替不可。列・装備は調整できます。':'出撃枠を外して控えを入れるか、「控えと交代」で入れ替えます。'}</p></div><div class="hero-grid">${state.heroes.map(h=>`<article class="hero-card ${h.active?'':'reserve'}"><div class="row">${portrait(h)}<div class="grow"><div class="spread"><h3>${h.name}</h3><span class="tag ${h.active?'gold':''}">${h.active?(h.row==='front'?'前列':'後列'):'控え'}</span></div><p class="style">${esc(h.style)}</p><div class="tiny muted">${equippedName(h.equip.main)}</div></div></div>${miniStats(h)}<div class="actions"><button class="btn ghost sm" data-action="hero-page" data-id="${h.id}" data-page="equipment">装備</button><button class="btn ghost sm" data-action="hero-page" data-id="${h.id}" data-page="character">詳細</button><button class="btn ghost sm" data-action="row" data-id="${h.id}" ${state.pendingBattle?'disabled':''}>${h.row==='front'?'後列へ':'前列へ'}</button></div><div class="actions">${h.active?`<button class="btn sm" data-action="swap-hero" data-id="${h.id}" ${state.run?'disabled':''}>控えと交代</button>`:''}<button class="btn ghost sm" data-action="active" data-id="${h.id}" ${state.run?'disabled':''}>${h.active?'出撃から外す':'出撃に加える'}</button></div></article>`).join('')}</div>${inGate?`<button class="btn primary full mt" data-action="tab" data-tab="destination">行き先を選ぶ →</button>`:''}`;}
function heroSelector(){return `<div class="character-switch">${state.heroes.map(h=>`<button class="char-chip ${h.id===view.hero?'active':''}" data-action="select-hero" data-id="${h.id}"><span class="dot-avatar" style="--accent:${h.accent}">${h.mark}</span>${h.name}</button>`).join('')}</div>`;}
function equipmentPage(){const h=currentHero(),w=weight(h),pen=weightPenalty(h);return `${heading('EQUIPMENT','装備','主武器と予備セット。換装は自分の判断で。',state.run?.encounterNode?'<button class="btn sm" data-action="nav" data-page="encounter">遭遇へ戻る</button>':'')}${heroSelector()}<div class="weight-block ${pen.over?'over':''}"><div class="spread"><span class="small">使用中の装備重量</span><b class="num ${pen.over?'bad':'gold'}">${w} / ${h.stats.PHY}</b></div><div class="progress"><i style="width:${Math.min(100,w/h.stats.PHY*100)}%"></i></div><div class="tiny muted">${pen.over?`重量超過 ${pen.over}：速度・回避 −${pen.speedPenaltyPercent}% ／ 武器性能 −${pen.weaponPowerPenaltyPercent}%（試算）`:'重量制限内です。装備要求と重量は別判定です。'}</div></div><div class="spread wrap mb"><span class="tiny muted">${h.name} · ${h.row==='front'?'前列':'後列'} / 防具 ${armorCategory(h)||'未装備'}</span><div class="row gap8"><button class="btn sm ghost" data-action="armor-set" data-id="${h.id}">防具一式</button><button class="btn sm" data-action="swap-weapons" data-id="${h.id}" ${state.pendingBattle||h.status.includes('腕封じ')?'disabled':''}>${icon('swap')} 換装</button></div></div><div class="equip-grid">${SLOTS.map(([slot,n])=>{const id=h.equip[slot],g=gearBy(id),b=g&&ITEMS[g.baseId];return `<button class="equip-slot" data-action="equip-slot" data-id="${h.id}" data-slot="${slot}" ${state.pendingBattle?'disabled':''}><span class="slot-label">${n}</span><span class="item-name">${icon(b?.type==='armor'||b?.type==='shield'?'shield':b?.type==='weapon'?'sword':'bag')}${equippedName(id)}</span><small>${b?`重量 ${itemWeight(g)}${b.attr?' ／ '+b.attr:''}${b.range?'・'+b.range:''}${g.trait?' ／ '+g.trait:''}`:'タップして装備を選ぶ'}</small></button>`;}).join('')}</div><div class="note mt">頭・胴・手・足は同じ防具カテゴリーに統一。副手を埋めたまま両手武器は装備できません。<br>重量試算は使用中の武器＋防具・装飾品・携行具。予備セットを重量に含めない扱いと、超過時の減算率はデモ用の仮値です。</div>`;}
function armorCategory(h){return ARMOR_SLOTS.map(s=>baseBy(h.equip[s])?.category).find(Boolean);}
function canEditSkills(){return !state.pendingBattle&&(!state.run||state.run.restNode);}

s="row wrap gap8 mt">${ATTRS.map(a=>`<span class="tag">${a}</span>`).join('')}</div><p class="tiny muted mt">無属性は基本的に弱点・耐性なし。</p><div class="divider"></div><h3>状態異常・封じ</h3>${Object.entries(STATUS_DEFS).map(([n,d])=>`<div class="kv"><b>${n}</b><span style="max-width:65%;text-align:right">${d}</span></div>`).join('')}<div class="divider"></div><h3>マップの階層</h3><p class="small muted mt">ダンジョン名・物語は固定 → 3層のテーマは挑戦ごとに変化 → 地形・敵編成は戦闘ノードごとに変化。</p></div>`}`;}
function settingsPage(){return `${heading('PREFERENCES','設定','読みやすさと、戦闘デモへの接続。')}<div class="stack"><section class="panel"><h3>表示・操作</h3><div class="list-item spread"><label for="setting-motion" class="small">画面の動きを表示</label><input id="setting-motion" type="checkbox" data-setting="motion" ${state.settings.motion?'checked':''}></div><div class="list-item spread"><label for="setting-contrast" class="small">文字のコントラストを上げる</label><input id="setting-contrast" type="checkbox" data-setting="contrast" ${state.settings.contrast?'checked':''}></div><div class="list-item spread"><label for="setting-font" class="small">文字サイズ</label><select id="setting-font" data-setting="font"><option value="standard" ${state.settings.font==='standard'?'selected':''}>標準</option><option value="large" ${state.settings.font==='large'?'selected':''}>大きめ</option></select></div></section><section class="panel"><h3>戦闘デモへの接続</h3><p class="small muted mt">戦闘エンジンは含まれていません。対応する受取処理を追加した別のHTMLと接続できます。</p><label class="field mt">接続先URL（同じサイト内）<input id="battle-url" placeholder="例：./battle/index.html" value="${esc(state.settings.battleUrl)}"></label><button class="btn mt" data-action="save-battle-url">接続先を保存</button><p class="tiny muted mt">未設定の場合は、遭遇画面からJSONを取得できます。既存の戦闘デモにURLを指定するだけでは、データは反映されません。</p><div class="list-item spread"><label for="setting-demoTools" class="small">探索検証用の結果入力を表示</label><input id="setting-demoTools" type="checkbox" data-setting="demoTools" ${state.settings.demoTools?'checked':''}></div></section><section class="panel"><h3>セーブデータ</h3><p class="small muted mt">このブラウザに自動保存。別端末へ移す際は書き出したJSONを読み込んでください。</p><div class="row wrap mt"><button class="btn ghost" data-action="save-export">${icon('download')} 書き出す</button><button class="btn ghost" data-action="save-import">${icon('upload')} 読み込む</button></div><div class="divider"></div><button class="btn danger" data-action="reset-prompt">最初からやり直す</button></section><div class="note">金額・成長Pt・装備要求・スキルCost・地形倍率・隠しルート条件などの未確定数値は、触って検証するための仮設定です。セーブは const NODE_TYPES={battle:['通常戦','sword'],elite:['強敵','elite'],event:['イベント','event'],camp:['野営','camp'],merchant:['商人','market'],explore:['探索','explore'],forge:['鍛冶','forge'],boss:['ボス','boss']};
function rng(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};}
function generateRun(d){const seed=Math.floor(Math.random()*4294967295),rand=rng(seed),pick=a=>a[Math.floor(rand()*a.length)];let themes=[...d.pool];for(let i=themes.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[themes[i],themes[j]]=[themes[j],themes[i]];}themes=themes.slice(0,3);if(JSON.stringify(state.lastThemes[d.id])===JSON.stringify(themes)){[themes[0],themes[1]]=[themes[1],themes[0]];}state.lastThemes[d.id]=themes;
const floors=themes.map((theme,fi)=>{const th=THEMES[theme],nodes=[],rows=[['explore','event','battle'],['battle','battle','elite'],['camp','merchant','forge'],['event','explore','elite'],['battle','battle'],['boss']];rows.forEach((types,row)=>{types.forEach((type,col)=>{const x=types.length===3?[18,50,82][col]:types.length===2?[29,71][col]:50,id=`f${fi}-r${row}-c${col}`;const n={id,type,row,col,x,y:45+row*105,terrain:pick(th.terrains),event:pick(['well','scholar','traveler']),seed:Math.floor(rand()*1e6),enemies:[],links:[]};if(['battle','elite','boss'].includes(type)){const count=type==='boss'?3:type==='elite'?3:2+fi%2;for(let i=0;i<count;i++){const e=type==='boss'&&i===0?'warden':pick(th.enemies);const template=ENEMIES[e];n.enemies.push({id:`${id}-e${i}`,templateId:e,name:template[0],type:template[1],row:i===0||i===1&&count>2?'front':'back',slot:i,hp:(e==='warden'?90:25)+fi*15+(type==='elite'?20:0),weaknesses:template[2]?[template[2]]:[],resistances:template[3]?[template[3]]:[]});}}nodes.push(n);});});nodes.forEach(n=>{const next=nodes.filter(x=>x.row===n.row+1);n.links=next.filter(x=>Math.abs(n.x-x.x)<=40).map(x=>x.id);if(next.length&&!n.links.length)n.links=[next.sort((a,b)=>Math.abs(a.x-n.x)-Math.abs(b.x-n.x))[0].id];});return {theme,nodes,cleared:false};});
return {id:uid(),seed,dungeonId:d.id,floor:0,floors,cursor:null,visited:[],available:floors[0].nodes.filter(n=>n.row===0).map(n=>n.id),encounterNode:null,pendingActivity:null,restNode:null,campUsed:[],rewards:{gold:0,items:0,mastery:0,stat:0},battleWins:0,started:new Date().toISOString(),participants:activeHeroes().map(h=>h.id)};}

function nodeAccessible(id){return !!state.run&&!state.pendingBattle&&!state.run.pendingActivity&&state.run.available.includes(id);}
function mapPage(){if(!state.run)return gatePage();const run=state.run,d=DUNGEONS.find(d=>d.id===run.dungeonId),f=floorData(),th=THEMES[f.theme];return `${heading(d.subtitle,d.name,`第${run.floor+1}層 · ${th.label}`,`<button class="btn ghost sm" data-action="retreat-prompt" ${state.pendingBattle?'disabled':''}>帰還</button>`)}<section class="hero place-banner"><div class="hero-art">${landscape(f.theme)}</div><div class="hero-shade"></div><div class="hero-copy"><div class="eyebrow">LAYER 0${run.floor+1} / 03</div><h1>${th.name}</h1><p>${th.desc}</p></div></section><div class="floor-tabs">${run.floors.map((fl,i)=>`<div class="floor-step ${i===run.floor?'active':''}"><div class="eyebrow">${fl.cleared?'CLEARED':'LAYER 0'+(i+1)}</div><p>${THEMES[fl.theme].name}</p></div>`).join('')}</div>${state.pendingBattle?`<div class="bridge-box mb"><p class="small">戦闘結果の受け取り待ちです。</p><button class="btn full mt" data-action="nav" data-page="encounter">遭遇画面に戻る →</button></div>`:run.encounterNode?`<div class="brief-strip mb">${icon('sword')}<p>遭遇を確認中です。</p><button class="textbtn" data-action="nav" data-page="encounter">準備に戻る →</button></div>`:run.pendingActivity?`<div class="brief-strip mb">${icon(NODE_TYPES[nodeBy(run.pendingActivity).type][1])}<p>この地点での行動を選んでください。</p><button class="textbtn" data-action="activity" data-id="${run.pendingActivity}">開く →</button></div>`:run.restNode?`<div class="brief-strip mb">${icon('camp')}<div><p>野営地点に滞在中</p><span class="tiny muted">部分回復・装備調整・スキル変更が可能</span></div><button class="textbtn" data-action="activity" data-id="${run.restNode}">休む →</button></div>`:['merchant','forge'].includes(nodeBy(run.cursor)?.type)?`<div class="brief-strip mb">${icon(NODE_TYPES[nodeBy(run.cursor).type][1])}<p>${NODE_TYPES[nodeBy(run.cursor).type][0]}の地点に滞在中</p><button class="textbtn" data-action="activity" data-id="${run.cursor}">利用する →</button></div>`:''}<div class="section-label"><h2>道を選ぶ</h2><span>金色の地点に進めます</span></div><div class="map-frame"><div class="map-inner"><svg class="map-lines" viewBox="0 0 100 635" preserveAspectRatio="none" aria-hidden="true">${f.nodes.flatMap(n=>n.links.map(id=>{const b=nodeBy(id),visited=run.visited.includes(n.id)&&run.visited.includes(id),hidden=b.row-n.row>1;return `<path d="M${n.x} ${n.y} C${n.x} ${n.y+50},${b.x} ${b.y-50},${b.x} ${b.y}" fill="none" stroke="${visited?'#a9bb92':'#718269'}" stroke-opacity="${visited?'.8':'.3'}" stroke-width="${visited?'.65':'.45'}" ${hidden?'stroke-dasharray="1 5"':''}/>`;})).join('')}</svg>${f.nodes.map(n=>{const visited=run.visited.includes(n.id),available=nodeAccessible(n.id),label=NODE_TYPES[n.type];return `<button class="node ${n.type} ${visited?'visited':available?'available':'locked'}" style="left:${n.x}%;top:${n.y}px" data-action="node-preview" data-id="${n.id}" aria-label="${label[0]} ${visited?'通過済み':available?'移動可能':'未到達'}"><span class="node-circle">${icon(visited?'check':label[1])}</span><span class="node-title">${n.type==='battle'||n.type==='elite'?TERRAINS[n.terrain].name:label[0]}</span></button>`;}).join('')}</div><div class="map-legend"><span>${icon('sword')} 戦闘</span><span>${icon('event')} 交流</span><span>${icon('explore')} 探索</span><span>${icon('camp')} 休息</span><span>${icon('boss')} 最奥</span></div></div><div class="note mt">${th.impact}<br>敵と地形を確認してから準備できます。自動換装は行いません。</div><div class="row gap8 mt"><button class="btn ghost full" data-action="nav" data-page="party">${icon('party')} 編成</button><button class="btn ghost full" data-action="nav" data-page="equipment">${icon('sword')} 装備</button></div>`;}
function enemyIcon(type){return ['獣','毒獣','海獣'].includes(type)?'wolf':type==='飛行'?'fly':['重装','ゴーレム','機械'].includes(type)?'shield':['魔術師','呪術師','神官','精霊','死霊','亡者'].includes(type)?'star':type==='弓'?'bow':type==='植物'?'leaf':'sword';}
function enemyCards(n){return `<div class="enemy-grid">${n.enemies.map(e=>{const known=state.knownEnemies.includes(e.templateId);return `<article class="enemy-card"><div class="enemy-glyph">${icon(enemyIcon(e.type))}</div><h3>${e.name}</h3><span class="tag">${e.row==='front'?'前列':'後列'} · ${e.type}</span><div class="tiny ${known?'good':'muted'}" style="margin-top:11px">弱点 ${known?(e.weaknesses.join('・')||'なし'):'未確認'}</div><div class="tiny muted">耐性 ${known?(e.resistances.join('・')||'なし'):'未確認'}</div></article>`;}).join('')}</div>`;}
function encounterPage(){const run=state.run,n=run&&nodeBy(run.encounterNode);if(!n)return mapPage();const th=THEMES[floorData().theme],ter=TERRAINS[n.terrain];return `<div class="encounter-top"><div class="eyebrow">${n.type==='boss'?'THE GUARDIAN':n.type==='elite'?'A DANGEROUS PRESENCE':'ENCOUNTER'}</div><h1>${n.type==='boss'?'境界の守護者':n.type==='elite'?'強敵の気配':'行く手を阻むもの'}</h1><p>第${run.floor+1}層 · ${th.name} ／ ${NODE_TYPES[n.type][0]}</p></div><div class="terrain-block"><div class="row">${icon(n.terrain==='water'?'water':n.terrain==='high'?'mountain':'map')}<div><b class="small">${ter.name}</b><p class="tiny muted">${ter.desc}</p></div></div></div>${enemyCards(n)}<div class="section-label"><h2>出撃する5人</h2><button class="textbtn small" data-action="nav" data-page="equipment" ${state.pendingBattle?'disabled':''}>装備・換装 →</button></div><div class="panel slim">${activeHeroes().map(h=>`<div class="spread list-item" style="padding:10px 0"><div class="row gap8"><span class="dot-avatar" style="--accent:${h.accent}">${h.mark}</span><div><div class="small">${h.name} <span class="tiny muted">${h.row==='front'?'前列':'後列'}</span></div><div class="tiny muted">${equippedName(h.equip.main)}</div></div></div><div class="tiny muted num">HP ${h.hp} / ${derived(h).hp}</div></div>`).join('')}</div><div class="note mt">ここが戦闘デモとの接続点です。戦闘そのものはこのHTMLでは実行しません。編成・装備・スキル・地形・敵編成をまとめて受け渡します。</div>${state.pendingBattle?`<div class="bridge-box mt"><div class="spread"><b class="small">戦闘結果を待機中</b><span class="tag">データ固定済み</span></div><p class="tiny muted mt">Request ID</p><code>${state.pendingBattle.payload.requestId}</code><div class="row wrap gap8 mt"><button class="btn ghost" data-action="encounter-export">${icon('download')} JSON</button><button class="btn ghost" data-action="result-import">結果JSONを読込</button><button class="btn ghost" data-action="cancel-battle">準備に戻す</button></div>${state.settings.battleUrl?`<button class="btn primary full mt" data-action="battle-open">接続先を開く →</button>`:''}</div>`:`<button class="btn primary full mt" data-action="prepare-battle">${icon('sword')} 戦闘データを準備する</button><button class="btn ghost full mt" style="margin-top:10px" data-action="encounter-back">別の道を検討する</button>`}${state.settings.demoTools?`<details class="dev-tools"><summary>探索検証用：戦闘結果を代入する</summary><p>実際の戦闘はしません。結果だけを代入し、3層の探索・報酬・帰還まで確認できます。勝利代入時はHP等を少量減らします。</p><div class="row wrap gap8"><button class="btn sm ghost" data-action="demo-result" data-outcome="victory">勝利として続ける</button><button class="btn sm ghost" data-action="demo-result" data-outcome="escape">逃走として戻る</button><button class="btn sm ghost" data-action="demo-result" data-outcome="defeat">敗走として帰還</button></div></details>`:''}`;}
function previewNode(id){const n=nodeBy(id);if(!n)return;const can=nodeAccessible(id),visited=state.run.visited.includes(id),t=NODE_TYPES[n.type],battle=['battle','elite','boss'].includes(n.type);setModal(t[0],`${battle?`<div class="terrain-block"><b class="small">地形：${TERRAINS[n.terrain].name}</b><p class="tiny muted">${TERRAINS[n.terrain].desc}</p></div>${enemyCards(n)}`:`<div class="dialogue"><span class="speaker">${THEMES[floorData().theme].label}</span><p>${{event:'道の向こうに、人の気配がある。<br>声をかけてみようか。',camp:'風を避けられる、小さな空間。<br>火を囲んでひと休みできそうだ。',merchant:'古びた天幕のそばで、行商人が手を振っている。',forge:'携帯炉が赤く灯っている。<br>流浪の鍛冶師がこちらを見上げた。',explore:'苔と砂に埋もれた古い印。<br>足を止めて調べる価値はありそうだ。'}[n.type]}</p></div>`}<div class="note mt">${visited?'この地点は通過済みです。':can?(battle?'まず接近し、装備を確認してから戦闘に移ります。':n.type==='camp'?'部分回復・スキルセット変更・装備調整が可能。':n.type==='explore'?'素材・遺物・隠しルートの手がかり。':'この道に進むと、同じ分岐の別地点には戻れません。'):'現在地から進める、金色の地点を選んでください。'}</div>`,can?`<button class="btn ghost" data-action="close">やめる</button><button class="btn primary" data-action="enter-node" data-id="${id}">${battle?'接近して準備する':'この道へ進む'}</button>`:`<button class="btn ghost" data-action="close">閉じる</button>`);}
function enterNode(id){if(!nodeAccessible(id))return fail('この地点には今は進めません。');const n=nodeBy(id);state.run.restNode=null;if(['battle','elite','boss'].includes(n.type)){state.run.encounterNode=id;persist();go('encounter');return;}visitNode(n);if(['event','explore'].includes(n.type))state.run.pendingActivity=id;if(n.type==='camp')state.run.restNode=id;persist();closeModal();render();activityModal(id);}
function visitNode(n){if(state.run.visited.includes(n.id))return;state.run.visited.push(n.id);state.run.cursor=n.id;state.run.available=[...n.links];log(`第${state.run.floor+1}層・${THEMES[floorData().theme].name}：${NODE_TYPES[n.type][0]}に到達。`);}
function activityModal(id){const n=nodeBy(id);if(!n||!state.run.visited.includes(id))return;if(['event','explore'].includes(n.type)&&state.run.pendingActivity!==id)return fail('この地点の調査は完了しています。');if(n.type==='camp'){const used=state.run.campUsed.includes(id);setModal('火を囲む時間',`<div class="dialogue"><span class="speaker">ガルド</span><p>「少し、息を整えよう。<br>先へ進む準備をするなら、今のうちだ。」</p></div><div class="note mt">野営は1地点につき1回、出撃中の全員を最大HP・SP・MPの35%回復します。戦闘不能者もHP1以上で復帰する仮仕様です。</div><button class="btn primary full mt" data-action="camp-heal" data-id="${id}" ${used?'disabled':''}>${used?'この場所での休息は済んでいます':'休息して部分回復'}</button><div class="row gap8 mt"><button class="btn ghost full" data-action="nav" data-page="skills">スキル</button><button class="btn ghost full" data-action="nav" data-page="equipment">装備</button></div>`,`<button class="btn ghost" data-action="close">マップに戻る</button>`);return;}
if(n.type==='merchant'){setModal('旅の行商人',`<div class="note mb">「かさばらない物ほど、旅では役に立つさ。」</div>${shopList('travel',true)}`,`<button class="btn ghost" data-action="close">道に戻る</button>`,'merchant',id);return;}
if(n.type==='forge'){setModal('流浪の鍛冶師',forgePage(true),`<button class="btn ghost" data-action="close">道に戻る</button>`,'forge',id);return;}
if(n.type==='explore'){const skilled=activeHeroes().some(h=>(h.masteries['探索']||0)>=3);setModal('境界標を調べる',`<div class="dialogue"><span class="speaker">${skilled?'セナ':'ミレア'}</span><p>「この印……。<br>石の裏側にも、何か刻まれている。」</p></div><div class="stack mt"><button class="btn ghost full" data-action="resolve-activity" data-id="${id}" data-choice="gather">周囲の素材を採集する</button><button class="btn ghost full" data-action="resolve-activity" data-id="${id}" data-choice="relic">埋もれた遺物を調べる</button><button class="btn ${skilled?'primary':'ghost'} full" data-action="resolve-activity" data-id="${id}" data-choice="hidden" ${skilled?'':'disabled'}>隠しルートを探す · 探索 Rank 3</button></div><p class="tiny muted mt">調査方法はひとつ。探索Rankは出撃メンバーの最大値を参照します。</p>`,`<button class="btn ghost" data-action="close">いったん閉じる</button>`);return;}
const events={well:['星を映す井戸','「水面が、風もないのに揺れている。」','水を汲む · 出撃全員のMPを10回復','井戸の縁を調べる · 魔晶片1'],scholar:['迷子の学者','「地図が役に立たなくてね。街までの道だけ、教えてくれないか。」','道を教える · お礼に100 G','探索の話を聞く · 既知弱点を記録'],traveler:['傷ついた旅人','「大丈夫……。薬さえあれば、まだ歩ける。」','治癒薬を渡す · 100 Gと情報','街への安全な道を伝える · 全員にMastery Pt 1']};const e=events[n.event];setModal(e[0],`<div class="dialogue"><span class="speaker">道の途中で</span><p>${e[1]}</p></div><div class="stack mt"><button class="btn primary full" data-action="resolve-activity" data-id="${id}" data-choice="first" ${n.event==='traveler'&&!(state.bag.potion>0)?'disabled':''}>${e[2]}</button><button class="btn ghost full" data-action="resolve-activity" data-id="${id}" data-choice="second">${e[3]}</button></div>`,`<button class="btn ghost" data-action="close">いったん閉じる</button>`);
}
function gainGold(n){state.gold+=n;if(state.run)state.run.rewards.gold+=n;}
function gainItem(id,n=1){state.bag[id]=(state.bag[id]||0)+n;if(state.run)state.run.rewards.items+=n;}
function gainMastery(n,all=false){(all?state.heroes:activeHeroes()).forEach(h=>h.masteryPts+=n);if(state.run)state.run.rewards.mastery+=n;}
function gainStat(n){activeHeroes().forEach(h=>h.statPts+=n);if(state.run)state.run.rewards.stat+=n;}
function healParty(fraction){activeHeroes().forEach(h=>{const d=derived(h);for(const key of ['hp','sp','mp'])h[key]=Math.min(d[key],h[key]+Math.max(1,Math.floor(d[key]*fraction)));});}
function addRelic(){state.relics.push({uid:uid(),name:'刻印のある遺物',identified:false,stored:false,value:220+state.run.floor*80,trueName:['忘却の星図盤','潮読みの銅鏡','王墓の黄金印'][state.run.floor]});state.run.rewards.items++;}
function resolveActivity(id,choice){const run=state.run,n=nodeBy(id);if(!run||run.pendingActivity!==id)return fail('この地点はすでに解決済みです。');let message='';if(n.type==='explore'){if(!['gather','relic','hidden'].includes(choice))return;if(choice==='hidden'){if(!activeHeroes().some(h=>(h.masteries['探索']||0)>=3))return fail('探索 Rank 3 の出撃メンバーが必要です。');const dest=floorData().nodes.find(x=>x.row===Math.min(n.row+2,5)&&x.col===1)||floorData().nodes.find(x=>x.row===Math.min(n.row+2,5));if(dest&&!n.links.includes(dest.id)){n.links.push(dest.id);run.available.push(dest.id);}gainItem('crystal',1);message='隠しルートを発見。点線の近道が開き、魔晶片を1個入手。';}else if(choice==='relic'){addRelic();gainItem('relicShard',1);message='刻印のある遺物と古代の欠片を入手。';}else{gainItem('iron',3);gainItem('herb',2);gainItem('relicShard',1);message='鉄片3・薬草2・古代の欠片1を入手。';}state.stats.explored++;}else{if(!['first','second'].includes(choice))return;const first=choice==='first';if(n.event==='well'){if(first){activeHeroes().forEach(h=>h.mp=Math.min(derived(h).mp,h.mp+10));message='井戸の水で、出撃全員のMPが10回復。';}else{gainItem('crystal',1);message='井戸の古い刻印から、魔晶片を1個採取。';}}if(n.event==='scholar'){if(first){gainGold(100);message='学者に帰り道を伝え、お礼に100 Gを受け取った。';}else{revealFloorEnemies();message='学者の探索報告から、この層に現れる敵の情報を記録。';}}if(n.event==='traveler'){if(first){if(!(state.bag.potion>0))return fail('治癒薬がありません。');state.bag.potion--;gainGold(100);revealFloorEnemies();message='治癒薬を渡し、100 Gと探索情報を受け取った。';}else{gainMastery(1);message='安全な道を伝えた。出撃全員にMastery Pt 1。';}}}
run.pendingActivity=null;log(message);persist();closeModal();render();toast(message);}
function revealFloorEnemies(){for(const id of THEMES[floorData().theme].enemies){if(!state.knownEnemies.includes(id))state.knownEnemies.push(id);}}
function fullHeal(){state.heroes.forEach(h=>{const d=derived(h);h.hp=d.hp;h.sp=d.sp;h.mp=d.mp;h.status=[];});}
function finishRun(cleared=false,reason='帰還'){const run=state.run;if(!run||state.pendingBattle)return false;const d=DUNGEONS.find(d=>d.id===run.dungeonId);if(cleared)state.stats.clears++;const summary=run.floors.map(f=>THEMES[f.theme].name).join(' → ')+'。'+(cleared?'全3層を踏破。':`第${run.floor+1}層から${reason}。`);const report={time:new Date().toISOString(),title:d.name+' — '+(cleared?'踏破':reason),summary,nodes:run.visited.length,battles:run.battleWins,gold:run.rewards.gold,cleared};state.reports.unshift(report);state.reports=state.reports.slice(0,30);log(`${d.name}から${reason}。全員を全回復。`);state.run=null;state.pendingBattle=null;fullHeal();persist();go('tavern','return');toast(cleared?'全3層踏破。アウレルへ帰還しました。':'帰還しました。全員のHP・SP・MPを全回復。');return true;}
function equipmentSnapshot(h){return Object.fromEntries(SLOTS.map(([slot])=>{const g=gearBy(h.equip[slot]);return [slot,g?{...clone(ITEMS[g.baseId]),instanceId:g.uid,enhancement:g.plus,trait:g.trait,durability:g.durability,effectiveWeight:itemWeight(g),effectivePower:ITEMS[g.baseId].power==null?null:ITEMS[g.baseId].power+g.plus*2,traitEffects:g.trait==='精密'?{accuracy:5}:g.trait==='堅牢'?{incomingDamageMultiplier:0.95}:g.trait==='軽量'?{weight:-2}:{}}:null];}));}
function buildEncounter(){const run=state.run,n=run&&nodeBy(run.encounterNode);if(!n)throw Error('遭遇がありません。');if(activeHeroes().length!==5)throw Error('出撃メンバーは5人必要です。');const d=DUNGEONS.find(d=>d.id===run.dungeonId);return {schemaVersion:'1.0.0',requestId:uid(),runId:run.id,nodeId:n.id,createdAt:new Date().toISOString(),dungeon:{id:d.id,name:d.name,floor:run.floor+1,floorCount:3,theme:{id:floorData().theme,name:THEMES[floorData().theme].name}},node:{id:n.id,type:n.type,terrain:{id:n.terrain,...clone(TERRAINS[n.terrain])}},party:activeHeroes().map((h,i)=>({id:h.id,name:h.name,style:h.style,row:h.row,slot:i,stats:clone(h.stats),derived:derived(h),resources:{hp:h.hp,sp:h.sp,mp:h.mp},status:clone(h.status),equipment:equipmentSnapshot(h),masteries:clone(h.masteries),skills:h.skillSet.map(id=>clone(SKILLS.find(s=>s.id===id))),skillCapacity:h.capacity,weight:{current:weight(h),limit:h.stats.PHY,...weightPenalty(h)}})),enemies:clone(n.enemies),inventory:clone(state.bag),rules:{partySize:5,normalAttackStat:'PHY',autoWeaponSwitch:false,reserveWeaponSets:1,armorCategoryUnified:true,weaponSwitch:{turnCost:0,countLimit:null,blockedBy:'腕封じ'},rowChange:{turnCost:1,countLimit:null},provisional:['terrain.rules','enemy HP','weight penalties','item values','skill costs and requirements','reserve set excluded from weight']},bridge:{requestStorageKey:REQUEST_KEY,resultStorageKey:RESULT_KEY,returnUrl:location.href.split('#')[0],resultEvent:'rpg:battle-result'}};}
function prepareBattle(silent=false){if(state.pendingBattle)return clone(state.pendingBattle.payload);try{const payload=buildEncounter();state.pendingBattle={payload};persist();try{localStorage.setItem(REQUEST_KEY,JSON.stringify(payload));}catch(e){}window.dispatchEvent(new CustomEvent('rpg:encounter',{detail:clone(payload)}));if(!silent){render();toast('戦闘への受け渡しデータを準備しました。');}return payload;}catch(e){fail(e.message);return null;}}
function validateBattleResult(result){const p=state.pendingBattle?.payload;if(!p)return '待機中の戦闘がありません。';if(!result||typeof result!=='object')return '結果の形式が不正です。';if(result.schemaVersion!=='1.0.0')return '結果のschemaVersionは1.0.0である必要があります。';if(result.requestId!==p.requestId)return '別の戦闘の結果です。Request IDが一致しません。';if(state.processedBattles.includes(result.requestId))return '受領済みの戦闘結果です。';if(!['victory','escape','defeat'].includes(result.outcome))return 'outcomeが不正です。';if(!Array.isArray(result.party)||result.party.length!==5)return '結果には出撃5人のpartyが必要です。';const seen=new Set();for(const r of result.party){const original=p.party.find(h=>h.id===r.id);if(!original||seen.has(r.id))return 'partyのIDが不正または重複しています。';seen.add(r.id);for(const key of ['hp','sp','mp'])if(!Number.isInteger(r[key])||r[key]<0||r[key]>original.derived[key])return `${r.id}の${key}が範囲外です。`;if(!Array.isArray(r.status)||r.status.some(s=>!Object.hasOwn(STATUS_DEFS,s)))return 'statusは既定の状態異常名の配列が必要です。';}if(result.outcome==='victory'&&!result.party.some(h=>h.hp>0))return '勝利時は生存者が必要です。';
const candidate=clone(state);for(const r of result.party){const h=candidate.heroes.find(h=>h.id===r.id),original=p.party.find(h=>h.id===r.id);if(r.row!=null&&!['front','back'].includes(r.row))return '列が不正です。';h.hp=r.hp;h.sp=r.sp;h.mp=r.mp;h.status=clone(r.status);if(r.row)h.row=r.row;
if(r.equipment!=null){if(typeof r.equipment!=='object'||Array.isArray(r.equipment)||SLOTS.some(([s])=>!Object.hasOwn(r.equipment,s)))return 'equipmentには全10枠のIDまたはnullが必要です。';const allowed=new Set(Object.values(original.equipment).filter(Boolean).map(g=>g.instanceId));for(const [slot] of SLOTS){const id=r.equipment[slot];if(id!==null&&(typeof id!=='string'||!allowed.has(id)))return '戦闘開始時に装備していない品は指定できません。';h.equip[slot]=id;}}}
if(result.durability!=null){if(typeof result.durability!=='object'||Array.isArray(result.durability))return 'durabilityの形式が不正です。';const allowed=new Set(p.party.flatMap(h=>Object.values(h.equipment).filter(Boolean).map(g=>g.instanceId)));for(const [id,v] of Object.entries(result.durability)){if(!allowed.has(id)||!Number.isInteger(v)||v<0||v>100)return '耐久値が不正です。';candidate.gear.find(g=>g.uid===id).durability=v;}}

const candidateError=validateState(candidate);return candidateError?('結果適用後の整合性：'+candidateError):'';}
function completeBattle(result){const error=validateBattleResult(result);if(error){fail(error);return {ok:false,error};}const run=state.run,n=nodeBy(run.encounterNode);if(!run||!n)return {ok:false,error:'遠征がありません。'};for(const r of result.party){const h=heroBy(r.id);h.hp=r.hp;h.sp=r.sp;h.mp=r.mp;h.status=[...new Set(r.status)];if(r.row)h.row=r.row;if(r.equipment)for(const [slot] of SLOTS)h.equip[slot]=r.equipment[slot];}for(const [id,v] of Object.entries(result.durability||{}))gearBy(id).durability=v;for(const [id,n] of Object.entries(result.consumedItems||{}))state.bag[id]-=n;state.processedBattles.push(result.requestId);state.processedBattles=state.processedBattles.slice(-200);state.pendingBattle=null;run.encounterNode=null;try{localStorage.removeItem(REQUEST_KEY);localStorage.removeItem(RESULT_KEY);}catch(e){}
if(result.outcome==='victory'){visitNode(n);run.battleWins++;state.stats.battles++;n.enemies.forEach(e=>{if(!state.knownEnemies.includes(e.templateId))state.knownEnemies.push(e.templateId);});const gold=(n.type==='boss'?180:n.type==='elite'?120:65)+run.floor*25;gainGold(gold);gainMastery(n.type==='battle'?1:2);gainItem('iron',n.type==='battle'?1:2);if(n.type==='elite'){gainItem('relicShard',1);const g={uid:uid(),baseId:['greatsword','gun','katana'][run.floor],plus:1,trait:null,durability:100};state.gear.push(g);run.rewards.items++;}if(n.type==='boss'){gainStat(1);gainItem('relicShard',1);floorData().cleared=true;}log(`${NODE_TYPES[n.type][0]}に勝利。${gold} Gと成長ポイントを獲得。${result.demo?'（検証用の結果代入）':''}`);if(n.type==='boss'){if(run.floor===2){persist();finishRun(true,'帰還');return {ok:true,finished:true};}run.floor++;run.cursor=null;run.restNode=null;run.available=floorData().nodes.filter(x=>x.row===0).map(x=>x.id);log(`第${run.floor+1}層・${THEMES[floorData().theme].name}へ。`);}persist();go('map');toast(n.type==='boss'?'次の層へ進みました。':`${gold} Gと戦利品を獲得。`);}else if(result.outcome==='defeat'){log('戦闘に敗れ、撤退した。');persist();finishRun(false,'敗走');}else{log('戦闘から離脱。別の道を検討する。');persist();go('map');toast('逃走しました。敵の地点は未攻略のままです。');}return {ok:true};}

function equipBlock(h,slot,g){const b=ITEMS[g.baseId],owner=gearOwner(g.uid);if(owner&&!(owner.id===h.id&&h.equip[slot]===g.uid))return '装備中';const isMain=slot==='main'||slot==='reserveMain',isOff=slot==='off'||slot==='reserveOff';if(isMain&&b.type!=='weapon')return '主武器に装備できません';if(isOff&&!((b.type==='weapon'&&b.hands===1)||b.type==='shield'))return 'この品は副手に装備できません';if(ARMOR_SLOTS.includes(slot)&&(b.type!=='armor'||b.slot!==slot))return '部位が違います';if(slot==='accessory'&&b.type!=='accessory'||slot==='carry'&&b.type!=='carry')return '装備枠が違います';for(const [k,v] of Object.entries(b.req||{}))if(h.stats[k]<v)return `${k} ${v} が必要`;if(isMain&&b.hands===2&&h.equip[slot==='main'?'off':'reserveOff'])return '先に対応する副手を外してください';if(isOff&&baseBy(h.equip[slot==='off'?'main':'reserveMain'])?.hands===2)return '主武器が両手武器です';if(isOff&&b.type==='weapon'&&h.stats.SKL<35)return '二刀流にはSKL35が必要（デモ値）';if(ARMOR_SLOTS.includes(slot)){const cats=ARMOR_SLOTS.filter(s=>s!==slot).map(s=>baseBy(h.equip[s])?.category).filter(Boolean);if(cats.some(c=>c!==b.category))return '防具カテゴリーを統一してください';}return '';}

function equipmentValues(h){
 const main=gearBy(h.equip.main),off=gearBy(h.equip.off);
 const weapon=g=>g&&ITEMS[g.baseId].type==='weapon'?(ITEMS[g.baseId].power||0)+g.plus*2:0;

function speak(id,topic='first'){const h=heroBy(id);if(!h)return;const lines={war:['「迷ったときは、帰る道を覚えておけ。<br>生きて戻れれば、何度でも選び直せる。」','「硬い殻なら、この槌の出番だ。<br>刃が通らない相手に、斧を振り続けることはない。」'],rog:['「鍵がかかっているからって、<br>入っちゃいけないとは限らないでしょ？」','「別の道って、大抵は誰かの見落とし。<br>ちょっと足を止めてみるのも、悪くないよ。」'],run:['「この剣に宿る火が、遺構に近づくと強くなる。<br>きっと、理由があるはずなんだ。」','「手の届かない敵には槍を。<br>大切なのは、持っているものを使い分けることだ。」'],ran:['「風の匂いが変わったら、足を止めて。<br>道も、近くにいるものも変わっているかもしれない。」','「茂みの向こうが見えないなら、無理に射ない。<br>近くで見つけられるものもあるから。」'],arc:['「昨日の地図が、今日の迷宮には合わない。<br>でも、変わり方そのものには規則があると思うの。」','「星と時間と夢は、離れているようで繋がっている。<br>あの扉の仕組みにも、同じ匂いがするわ。」'],mys:['「祈りが届かない日でも、<br>そばにいることは、できますから。」','「使いたい力が多すぎる時は、<br>今回の旅に必要なものを、ひとつずつ選びましょう。」']};setModal(h.name,`<div class="row mb">${portrait(h)}<p class="small muted">${esc(h.style)}</p></div><div class="dialogue"><span class="speaker">${h.name}</span><p>${lines[id][topic==='more'?1:0]}</p></div>`,`<button class="btn ghost" data-action="talk-more" data-id="${id}">迷宮の話を聞く</button><button class="btn primary" data-action="close">席を立つ</button>`);const key='talk-'+id+'-'+topic;if(!state.flags[key]){state.flags[key]=true;log(`${h.name}と酒場で話をした。`);persist();}}

function validateState(s){
if(!s||s.version!==APP_VERSION)return '対応するセーブ形式ではありません。';
if(!Number.isInteger(s.gold)||s.gold<0||!Array.isArray(s.heroes)||s.heroes.length!==6||!Array.isArray(s.gear))return '金額・メンバー・装備データが不正です。';
if(new Set(s.heroes.map(h=>h.id)).size!==6||s.heroes.some(h=>!HERO_BLUEPRINTS.some(b=>b.id===h.id)))return 'メンバーIDが不正です。';
if(s.heroes.filter(h=>h.active).length>5)return '出撃人数が5人を超えています。';
const gs=new Set(),used=new Set();for(const g of s.gear){if(!g.uid||gs.has(g.uid)||!ITEMS[g.baseId]||!Number.isInteger(g.plus)||g.plus<0||g.plus>5||!Number.isFinite(g.durability)||g.durability<0||g.durability>100||g.trait&&!['軽量','精密','堅牢'].includes(g.trait))return '装備インスタンスが不正です。';gs.add(g.uid);}
for(const h of s.heroes){if(!h.stats||!['front','back'].includes(h.row)||typeof h.active!=='boolean'||typeof h.style!=='string'||h.style.length>32||!h.equip||!h.masteries||!Array.isArray(h.learned)||!Array.isArray(h.skillSet)||!Array.isArray(h.status)||h.status.some(t=>!Object.hasOwn(STATUS_DEFS,t)))return 'キャラクターデータが不正です。';for(const k of ['PHY','SKL','ARC','MND'])if(!Number.isInteger(h.stats[k])||h.stats[k]<1||h.stats[k]>9999)return '能力値が不正です。';for(const k of ['hp','sp','mp'])if(!Number.isInteger(h[k])||h[k]<0||h[k]>derived(h)[k])return 'HP・SP・MPが不正です。';for(const k of ['capacity','statPts','masteryPts'])if(!Number.isInteger(h[k])||h[k]<0||h[k]>99999)return 'ポイントが不正です。';if(h.learned.some(id=>!SKILLS.some(t=>t.id===id))||h.skillSet.some(id=>!h.learned.includes(id))||new Set(h.skillSet).size!==h.skillSet.length||skillCost(h)>h.capacity)return 'スキルセットが不正です。';for(const [n,r] of Object.entries(h.masteries))if(!MASTERIES.some(m=>m.name===n)||!Number.isInteger(r)||r<1||r>5)return 'Masteryが不正です。';for(const [g,lim] of [['源泉',1],['術法',2],['技能',2]])if(MASTERIES.filter(m=>m.group===g&&h.masteries[m.name]).length>lim)return 'Masteryの取得数上限を超えています。';const cats=[];for(const [slot] of SLOTS){const id=h.equip[slot];if(!id)continue;if(!gs.has(id)||used.has(id))return '装備の参照が不正または重複しています。';used.add(id);const g=s.gear.find(g=>g.uid===id),b=ITEMS[g.baseId];if(ARMOR_SLOTS.includes(slot)){if(b.type!=='armor'||b.slot!==slot)return '防具の部位が不正です。';cats.push(b.category);}if(slot==='carry'&&b.type!=='carry'||slot==='accessory'&&b.type!=='accessory')return '装備枠が不正です。';if(['main','reserveMain'].includes(slot)&&b.type!=='weapon')return '主武器が不正です。';if(['off','reserveOff'].includes(slot)&&!(b.type==='shield'||b.type==='weapon'&&b.hands===1))return '副手が不正です。';for(const [k,v] of Object.entries(b.req||{}))if(h.stats[k]<v)return '装備要求を満たしていません。';}if(new Set(cats).size>1)return '防具カテゴリーが統一されていません。';for(const [main,off] of [['main','off'],['reserveMain','reserveOff']]){const m=s.gear.find(g=>g.uid===h.equip[main]),o=s.gear.find(g=>g.uid===h.equip[off]);if(m&&ITEMS[m.baseId].hands===2&&o)return '両手武器と副手が競合しています。';if(o&&ITEMS[o.baseId].type==='weapon'&&h.stats.SKL<35)return '二刀流の要求値が不足しています。';}}
if(!s.bag||Object.entries(s.bag).some(([id,n])=>!ITEMS[id]||!['material','consumable'].includes(ITEMS[id].type)||!Number.isInteger(n)||n<0))return '所持品が不正です。';
if(!s.settings||typeof s.settings.battleUrl!=='string'||!Array.isArray(s.history)||!Array.isArray(s.reports)||!Array.isArray(s.relics)||!Array.isArray(s.knownEnemies)||s.knownEnemies.some(id=>!ENEMIES[id])||!Array.isArray(s.processedBattles)||!Array.isArray(s.rumors)||!s.quests||!s.stats||!s.lastThemes||!s.flags)return '保存情報が不足しています。';
if(s.run){const r=s.run;if(!DUNGEONS.some(d=>d.id===r.dungeonId)||!Array.isArray(r.floors)||r.floors.length!==3||!Number.isInteger(r.floor)||r.floor<0||r.floor>2||!Array.isArray(r.available)||!Array.isArray(r.visited)||!Array.isArray(r.campUsed)||!r.rewards||s.heroes.filter(h=>h.active).length!==5)return '遠征データが不正です。';const nodeIds=new Set();for(const f of r.floors){if(!THEMES[f.theme]||!Array.isArray(f.nodes))return '層データが不正です。';for(const n of f.nodes){if(!n.id||nodeIds.has(n.id)||!NODE_TYPES[n.type]||!TERRAINS[n.terrain]||!Array.isArray(n.links)||!Array.isArray(n.enemies))return 'マップ地点が不正です。';nodeIds.add(n.id);}}for(const f of r.floors)for(const n of f.nodes)if(n.links.some(id=>!nodeIds.has(id)))return '道の参照が不正です。';if([...r.available,...r.visited].some(id=>!nodeIds.has(id)))return '現在地が不正です。';for(const k of ['cursor','encounterNode','pendingActivity','restNode'])if(r[k]&&!nodeIds.has(r[k]))return '地点参照が不正です。';}
if(s.pendingBattle&&(!s.run||s.pendingBattle.payload?.runId!==s.run.id||!s.pendingBattle.payload?.requestId))return '戦闘待機データが不正です。';return '';
}
function readFile(input,handler){const file=input.files?.[0];if(!file)return;if(file.size>2*1024*1024){input.value='';return fail('2MB以下のJSONファイルを指定してください。');}file.text().then(txt=>{try{const obj=JSON.parse(txt);handler(obj);}catch(e){fail('JSONを読み込めませんでした：'+e.message);}}).catch(()=>fail('ファイルを読み込めません。')).finally(()=>{input.value='';});}
function receiveStoredResult(){try{const raw=localStorage.getItem(RESULT_KEY);if(!raw||!state.pendingBattle)return;const result=JSON.parse(raw);if(result.requestId===state.pendingBattle.payload.requestId)completeBattle(result);}catch(e){console.warn('Result read failed',e);}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();Promise.resolve(handleAction(el)).catch(err=>{console.error(err);toast('操作を完了できませんでした。'+err.message,true);});}else if(e.target.classList.contains('modal-backdrop'))closeModal();});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.setting){const k=el.dataset.setting;if(!['motion','contrast','font','demoTools'].includes(k))return;state.settings[k]=el.type==='checkbox'?el.checked:el.value;saveRender();}if(el.id==='save-file')readFile(el,obj=>{const error=validateState(obj);if(error)return fail(error);setModal('セーブを読み込みますか？',`<p class="small muted">現在の進行は、選んだセーブデータで置き換えられます。</p><p class="small gold mt">所持金 ${fmt(obj.gold)} G ／ 踏破 ${obj.stats.clears}回</p>`,`<button class="btn ghost" data-action="close">やめる</button><button class="btn primary" id="confirm-import">読み込む</button>`);$('#confirm-import').onclick=()=>{state=obj;view.hero='war';try{localStorage.removeItem(REQUEST_KEY);localStorage.removeItem(RESULT_KEY);}catch(e){}persist();go(state.run?(state.pendingBattle?'encounter':'map'):'town');toast('セーブデータを読み込みました。');};});if(el.id==='result-file')readFile(el,completeBattle);});
document.addEventListener('keydown',e=>{if(!modalState)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const els=[...$('#modal-root').querySelectorAll('button:not(:disabled),input,select,textarea,a[href]')];if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('rpg:battle-result',e=>completeBattle(e.detail));window.addEventListener('storage',e=>{if(e.key===RESULT_KEY)receiveStoredResult();});window.addEventListener('pageshow',receiveStoredResult);window.addEventListener('beforeunload',persist);
window.RPGAdventure=Object.freeze({version:'1.0.0',getState:()=>clone(state),validateState:()=>validateState(state),getEncounter:()=>state.pendingBattle?clone(state.pendingBattle.payload):null,prepareEncounter:()=>prepareBattle(),completeBattle,exportSave:()=>downloadFile('auriel-save.json',JSON.stringify(state,null,2)),keys:{save:SAVE_KEY,request:REQUEST_KEY,result:RESULT_KEY}});
try{const validation=validateState(state);if(validation){console.warn(validation);state=initialState();}persist();render();receiveStoredResult();}catch(e){console.error(e);$('#app').innerHTML=`<div class="loading-screen"><h1>読み込みエラー</h1><p>${esc(e.message)}</p><button class="btn" onclick="localStorage.removeItem('${SAVE_KEY}');location.reload()">このデモの保存を初期化</button></div>`;}
</script></body></html>
