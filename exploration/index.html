row"><b>ガルド</b><span class="small">今回の地形と敵編成を確認しておこう。</span></button><button class="row"><b>リゼ</b><span class="small">'+(lastExpedition.loot.join('・')||'大きな戦利品はなし')+'。次は別の枝も見たいね。</span></button><button class="row"><b>セナ</b><span class="small">記録した情報はギルドにも共有しておく。</span></button><button class="row"><b>探索記録</b><span class="small">'+(lastExpedition.events.join(' / ')||'特記事項なし')+'</span></button><div class="actions"><button onclick="inn()">戻る</button></div>')}function fullRest(){vitals=stats.map(function(a){return {hp:a[0],sp:a[0]+a[1]*2,mp:a[2]+a[3]}});persist();note('HP・SP・MPを全回復')}function talkText(i){var n=names[i],p=dungeonProgress[dungeonId]||{clear:0};if(lastExpedition.result==='踏破')return n+'「'+lastExpedition.dungeon+'は踏破した。次は装備より相性を詰めたい。」';if(journal.weakness.length)return n+'「最近判明した弱点は '+journal.weakness.slice(-2).join('、')+'。予備武器に反映できそう。」';if(p.best>0)return n+'「'+dungeonId+'は第'+p.best+'層まで確認済み。次は別ルートも見たい。」';return n+'「次の探索では地形と敵の列を先に見ておこう。」'}function conversation(){show('<h2>仲間との会話</h2>'+names.map(function(n,i){return '<button class="row" onclick="memberTalk('+i+')"><b>'+n+'</b><span class="small">'+battleStyle(i)+' / '+rows[i]+'</span></button>'}).join('')+'<button class="row" onclick="npcTalk(0)"><b>酒場主人</b><span class="small">街と冒険者の話</span></button><button class="row" onclick="npcTalk(1)"><b>旅の冒険者</b><span class="small">探索報告</span></button><div class="actions"><button onclick="inn()">戻る</button></div>')}function memberTalk(i){show('<h2>'+names[i]+'</h2><p class="small">'+talkText(i)+'</p><button class="row" onclick="character('+i+')"><b>装備・スキルを確認</b><span class="small">会話から直接準備へ</span></button><div class="actions"><button onclick="conversation()">戻る</button></div>')}function npcTalk(i){var tx=i==0?'酒場主人「強敵帰りの連中は、武器を増やすより予備セットを見直してるよ。」':'冒険者「'+(journal.terrains.slice(-1)[0]||'森林')+'では地形を読める奴がいると分岐を選びやすかった。」';show('<h2>'+(i?'旅の冒険者':'酒場主人')+'</h2><p class="small">'+tx+'</p><div class="actions"><button onclick="conversation()">戻る</button></div>')}function addUnique(a,x){if(a.indexOf(x)<0)a.push(x)}function rumorPool(){var a=[['森林の隠し祭壇','森林のイベントで祭壇が見つかるらしい'],['重装兵の巡回','重装には壊攻撃が通りやすい'],['高台の射線','高台では後列の遠距離攻撃が有利']];if(unlocked.indexOf('辺境遺跡')<0)a.push(['辺境への古道','古代迷宮の奥に辺境へ続く記録がある']);if(unlocked.indexOf('深淵の樹海')>=0)a.push(['樹海の瘴気','樹海では解毒手段を用意した方がいい']);if(unlocked.indexOf('沈黙の砂都')>=0)a.push(['砂都の王墓','黄金王墓の番人は壊と闇に反応する']);return a}function addRumor(i){var a=rumorPool()[i];if(!a)return;addUnique(journal.rumors,a[0]+'：'+a[1]);persist();rumors()}function rumors(){var a=rumorPool();show('<h2>噂</h2>'+a.map(function(x,i){var known=journal.rumors.some(function(r){return r.indexOf(x[0])==0});return '<button class="row" onclick="addRumor('+i+')"><b>'+(known?'✓ ':'')+x[0]+'</b><span class="small">'+(known?x[1]:'聞き込みする')+'</span></button>'}).join('')+'<div class="actions"><button onclick="inn()">戻る</button></div>')}function guild(){show('<h2>ギルド</h2><button class="row" onclick="questMenu()"><b>依頼</b><span class="small">受注・進行・報告</span></button><button class="row" onclick="infoMenu()"><b>情報</b><span class="small">地形・敵・既知弱点</span></button><button class="row" onclick="appraiseMenu()"><b>査定</b><span class="small">鑑定・引取・保管</span></button>'+back())}function questMenu(){show('<h2>依頼</h2><p class="small">受注中 '+quests.filter(function(q){return q.state==1}).length+' / 達成待ち '+quests.filter(function(q){return q.state==2}).length+'</p>'+quests.map(function(q,i){var open=unlocked.indexOf(q.d)>=0;return '<button class="row" style="opacity:'+(open?1:.4)+'" '+(open?'onclick="questSelect('+i+')"':'')+'><b>'+q.n+'</b><span class="small">'+q.d+' / '+['未受注','進行中','達成'][q.state]+' / '+q.reward+'G</span></button>'}).join('')+'<div class="actions"><button onclick="guild()">戻る</button></div>')}function questSelect(i){var q=quests[i];if(q.state==0){q.state=1;persist();note(q.n+'を受注')}else if(q.state==2){gold+=q.reward;q.state=0;persist();note('達成報告：'+q.reward+'G獲得')}else note('依頼進行中：'+q.n)}function infoMenu(){var cards=Object.keys(DUNGEONS).filter(function(x){return unlocked.indexOf(x)>=0}).map(function(x){var p=dungeonProgress[x];return '<button class="row"><b>'+x+'</b><span class="small">'+(DINFO[x]||'')+' / 踏破'+p.clear+' / 最高'+p.best+'層</span></button>'}).join('');show('<h2>ダンジョン情報</h2>'+cards+'<button class="row"><b>他冒険者の探索報告</b><span class="small">今朝、古代迷宮第2層で強敵を確認。高台経由は比較的安全との報告。</span></button><button class="row"><b>収集済み情報</b><span class="small">地形：'+(journal.terrains.join(' / ')||'未調査')+'<br>敵：'+(journal.enemies.join(' / ')||'未調査')+'<br>弱点：'+(journal.weakness.join(' / ')||'未判明')+'</span></button><div class="actions"><button onclick="guild()">戻る</button></div>')}function appraiseMenu(){show('<h2>査定</h2><button class="row" onclick="appraise()"><b>未鑑定の古器 ×'+loot.古器+'</b><span class="small">鑑定・引取</span></button>'+rareGear.map(function(x,i){return '<button class="row" onclick="rareAppraise('+i+')"><b>'+x.name+'</b><span class="small">'+x.attr+' / '+x.trait+'</span></button>'}).join('')+'<button class="row" onclick="storageMenu()"><b>保管庫　'+storage.length+'</b><span class="small">保管した希少装備</span></button><span class="small">鑑定する</span></button><div class="actions"><button onclick="guild()">戻る</button></div>')}
function rareAppraise(i){var x=rareGear[i];show('<h2>'+x.name+'</h2><p class="small">'+x.attr+'<br>重量 '+x.weight+' / 要求 '+x.req+'<br>特性：'+x.trait+'</p><button class="row" onclick="keepRare('+i+')"><b>装備として引き取る</b></button><button class="row" onclick="sellRare('+i+')"><b>'+x.value+'Gで売却</b></button><button class="row" onclick="storeRare('+i+')"><b>保管庫へ</b></button><div class="actions"><button onclick="appraiseMenu()">戻る</button></div>')}function keepRare(i){var x=rareGear.splice(i,1)[0];inventory.weapons.push(x.name);WM[x.name]=[x.attr.split('/')[0],x.attr.split('/')[1],x.weight,x.req.split(' ')[0],+(x.req.split(' ')[1]||0)];traits[x.name]=x.trait;persist();appraiseMenu()}function sellRare(i){var x=rareGear.splice(i,1)[0];gold+=x.value;persist();appraiseMenu()}function storeRare(i){storage.push(rareGear.splice(i,1)[0]);persist();appraiseMenu()}function storageMenu(){show('<h2>保管庫</h2>'+(storage.length?storage.map(function(x,i){return '<button class="row" onclick="restoreRare('+i+')"><b>'+x.name+'</b><span class="small">'+x.attr+' / '+x.trait+'　引き出す</span></button>'}).join(''):'<p class="small">保管品なし</p>')+'<div class="actions"><button onclick="appraiseMenu()">戻る</button></div>')}function restoreRare(i){rareGear.push(storage.splice(i,1)[0]);persist();storageMenu()}function upgradeMenu(){show('<h2>武器強化</h2>'+inventory.weapons.map(function(x){return '<button class="row" onclick="upgradeGear(\''+x+'\')"><b>'+x+' +'+(upgrades[x]||0)+'</b><span class="small">300G / 魔力結晶1</span></button>'}).join('')+'<div class="actions"><button onclick="craftMenu()">戻る</button></div>')}function upgradeGear(x){if(gold<300||loot.結晶<1)return note('Gまたは魔力結晶が不足');gold-=300;loot.結晶--;upgrades[x]=(upgrades[x]||0)+1;persist();upgradeMenu()}function traitMenu(){show('<h2>特性加工</h2>'+inventory.weapons.map(function(x){return '<button class="row" onclick="addTrait(\''+x+'\')"><b>'+x+'</b><span class="small">'+(traits[x]||'特性なし')+' / 森獣の皮2</span></button>'}).join('')+'<div class="actions"><button onclick="craftMenu()">戻る</button></div>')}function addTrait(x){if(loot.皮<2)return note('森獣の皮が不足');loot.皮-=2;var pool=['対獣','軽量化','術式補助','重装特効','飛行特効','状態特効'];traits[x]=pool[((upgrades[x]||0)+x.length)%pool.length];persist();traitMenu()}function appraise(){if(loot.古器<1)return note('未鑑定品なし');loot.古器--;gold+=1200;persist();persist();note('古器を鑑定・引取：1,200G')}function toolShop(){show('<h2>道具</h2>'+[['回復薬',120],['解毒薬',100],['爆弾',280],['煙玉',220],['薬瓶',240]].map(function(x){return '<button class="row" onclick="buyTool(\''+x[0]+'\','+x[1]+')"><b>'+x[0]+'　'+x[1]+'G</b><span class="small">所持 '+(inventory.tools[x[0]]||0)+'</span></button>'}).join('')+'<div class="actions"><button onclick="market()">戻る</button></div>')}function buyTool(x,v){if(gold<v)return note('所持金不足');gold-=v;inventory.tools[x]=(inventory.tools[x]||0)+1;persist();toolShop()}function market(){show('<h2>市場</h2><button class="row" onclick="weaponShop()"><b>武器・盾</b><span class="small">購入・性能確認</span></button><button class="row" onclick="armorShop()"><b>防具</b><span class="small">魔装・軽装・重装</span></button><button class="row" onclick="toolShop()"><b>道具</b><span class="small">薬・爆弾・煙玉・薬瓶</span></button><button class="row" onclick="craftMenu()"><b>加工</b><span class="small">修理・強化・特性</span></button>'+back())}function weaponShop(){show('<h2>武器・盾</h2>'+[['戦槌','壊 / 近 / PHY',900],['短剣','斬 / 近 / SKL',700],['王国剣','斬 / 近 / PHY',900],['長槍','突 / 中 / PHY',850],['長弓','突 / 遠 / SKL',900],['短杖','壊 / 近 / ARC',780],['小盾','壊 / 近 / PHY',600]].map(function(x){return '<button class="row" onclick="buyGear(\''+x[0]+'\','+x[2]+',\'weapon\')"><b>'+x[0]+'　'+x[2]+'G</b><span class="small">'+x[1]+'</span></button>'}).join('')+'<div class="actions"><button onclick="market()">戻る</button></div>')}function buyArmor(i){var a=[['魔装',650],['軽装',650],['重装',900]][i];buyGear(a[0],a[1],'armor')}function armorShop(){show('<h2>防具</h2><button class="row" onclick="buyArmor(0)"><b>魔装　650G</b><span class="small">術・魔防・状態対応</span></button><button class="row" onclick="buyArmor(1)"><b>軽装　650G</b><span class="small">回避・速度・機動</span></button><button class="row" onclick="buyArmor(2)"><b>重装　900G</b><span class="small">物防・不動・庇護</span></button><div class="actions"><button onclick="market()">戻る</button></div>')}function craftMenu(){show('<h2>加工</h2><p class="small">素材：森獣の皮 '+loot.皮+' / 魔力結晶 '+loot.結晶+'</p><button class="row" onclick="upgradeMenu()"><b>強化</b><span class="small">300G＋魔力結晶1</span></button><button class="row" onclick="traitMenu()"><b>特性加工</b><span class="small">森獣の皮2などを使用</span></button><div class="actions"><button onclick="market()">戻る</button></div>')}
function buyGear(n,v,t){if(gold<v)return note('所持金不足');gold-=v;if(t=='weapon'&&inventory.weapons.indexOf(n)<0)inventory.weapons.push(n);if(t=='armor'&&inventory.armor.indexOf(n)<0)inventory.armor.push(n);persist();note(n+'を購入')}function buy(v){if(gold>=v){gold-=v;if(v==120)inventory.tools.回復薬++;persist();market()}}
function partyMenu(){show('<h2>編成</h2>'+names.map(function(n,i){return '<button class="row" onclick="character('+i+')"><b>'+n+'</b><span class="small">'+rows[i]+' / '+eq[i][0]+'</span></button>'}).join('')+back())}
function battleStyle(i){var a=stats[i],m=eq[i][0].split('：')[1],o=masteryOwned[i],ss=skillSet[i];if(o.術法.indexOf('信仰')>=0&&ss.some(x=>/治癒|祝福|加護|浄化/.test(x)))return '聖護支援';if(o.術法.indexOf('呪術')>=0)return '呪詛・吸収';if(o.術法.indexOf('魔術')>=0)return '元素術式';if(o.術法.indexOf('符術')>=0)return '符術・式神';if(o.術法.indexOf('機巧')>=0)return '魔工兵装';if(o.術法.indexOf('異能')>=0)return '念動異能';if(o.技能.indexOf('士気')>=0&&ss.some(x=>/歌|舞|号令|旋律/.test(x)))return '士気支援';if(eq[i][1].indexOf('盾')>=0)return '盾衛前衛';if(/長弓|銃/.test(m))return '遠距離射撃';if(/短剣|刀/.test(m)&&a[1]>=a[0])return '技巧・急襲';if(/槌|斧|剣|槍/.test(m)&&a[0]>=40)return '前衛打撃';if(a[2]>=45)return '異能術攻撃';if(a[3]>=45)return '精神支援';return '複合型'}function mainMastery(i){var x=learnedTree[i];return x.length?x[x.length-1]:'未設定'}function character(i){var a=stats[i];show('<h2>'+names[i]+'</h2><p class="small">'+battleStyle(i)+' / '+rows[i]+'</p><button class="row" onclick="charOverview('+i+')"><b>概要</b><span class="small">主力武器・Mastery・スキル</span></button><button class="row" onclick="charAbility('+i+')"><b>能力</b><span class="small">能力値・派生値・耐性</span></button><button class="row" onclick="charMastery('+i+')"><b>Mastery取得状況</b></button><button class="row" onclick="equip('+i+')"><b>装備</b></button><button class="row" onclick="skills('+i+')"><b>スキル</b></button><div class="actions"><button onclick="partyMenu()">一覧</button><button onclick="toggleRow('+i+')">列変更</button></div>')}function charOverview(i){show('<h2>'+names[i]+' / 概要</h2><p class="small">戦闘スタイル：'+battleStyle(i)+'<br>列：'+rows[i]+'<br>主力武器：'+eq[i][0].split('：')[1]+'<br>主力Mastery：'+mainMastery(i)+'<br>主力スキル：'+(learned[i][learned[i].length-1]||'通常攻撃')+'</p><div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function charAbility(i){var a=stats[i],r=resist[i];show('<h2>'+names[i]+' / 能力</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px">'+['PHY','SKL','ARC','MND'].map(function(x,k){return '<button class="row" style="text-align:center" onclick="addStat('+i+','+k+')"><b>'+x+' '+a[k]+'</b></button>'}).join('')+'</div><p class="small">Stat Pt '+statPt[i]+'<br>HP '+a[0]+' / SP '+(a[0]+a[1]*2)+' / MP '+(a[2]+a[3])+'<br>物防 '+a[0]+' / 魔防 '+(a[2]+a[3])+' / 重量制限 '+a[0]+'</p><button class="row" onclick="resistView('+i+')"><b>耐性</b><span class="small">属性・状態異常・封じ</span></button><div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function calcResist(i){var r={...resist[i]},arm=eq[i][4].split('：')[1],a=learnedTree[i];if(arm=='魔装'){r.火+=10;r.水+=10;r.風+=10;r.土+=10;r.光+=10;r.闇+=10;r.猛毒+=8;r.睡眠+=8}if(arm=='重装'){r.斬+=12;r.突+=12;r.壊+=12;r.気絶+=12;r.動揺+=12}if(arm=='軽装'){r.盲目+=5;r.脚封じ+=5}if(a.indexOf('属性障壁')>=0){['火','水','風','土','光','闇'].forEach(function(x){r[x]+=10})}if(a.indexOf('異常耐性')>=0){['猛毒','盲目','睡眠','動揺','気絶'].forEach(function(x){r[x]+=10})}return r}function resistView(i){var r=calcResist(i);show('<h2>耐性</h2>'+Object.keys(r).map(function(x){return '<button class="row"><b>'+x+'</b><span class="small">'+(r[x]>0?'耐性 +'+r[x]:r[x]<0?'弱点 '+r[x]:'標準')+'</span></button>'}).join('')+'<div class="actions"><button onclick="charAbility('+i+')">戻る</button></div>')}function charMastery(i){show('<h2>Mastery取得状況</h2><p class="small">Mastery Pt '+mp[i]+'<br>源泉：'+(masteryOwned[i].源泉.join(' / ')||'なし')+'<br>術法：'+(masteryOwned[i].術法.join(' / ')||'なし')+'<br>技能：'+(masteryOwned[i].技能.join(' / ')||'なし')+'</p><button class="row"><b>習得スキル '+learnedTree[i].length+'</b><span class="small">'+(learnedTree[i].join(' / ')||'なし')+'</span></button><div class="actions"><button onclick="mastery('+i+')">Masteryを育成</button><button onclick="character('+i+')">戻る</button></div>')}function toggleRow(i){rows[i]=rows[i]=='前列'?'後列':'前列';persist();character(i)}function addStat(i,k){if(statPt[i]<1)return note('Stat Pt不足');stats[i][k]++;statPt[i]--;persist();character(i)}
function weightInfo(i){var a=stats[i][0],w=eq[i].reduce(function(z,x){var v=x.split('：')[1];return z+(WM[v]?WM[v][2]:ARM[v]?ARM[v][0]:v=='なし'?0:1)},0),over=Math.max(0,w-a),lv=over==0?0:over<=5?1:over<=12?2:3;return {weight:w,limit:a,level:lv,text:['重量正常','軽度超過：速度・回避 -5%','中度超過：速度・回避 -10% / 武器性能 -5%','重度超過：速度・回避 -20% / 武器性能 -15%'][lv]}}function stanceInfo(i){var main=eq[i][0].split('：')[1],off=eq[i][1].split('：')[1],carry=eq[i][9].split('：')[1],s=(main=='なし'&&off=='なし')?'無手':off=='なし'?'両手持ち':off.indexOf('盾')>=0?'盾併用':'二刀流',fx=s=='両手持ち'?'実効重量軽減 / 威力・崩し・命中↑':s=='二刀流'?'主副武器技を使用 / 高Cost':s=='盾併用'?'盾技・防御・反撃を使用':'無手Mastery最大適用';if(carry.indexOf('投')>=0)s+='＋投擲';return {name:s,effect:fx}}function equip(i){var a=stats[i],main=eq[i][0].split('：')[1],off=eq[i][1].split('：')[1],wi=weightInfo(i),w=wi.weight,stance=stanceInfo(i).name,pen=wi.text;show('<h2>装備</h2><p class="small">運用：'+stance+'<br>'+stanceInfo(i).effect+'<br>防具：'+eq[i][4].split('：')[1]+'統一 / 重量 '+w+' / '+a[0]+'　'+pen+'</p>'+eq[i].map(function(x,k){return '<button class="row" onclick="equipChoice('+i+','+k+')"><b>'+x+'</b><span class="small">変更</span></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function equipChoice(i,k){var current=eq[i][k].split('：')[1];var list=k<4?['なし'].concat(inventory.weapons):(k>=4&&k<=7?inventory.armor:(k==9?['回復薬','解毒薬','爆弾','煙玉','薬瓶']:['護符']));show('<h2>装備候補</h2><p class="small">現在：'+current+'</p>'+list.map(function(x){var meta='',ok=true;if(k<4&&WM[x]){var m=WM[x],idx={PHY:0,SKL:1,ARC:2,MND:3}[m[3]];ok=m[3]=='―'||stats[i][idx]>=m[4];meta=m[0]+' / '+m[1]+' / 重量'+m[2]+' / '+m[3]+' '+m[4]+' / +'+(upgrades[x]||0)+' / '+(traits[x]||'特性なし')+(ok?'':'　⚠要求不足')}else if(ARM[x])meta='重量'+ARM[x][0]+' / '+ARM[x][1];var mark=x==current?'✓ ':'';return '<button class="row" style="opacity:'+(ok?1:.5)+'" '+(ok?'onclick="setEquip('+i+','+k+',\''+x+'\')"':'')+'><b>'+mark+x+'</b><span class="small">'+meta+'</span></button>'}).join('')+'<div class="actions"><button onclick="equip('+i+')">戻る</button></div>')}function setEquip(i,k,x){if(k>=4&&k<=7&&(x=='魔装'||x=='軽装'||x=='重装')){for(var z=4;z<=7;z++){var sl=eq[i][z].split('：')[0];eq[i][z]=sl+'：'+x}persist();return equip(i)}if(k==1&&x!='なし'&&x.indexOf('盾')<0&&stats[i][1]<30)return note('二刀流にはSKL 30以上が必要');var slot=eq[i][k].split('：')[0];eq[i][k]=slot+'：'+x;persist();equip(i)}
function weaponKind(n){if(/槌/.test(n))return '槌';if(/斧/.test(n))return '斧';if(/短剣/.test(n))return '短剣';if(/剣/.test(n))return '剣';if(/槍/.test(n))return '槍';if(/弓/.test(n))return '弓';if(/杖/.test(n))return '杖';if(/盾/.test(n))return '盾';if(/回刃/.test(n))return '投擲';return n}function skillUsable(i,s){var w=skillWeapon[s];if(!w)return true;var held=[eq[i][0],eq[i][1],eq[i][2],eq[i][3]].map(function(x){return weaponKind(x.split('：')[1])});if(w=='格闘')return held[0]=='なし'&&held[1]=='なし';if(w=='投擲')return held.indexOf('投擲')>=0||eq[i][9].indexOf('投')>=0||learnedTree[i].indexOf('携行強化')>=0;return held.indexOf(w)>=0}function skillMeta(s){if(SKILLMETA[s])return SKILLMETA[s];var passive=/軽減|強化|耐性|補助|特効|心眼|先制|回復$/.test(s);return [passive?3:4,passive?'Passive':'Active']}function skillCap(i){return 24+(learnedTree[i].indexOf('容量拡張')>=0?4:0)}function effectiveCost(i,s){var n=skillMeta(s)[0];if(learnedTree[i].indexOf('Cost軽減')>=0&&n>0)n=Math.max(1,n-1);return n}function skillCost(i){return skillSet[i].reduce(function(z,s){return z+effectiveCost(i,s)},0)}function skills(i){var all=learned[i].filter(function(s){return s!='通常攻撃'&&s!='防御'}),cost=skillCost(i);show('<h2>スキルセット</h2><p class="small">Set Cost '+cost+' / '+skillCap(i)+'　Active / Passive</p><button class="row"><b>通常攻撃 / 防御</b><span class="small">基本行動・Cost 0</span></button>'+all.map(function(s){var m=skillMeta(s),ec=effectiveCost(i,s),on=skillSet[i].indexOf(s)>=0,use=skillUsable(i,s);return '<button class="row" style="opacity:'+(use?1:.5)+'" onclick="toggleLearnedSkill('+i+',\''+s+'\')"><b>'+(on?'✓ ':'○ ')+s+'</b><span class="small">'+m[1]+' / Cost '+ec+(use?'':' / ⚠対応武器なし')+'</span></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function toggleLearnedSkill(i,s){if(!skillUsable(i,s))return note('現在の主・副・予備装備では使用できません');var p=skillSet[i].indexOf(s),m=skillMeta(s);if(p>=0)skillSet[i].splice(p,1);else{if(skillCost(i)+effectiveCost(i,s)>skillCap(i))return note('Set Cost上限を超えます');skillSet[i].push(s)}persist();skills(i)}
function mastery(i){show('<h2>Mastery</h2><p class="small">Mastery Pt '+mp[i]+'</p>'+['武器','防具','源泉','術法','技能'].map(function(x){return '<button class="row" onclick="masteryType('+i+',\''+x+'\')"><b>'+x+' Mastery</b><span class="small">系統を見る</span></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function masteryType(i,t){var d={武器:['無手','格闘','短剣','剣','槌','斧','槍','鞭','鎌','刀','弓','銃','杖','盾','投擲'],防具:['魔装','軽装','重装'],源泉:['灼陽','霊峰','海神','森羅','星辰'],術法:['信仰','呪術','魔術','符術','機巧','異能'],技能:['探索','士気']}[t];show('<h2>'+t+' Mastery</h2>'+d.map(function(x){return '<button class="row" onclick="growMastery('+i+',\''+x+'\')"><b>'+x+'</b><span class="small">1 Ptで習得・成長</span></button>'}).join('')+'<div class="actions"><button onclick="mastery('+i+')">戻る</button></div>')}function growMastery(i,x){if(GEAR[x])return gearBranches(i,x);if(TREE[x]){var type=['灼陽','霊峰','海神','森羅','星辰'].indexOf(x)>=0?'源泉':['信仰','呪術','魔術','符術','機巧','異能'].indexOf(x)>=0?'術法':'技能',lim=type=='源泉'?1:2,own=masteryOwned[i][type];if(own.indexOf(x)<0){if(own.length>=lim)return note(type+'は'+lim+'つまで');if(mp[i]<1)return note('Mastery Pt不足');mp[i]--;own.push(x);persist()}return masteryBranches(i,x)}if(mp[i]<1)return note('Mastery Pt不足');if(mp[i]<1)return note('Mastery Pt不足');mp[i]--;note(x+'を成長')}function gearBranches(i,x){var tr=GEAR[x];show('<h2>'+x+' Mastery</h2>'+Object.keys(tr).map(function(k){return '<button class="row" onclick="gearSkills('+i+',\''+x+'\',\''+k+'\')"><b>'+k+'</b><span class="small">'+tr[k].join('・')+'</span></button>'}).join('')+'<div class="actions"><button onclick="mastery('+i+')">戻る</button></div>')}function gearSkills(i,x,k){show('<h2>'+x+' / '+k+'</h2>'+GEAR[x][k].map(function(s){return '<button class="row" onclick="learnGear('+i+',\''+x+'\',\''+k+'\',\''+s+'\')"><b>'+(learnedTree[i].indexOf(s)>=0?'✓ ':'')+s+'</b><span class="small">Mastery Pt 1</span></button>'}).join('')+'<div class="actions"><button onclick="gearBranches('+i+',\''+x+'\')">戻る =true;vitals.forEach(function(v,i){var a=stats[i],mh=a[0],ms=a[0]+a[1]*2,mm=a[2]+a[3];v.hp=Math.min(mh,v.hp+Math.ceil(mh*.5));v.sp=Math.min(ms,v.sp+Math.ceil(ms*.5));v.mp=Math.min(mm,v.mp+Math.ceil(mm*.5))});persist();note('HP・SP・MPを50%回復')}function camp(){lastExpedition.events.push('野営で部分回復');show('<h2>野営</h2><p class="small">HP・SP・MPを50%回復。装備・スキルを調整できます。</p><button class="row" onclick="campHeal()"><b>休息する</b><span class="small">最大値の50%回復</span></button><button class="row" onclick="partyMenu()"><b>編成・装備</b></button><button class="row" onclick="skills(0)"><b>スキルセット</b></button><button class="row" onclick="moraleMenu()"><b>士気行動</b><span class="small">現在：'+morale+'</span></button><div class="actions"><button onclick="closeM();drawDungeon()">探索へ戻る</button></div>')}function trapEvent(){if(hasSkill('罠解除')||hasSkill('解錠'))return show('<h2>仕掛けを発見</h2><p class="small">探索Masteryにより罠を看破した。</p><button class="row" onclick="loot.古器+=2;nodeResult(\'罠解除成功\',\'未鑑定の古器×2\')"><b>盗技で解除</b></button><button class="row" onclick="eventChoice()"><b>別の方法を試す</b></button>');eventChoice()}function moraleMenu(){var opts=[];if(hasSkill('鼓舞歌')||hasSkill('戦歌'))opts.push(['歌唱','次戦：士気・回復補助']);if(hasSkill('回避舞')||hasSkill('速度舞'))opts.push(['舞踏','次戦：速度・回避補助']);if(hasSkill('旋律')||hasSkill('SP支援'))opts.push(['奏楽','次戦：SP支援']);if(hasSkill('攻勢号令')||hasSkill('防勢号令'))opts.push(['号令','次戦：攻勢・防勢']);if(!opts.length)return note('士気Masteryの個別スキルが必要');show('<h2>士気行動</h2>'+opts.map(function(x){return '<button class="row" onclick="setMorale(\''+x[0]+'\')"><b>'+x[0]+'</b><span class="small">'+x[1]+'</span></button>'}).join('')+'<div class="actions"><button onclick="camp()">戻る</button></div>')}function setMorale(x){morale=x;camp()}function eventChoice(){var t=floorThemes[floor-1],ev={森林:['傷ついた霊獣','薬草を与える','森獣の皮×2'],洞窟:['崩れた鉱脈','採掘する','魔力結晶×1'],廃墟都市:['封鎖された倉庫','解錠する','未鑑定の古器×1'],山岳:['崖上の祭壇','祈りを捧げる','Mastery Pt +1'],沼地:['毒花の群生','採取する','薬瓶×1'],砂漠遺跡:['埋もれた石棺','調査する','未鑑定の古器×2'],'海上・船':['漂流箱','引き上げる','回復薬×2'],'地下神殿':['古い聖壇' function nodeInfo(x){pendingBattleType=x.indexOf('強敵')>=0?'elite':x.indexOf('♛')>=0?'boss':'normal';if(x.indexOf('通常戦')>=0&&stealthSkip>0){stealthSkip--;return show('<h2>隠密成功</h2><p class="small">敵に発見されず戦闘地点を通過できます。</p><div class="actions"><button onclick="closeM();drawDungeon()">戦闘を回避</button><button onclick="battlePrep()">戦う</button></div>')}var td=themeData(),intel=intelLevel(),idx=routeDone[routeDone.length-1],nt=nodeTerrain[idx]||terrainPool(td.t)[0],enc=encounterData(td);td.enemy.split('・').forEach(function(e){addUnique(journal.enemies,e);if(!journal.enemyData[e])journal.enemyData[e]={seen:1,physical:'未判明',magic:'未判明',status:'未判明'};else journal.enemyData[e].seen++});if(intel>1){addUnique(journal.weakness,td.tactic);td.enemy.split('・').forEach(function(e){var d=journal.enemyData[e];if(/重装|機械|ゴーレム/.test(e)){d.physical='壊◎ / 斬△';d.status='気絶・腕封じ△'}else if(/飛行|鳥/.test(e)){d.physical='突◎ / 壊△';d.status='脚封じ○'}else if(/獣/.test(e)){d.physical='斬○';d.status='猛毒○ / 動揺△'}else if(/亡者|死霊/.test(e)){d.physical='壊○ / 突△';d.status='猛毒× / 睡眠×'}else{d.physical='斬突壊：標準';d.status='封じ・異常：調査中'}d.magic='火水土風光闇：調査中'})}var detail='層テーマ：'+td.t+'<br>戦闘地点：'+nt+' — '+terrainEffect(nt)+(intel>0?'<br>敵前列：'+enc.front.join('・')+'<br>敵後列：'+(enc.back.join('・')||'なし'):'')+(intel>1?'<br>既知弱点・推奨：'+td.tactic+'<br>警戒：'+enc.status:'');show('<h2>'+x+'</h2><p class="small">'+detail+'</p><button class="row" onclick="battlePrep()"><b>出撃準備</b><span class="small">6人の列・主武器・予備武器を確認</span></button><div class="actions"><button onclick="closeM()">戻る</button><button onclick="battleDemo()">戦闘へ</button></div>')}function prepAdvice(td){var e=td.enemy,out=[];if(/重装|機械|ゴーレム/.test(e))out.push('壊が有効');if(/飛行/.test(e))out.push('突・遠距離が有効');if(/呪術師/.test(e))out.push('状態異常対策');if(/魔術師|神官/.test(e))out.push('頭封じ候補');if(/獣/.test(e))out.push('斬が有効');return out.join(' / ')||'既知の決定的相性なし'}function battlePrep(){var td=themeData(),idx=routeDone[routeDone.length-1],nt=nodeTerrain[idx]||terrainPool(td.t)[0];show('<h2>戦闘直前</h2><p clas function resumeBattle(){var ctx=null;try{ctx=JSON.parse(localStorage.getItem('rpg.exploreBattle')||'null')}catch(e){}if(!ctx||!ctx.result)return false;if(ctx.vitals)vitals=ctx.vitals;if(ctx.discoveredWeakness)ctx.discoveredWeakness.forEach(function(x){addUnique(journal.weakness,x)});if(ctx.usedCarry){Object.keys(ctx.usedCarry).forEach(function(x){if(inventory.tools[x]!=null)inventory.tools[x]=Math.max(0,inventory.tools[x]-ctx.usedCarry[x])})}floor=ctx.floor||1;floorThemes=ctx.themes||floorThemes;routeOpen=ctx.routeOpen||[0,1];routeDone=ctx.routeDone||[];if(ctx.result=='win'){if(ctx.battleType=='elite'){statPt=statPt.map(function(x){return x+1});mp=mp.map(function(x){return x+1});loot.結晶++;dropRare();quests.forEach(function(q){if(q.state==1&&q.type=='elite')q.state=2})}addUnique(journal.terrains,ctx.terrain||'不明');if(ctx.enemy)ctx.enemy.split('・').forEach(function(x){addUnique(journal.enemies,x)});if(ctx.boss)addUnique(journal.weakness,dungeonId+'ボス撃破済み');var rw=ctx.battleType=='elite'?700:ctx.battleType=='boss'?1200:300;if(ctx.boss){nextFloor();try{localStorage.removeItem('rpg.exploreBattle')}catch(e){}return true}gold+=rw;persist();if(ctx.battleType=='elite'){eliteReward();try{localStorage.removeItem('rpg.exploreBattle')}catch(e){}return true}note('戦闘勝利：'+rw+'G');setTimeout(function(){closeM();drawDungeon()},450)}else{returnTown();setTimeout(function(){note(ctx.result=='escape'?'戦闘から撤退した':'敗北して街へ撤退した')},100)}try{localStorage.removeItem('rpg.exploreBattle')}catch(e){}return true}loadGame();if(ui.compact)document.body.style.fontSize='14px';persist();if(location.search.indexOf('resume=1')>=0){if(!resumeBattle())town()}else town();
