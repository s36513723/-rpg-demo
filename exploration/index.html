function character(i){var a=stats[i];show('<h2>'+names[i]+'</h2><p class="small">'+rows[i]+' / '+eq[i][0]+' / Mastery Pt '+mp[i]+' / Stat Pt '+statPt[i]+'</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0">'+['PHY','SKL','ARC','MND'].map(function(x,k){return '<button class="row" style="text-align:center;margin:0" onclick="addStat('+i+','+k+')"><b>'+x+' '+a[k]+'</b></button>'}).join('')+'</div><p class="small">HP '+a[0]+' / SP '+(a[0]+a[1]*2)+' / MP '+(a[2]+a[3])+' / 物防 '+a[0]+' / 魔防 '+(a[2]+a[3])+'</p><button class="row" onclick="equip('+i+')"><b>装備</b><span class="small">主・副・予備・防具・装飾・携行具</span></button><button class="row" onclick="skills('+i+')"><b>スキル</b><span class="small">Set Cost管理</span></button><button class="row" onclick="mastery('+i+')"><b>Mastery</b><span class="small">武器・防具・源泉・術法・技能</span></button><div class="actions"><button onclick="partyMenu()">一覧</button><button onclick="toggleRow('+i+')">列変更</button></div>')}function toggleRow(i){rows[i]=rows[i]=='前列'?'後列':'前列';character(i)}function addStat(i,k){if(statPt[i]<1)return note('Stat Pt不足');stats[i][k]++;statPt[i]--;character(i)}
function equip(i){var a=stats[i],main=eq[i][0].split('：')[1],off=eq[i][1].split('：')[1],w=eq[i].reduce(function(z,x){return z+(x.indexOf('重装')>=0?8:x.indexOf('軽装')>=0?3:x.indexOf('魔装')>=0?2:x.indexOf('なし')>=0?0:2)},0),stance=(main=='なし'&&off=='なし')?'無手':off=='なし'?'両手持ち':off.indexOf('盾')>=0?'盾併用':'二刀流',pen=w>a[0]?'⚠ 重量超過：速度・回避・武器性能低下':'重量正常';show('<h2>装備</h2><p class="small">運用：'+stance+' / 重量 '+w+' / '+a[0]+'　'+pen+'</p>'+eq[i].map(function(x,k){return '<button class="row" onclick="equipChoice('+i+','+k+')"><b>'+x+'</b><span class="small">変更</span></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function equipChoice(i,k){var list=k<4?['なし','戦槌','戦斧','短剣','王国剣','長槍','長弓','短杖','小盾','回刃']:['魔装','軽装','重装','護符','回復薬'];show('<h2>装備候補</h2>'+list.map(function(x){return '<button class="row" onclick="setEquip('+i+','+k+',\''+x+'\')"><b>'+x+'</b></button>'}).join('')+'<div class="actions"><button onclick="equip('+i+')">戻る</button></div>')}function setEquip(i,k,x){if(k==1&&x!='なし'&&x.indexOf('盾')<0&&stats[i][1]<30)return note('二刀流にはSKL 30以上が必要');var slot=eq[i][k].split('：')[0];eq[i][k]=slot+'：'+x;equip(i)}
function skills(i){var ns=['主力技 Cost5','反撃 Cost4','地形対応 Cost3','パッシブ Cost6'];var cs=[5,4,3,6],sum=skillOn[i].reduce(function(a,v,k){return a+v*cs[k]},0);show('<h2>スキル</h2><p class="small">Set Cost '+sum+' / 24 / 習得 '+learned[i].length+'</p>'+ns.map(function(x,k){return '<button class="row" onclick="toggleSkill('+i+','+k+')"><b>'+(skillOn[i][k]?'✓ ':'○ ')+x+'</b></button>'}).join('')+learned[i].map(function(x){return '<button class="row"><b>'+x+'</b><span class="small">習得済み</span></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function toggleSkill(i,k){skillOn[i][k]=skillOn[i][k]?0:1;skills(i)}
function mastery(i){show('<h2>Mastery</h2><p class="small">Mastery Pt '+mp[i]+'</p>'+['武器','防具','源泉','術法','技能'].map(function(x){return '<button class="row" onclick="masteryType('+i+',\''+x+'\')"><b>'+x+' Mastery</b><span class="small">系統を見る</span></button>'}).join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function masteryType(i,t){var d={武器:['無手','格闘','短剣','剣','槌','斧','槍','鞭','鎌','刀','弓','銃','杖','盾','投擲'],防具:['魔装','軽装','重装'],源泉:['灼陽','霊峰','海神','森羅','星辰'],術法:['信仰','呪術','魔術','符術','機巧','異能'],技能:['探索','士気']}[t];show('<h2>'+t+' Mastery</h2>'+d.map(function(x){return '<button class="row" onclick="growMastery('+i+',\''+x+'\')"><b>'+x+'</b><span class="small">1 Ptで習得・成長</span></button>'}).join('')+'<div class="actions"><button onclick="mastery('+i+')">戻る</button></div>')}function growMastery(i,x){if(GEAR[x])return gearBranches(i,x);if(TREE[x])return masteryBranches(i,x);if(mp[i]<1)return note('Mastery Pt不足');mp[i]--;note(x+'を成長')}function gearBranches(i,x){var tr=GEAR[x];show('<h2>'+x+' Mastery</h2>'+Object.keys(tr).map(function(k){return '<button class="row" onclick="gearSkills('+i+',\''+x+'\',\''+k+'\')"><b>'+k+'</b><span class="small">'+tr[k].join('・')+'</span></button>'}).join('')+'<div class="actions"><button onclick="mastery('+i+')">戻る</button></div>')}function gearSkills(i,x,k){show('<h2>'+x+' / '+k+'</h2>'+GEAR[x][k].map(function(s){return '<button class="row" onclick="learnGear('+i+',\''+x+'\',\''+k+'\',\''+s+'\')"><b>'+(learnedTree[i].indexOf(s)>=0?'✓ ':'')+s+'</b><span class="small">Mastery Pt 1</span></button>'}).join('')+'<div class="actions"><button onclick="gearBranches('+i+',\''+x+'\')">戻る</button></div>')}function learnGear(i,x,k,s){if(learnedTree[i].indexOf(s)>=0)return note('習得済み');if(mp[i]<1)return note('Mastery Pt不足');mp[i]--;learnedTree[i].push(s);learned[i].push(s);gearSkills(i,x,k)}function masteryBranches(i,x){var tr=TREE[x];show('<h2>'+x+'</h2>'+Object.keys(tr).map(function(k){return '<button class="row" onclick="masterySkills('+i+',\''+x+'\',\''+k+'\')"><b>'+k+'</b><span class="small">'+tr[k].join('・')+'</span></button>'}).join('')+'<div class="actions"><button onclick="mastery('+i+')">戻る</button></div>')}function masterySkills(i,x,k){show('<h2>'+x+' / '+k+'</h2>'+TREE[x][k].map(function(s){return '<button class="row" onclick="learnSkill('+i+',\''+x+'\',\''+k+'\',\''+s+'\')"><b>'+(learnedTree[i].indexOf(s)>=0?'✓ ':'')+s+'</b><span class="small">Mastery Pt 1</span></button>'}).join('')+'<div class="actions"><button onclick="masteryBranches('+i+',\''+x+'\')">戻る</button></div>')}function learnSkill(i,x,k,s){if(learnedTree[i].indexOf(s)>=0)return note('習得済み');if(mp[i]<1)return note('Mastery Pt不足');mp[i]--;learnedTree[i].push(s);learned[i].push(s);masterySkills(i,x,k)}
function items(){show('<h2>所持品</h2><button class="row" onclick="note(\'回復薬を使用\')"><b>回復薬 ×5</b></button><button class="row"><b>解毒薬 ×3</b></button>'+back())}
function records(){show('<h2>記録</h2><button class="row" onclick="note(\'敵図鑑\')"><b>敵</b></button><button class="row" onclick="note(\'ダンジョン記録\')"><b>ダンジョン</b></button><button class="row" onclick="note(\'人物記録\')"><b>人物</b></button>'+back())}
function settings(){show('<h2>設定</h2><button class="row" onclick="note(\'UI設定\')"><b>UI設定</b></button>'+back())}
var floor=1;var floorThemes=['森林','洞窟','廃墟都市'];var dungeonPools=['森林','洞窟','廃墟都市','山岳','沼地','砂漠遺跡','海上・船','地下神殿'];function shuffleThemes(){var a=dungeonPools.slice().sort(function(){return Math.random()-.5});floorThemes=a.slice(0,3)}function dungeon(){show('<h2>ダンジョン選択</h2><button class="row" onclick="startDungeon()"><b>古代迷宮</b><span class="small">全3層 / テーマ可変 / 出撃</span></button><button class="row" onclick="note(\'辺境遺跡は未解放\')"><b>辺境遺跡</b></button>'+back())}function startDungeon(){floor=1;shuffleThemes();closeM();drawDungeon()}function themeData(){var t=floorThemes[floor-1],d={森林:['茂み・高低差','獣・弓兵・精霊','短剣・斧・投擲'],洞窟:['狭所・暗闇','ゴーレム・獣・怪異','槌・短剣・格闘'],廃墟都市:['路地・瓦礫','軽装兵・魔術師・機械','換装・近遠切替'],山岳:['高低差・崖','飛行・重装・獣','弓・槍・投擲'],沼地:['悪足場・毒','毒獣・植物・呪術師','軽装・森羅・解毒'],砂漠遺跡:['開所・砂嵐','神官・亡者・機械','遠距離・命中対策'],'海上・船':['狭い甲板・揺れ','海賊・海獣・飛行','槍・短剣・投擲'],'地下神殿':['結界・罠','死霊・魔術師','信仰・符術・探索']}[t];return {t:t,terrain:d[0],enemy:d[1],tactic:d[2]}}function drawDungeon(){var td=themeData();document.querySelector('h1').textContent='古代迷宮';document.querySelector('header .small').textContent='第'+floor+'層・'+floorThemes[floor-1];document.getElementById('screen').innerHTML='<div class="title"><b>分岐探索</b><span class="small">　'+td.t+' / '+td.terrain+'</span><button style="float:right" onclick="returnTown()">↩ 帰還</button></div><button class="place" style="position:absolute;left:20%;top:70%;width:70px;height:60px" onclick="nodeInfo('⚔ 通常戦')">⚔</button><button class="place" style="position:absolute;left:60%;top:70%;width:70px;height:60px" onclick="nodeInfo(\'◇ 探索\')">◇</button><button class="place" style="position:absolute;left:40%;top:45%;width:70px;height:60px" onclick="nodeInfo(\'⛺ 野営\')">⛺</button><button class="place" style="position:absolute;left:40%;top:18%;width:70px;height:60px" onclick="nextFloor()">♛</button>'}function nodeInfo(x){var td=themeData();show('<h2>'+x+'</h2><p class="small">地形：'+td.terrain+'<br>敵傾向：'+td.enemy+'<br>有効：'+td.tactic+'</p><button class="row" onclick="note(\'出撃準備\')"><b>出撃準備</b></button><div class="actions"><button onclick="closeM()">戻る</button></div>')}function nextFloor(){floor++;if(floor>3){floor=1;note('古代迷宮を踏破');setTimeout(returnTown,500)}else drawDungeon()}function returnTown(){closeM();town()}
town();
</script></body></html>
