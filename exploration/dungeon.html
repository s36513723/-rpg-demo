<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>古代迷宮</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070c0a;color:#eee;font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif}button{font:inherit;color:inherit}#app{height:100dvh;max-width:620px;margin:auto;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-rows:54px minmax(0,1fr) 108px 50px;gap:8px;background:radial-gradient(circle at 50% 30%,#153126aa,#08110dcc 55%,#050806)}.top,.party,.nav{border:1px solid #725f2d;background:#0c1511ef}.top{border-radius:10px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:18px;margin:0;color:#e6ca72}.sub{font-size:10px;color:#aab7ad}.floor{color:#d9bd63;font-size:13px;text-align:right}.map{position:relative;min-height:0;border:1px solid #4e4a2b;border-radius:12px;overflow:hidden;background:linear-gradient(#07100dc9,#0a1512a8),radial-gradient(ellipse at 50% 90%,#24523c 0,#102a20 35%,transparent 65%),linear-gradient(145deg,#162d26,#06100d);box-shadow:inset 0 0 60px #000}.map:before{content:"";position:absolute;inset:0;opacity:.22;background-image:repeating-linear-gradient(115deg,transparent 0 38px,#8aa38d14 39px 40px)}.map-title{position:absolute;top:10px;left:12px;z-index:3;font-size:11px;color:#d7c686}.back{position:absolute;top:8px;right:9px;z-index:5;border:1px solid #796733;background:#0b1511cc;border-radius:7px;padding:5px 8px;font-size:10px}svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}.path{stroke:#b9ae7a;stroke-width:1.6;stroke-dasharray:3 5;opacity:.65}.node{position:absolute;z-index:2;width:43px;height:43px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #a08a48;background:#0b1713;display:grid;place-items:center;font-size:20px;box-shadow:0 0 0 4px #07100dbb,0 4px 12px #000}.node.active{border-color:#ffe47a;box-shadow:0 0 0 4px #4b3c13,0 0 22px #ffc928}.node.lock{opacity:.5}.start{font-size:9px;width:46px;height:28px;border-radius:8px;opacity:.5}.party{border-radius:10px;padding:6px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.member{min-width:0;border:1px solid #3f5949;border-radius:7px;background:#101d17;padding:3px;text-align:center}.portrait{height:44px;border-radius:5px;background:linear-gradient(145deg,#52675a,#18251e);display:grid;place-items:center;font-size:21px}.member b{display:block;font-size:9px}.bar{height:3px;margin-top:2px;background:#3eb66c}.nav{border-radius:10px;display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden}.nav button{border:0;border-right:1px solid #3d482e;background:transparent;font-size:9px}.nav button:first-child{background:#27351d;color:#f1d77d}.ico{font-size:17px;display:block}.sheet{position:absolute;z-index:10;left:12px;right:12px;bottom:175px;background:#0b1511f7;border:1px solid #9a8040;border-radius:12px;padding:14px;box-shadow:0 10px 40px #000;display:none}.sheet.show{display:block}.sheet h2{margin:0;color:#e4c76e;font-size:17px}.sheet p{font-size:11px;color:#c3cac4}.actions{display:flex;gap:8px;margin-top:9px}.actions button{flex:1;padding:9px;border-radius:7px;border:1px solid #8e7940;background:#16221b}.actions .go{background:#80651e}</style></head><body><main id="app"><header class="top"><div><h1>古代迷宮</h1><div class="sub">失われた文明の遺構</div></div><div class="floor">第1層<br><span class="sub">森林</span></div></header><section class="map"><div class="map-title">探索経路</div><button class="back" onclick="location.href='v2.html'">↩ 帰還</button><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path class="path" d="M50 91 L35 75 M50 91 L65 75 M35 75 L22 58 M35 75 L48 58 M65 75 L48 58 M65 75 L78 58 M22 58 L30 40 M48 58 L45 40 M48 58 L62 40 M78 58 L62 40 M30 40 L50 23 M45 40 L50 23 M62 40 L50 23 M50 23 L50 9"/></svg><button class="node start" style="left:50%;top:91%">START</button><button class="node active" data-t="獣道の伏兵" data-i="地形：茂み・狭所　敵：獣×3 / 弓兵×1" style="left:35%;top:75%">⚔</button><button class="node active" data-t="苔むした祭壇" data-i="素材・遺物・隠しルートを探索する。" style="left:65%;top:75%">◇</button><button class="node lock" style="left:22%;top:58%">⛺</button><button class="node lock" style="left:48%;top:58%">?</button><button class="node lock" style="left:78%;top:58%">☠</button><button class="node lock" style="left:30%;top:40%">⚔</button><button class="node lock" style="left:45%;top:40%">🛒</button><button class="node lock" style="left:62%;top:40%">⚒</button><button class="node lock" style="left:50%;top:23%">⚔</button><button class="node lock" style="left:50%;top:9%">♛</button></section><section class="party"><div class="member"><div class="portrait">🛡️</div><b>ガルド</b><div class="bar"></div></div><div class="member"><div class="portrait">🗡️</div><b>リゼ</b><div class="bar"></div></div><div class="member"><div class="portrait">⚔️</div><b>エルン</b><div class="bar"></div></div><div class="member"><div class="portrait">🏹</div><b>セナ</b><div class="bar"></div></div><div class="member"><div class="portrait">🔮</div><b>ミレア</b><div class="bar"></div></div><div class="member"><div class="portrait">✨</div><b>ユナ</b><div class="bar"></div></div></section><nav class="nav"><button><span class="ico">♜</span>探索</button><button><span class="ico">♟</span>編成</button><button><span class="ico">🎒</span>所持品</button><button><span class="ico">▣</span>記録</button><button><span class="ico">⚙</span>設定</button></nav><div class="sheet" id="s"><h2 id="t"></h2><p id="i"></p><p>戦闘前に列・装備・予備武器・スキルセットを調整できます。</p><div class="actions"><button onclick="s.classList.remove('show')">戻る</button><button>編成・装備</button><button class="go" onclick="location.href='../index.html'">進む</button></div></div></main><script>const s=document.querySelector('#s'),t=document.querySelector('#t'),i=document.querySelector('#i');let step=0,floor=1;function advance(){step++;s.classList.remove('show');if(step>=2){step=0;floor++;if(floor>3){alert('古代迷宮を踏破しました。拠点へ帰還します。');location.href='v2.html';return}document.querySelector('.floor').innerHTML='第'+floor+'層<br><span class="sub">'+(['','森林','洞窟','廃墟都市'][floor])+'</span>';alert('第'+floor+'層へ進みます')}}document.querySelectorAll('[data-t]').forEach(n=>n.onclick=()=>{t.textContent=n.dataset.t;i.textContent=n.dataset.i;s.classList.add('show')});document.querySelector('.actions .go').onclick=advance</script></body></html>
