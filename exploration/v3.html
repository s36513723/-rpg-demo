<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RPG V3</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#060a08;color:#eee;font-family:system-ui,sans-serif}button{font:inherit;color:inherit}#app{height:100dvh;max-width:620px;margin:auto;padding:10px;display:grid;grid-template-rows:52px 1fr 104px 48px;gap:7px;background:#08100c}header,.main,.party,nav{border:1px solid #725f2d;border-radius:10px;background:#0d1712}header{padding:7px 11px;display:flex;justify-content:space-between}h1{font-size:17px;color:#ead079;margin:0}.tiny{font-size:10px;color:#aeb8b0}.main{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#2d4a3b,#0b1712 55%)}.ttl{padding:12px;color:#e8cd75}.grid{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile,.row{border:1px solid #816d37;background:#14231b;border-radius:9px;text-align:left;padding:9px}.tile{height:68px}.tile b,.row b{display:block;color:#e8ca70}.tile i{font-style:normal;font-size:25px;float:left;margin-right:9px}.party{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:5px}.mem{border:1px solid #405547;background:#101d17;border-radius:6px;text-align:center;padding:3px}.face{height:42px;background:#26392e;border-radius:4px;display:grid;place-items:center;font-size:20px}.mem b{font-size:8px;display:block}.hp{height:3px;background:#3bad67}nav{display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden}nav button{border:0;border-right:1px solid #35442e;background:#0e1813;font-size:9px}.ico{display:block;font-size:16px}.ov{position:fixed;inset:0;background:#020403cc;z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.ov.on{display:flex}.panel{width:min(100%,560px);max-height:88dvh;overflow:auto;background:#0d1712;border:1px solid #a88c43;border-radius:12px;padding:13px}.panel h2{margin:0 0 8px;color:#e9cb70}.row{display:block;width:100%;margin:6px 0}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1;padding:9px;border:1px solid #806c38;border-radius:7px;background:#18251e}.primary{background:#715b1c!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stats div{text-align:center;border:1px solid #405046;border-radius:6px;padding:6px;font-size:9px}.stats b{display:block;color:#e9cb70;font-size:15px}.toast{position:fixed;z-index:20;left:50%;bottom:170px;transform:translateX(-50%);background:#111b15;border:1px solid #a78c43;border-radius:7px;padding:8px 12px;font-size:10px;display:none}.toast.on{display:block}</style></head><body><div id="app"><header><div><h1>王都レクシア</h1><div class="tiny">冒険者区・中央広場</div></div><div id="money"></div></header><section class="main" id="main"></section><section class="party" id="party"></section><nav id="nav"></nav></div><div class="ov" id="ov"><div class="panel" id="panel"></div></div><div class="toast" id="toast"></div><script>const C=[['🛡️','ガルド','前列',55,25,10,10,'槌/斧'],['🗡️','リゼ','前列',30,50,10,10,'短剣/投擲'],['⚔️','エルン','前列',40,20,30,10,'剣/槍'],['🏹','セナ','後列',20,60,10,10,'弓/槍'],['🔮','ミレア','後列',10,10,60,20,'杖/魔術'],['✨','ユナ','後列',10,30,10,50,'符/信仰']];let S=JSON.parse(localStorage.getItem('rpg3')||'null')||{g:12480,q:0,p:5,statPt:[3,3,3,3,3,3],mp:[7,7,7,7,7,7],rows:['前列','前列','前列','後列','後列','後列'],eq:Array.from({length:6},()=>['主武器','副手','予備主武器','予備副手','頭','胴','手','足','装飾品','携行具'].map(x=>x+'：標準装備')),skill:Array.from({length:6},()=>[1,1,1,0]),mast:Array.from({length:6},()=>({武器:1,防具:1,源泉:0,術法:0,技能:0}))};if(!S.statPt)S.statPt=[3,3,3,3,3,3];if(!S.mp)S.mp=[7,7,7,7,7,7];if(!S.rows)S.rows=['前列','前列','前列','後列','後列','後列'];if(!S.eq)S.eq=Array.from({length:6},()=>['主武器','副手','予備主武器','予備副手','頭','胴','手','足','装飾品','携行具'].map(x=>x+'：標準装備'));if(!S.skill)S.skill=Array.from({length:6},()=>[1,1,1,0]);if(!S.mast)S.mast=Array.from({length:6},()=>({武器:1,防具:1,源泉:0,術法:0,技能:0}));const $=s=>document.querySelector(s);function save(){localStorage.setItem('rpg3',JSON.stringify(S));$('#money').textContent=S.g.toLocaleString()+' G'}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),1100)}function open(h){$('#panel').innerHTML=h;$('#ov').classList.add('on')}function closeM(){$('#ov').classList.remove('on')}function party(){ $('#party').innerHTML=C.map((c,i)=>'<button class="mem" onclick="character('+i+')"><div class="face">'+c[0]+'</div><b>'+c[1]+'</b><div class="hp"></div></button>').join('')}function town(){$('#main').innerHTML='<div class="ttl"><b>拠点</b><div class="tiny">冒険の準備を整える</div></div><div class="grid"><button class="tile" onclick="inn()"><i>♨</i><b>宿・酒場</b><span class="tiny">会話・噂・休息</span></button><button class="tile" onclick="guild()"><i>⚜</i><b>ギルド</b><span class="tiny">依頼・情報・査定</span></button><button class="tile" onclick="market()"><i>⚒</i><b>市場</b><span class="tiny">購入・加工</span></button><button class="tile primary" onclick="dungeons()"><i>♜</i><b>ダンジョン</b><span class="tiny">行き先・出撃</span></button></div>'}function inn(){open('<h2>宿・酒場</h2><button class="row" onclick="toast(\'仲間との会話を再生\')"><b>会話</b><span class="tiny">6人・NPCとの任意会話</span></button><button class="row" onclick="toast(\'噂：森の奥に隠し祭壇\')"><b>噂</b><span class="tiny">未確認情報・隠し要素</span></button><button class="row" onclick="toast(\'HP・SP・MP 全回復\')"><b>食事・休息</b></button>'+back())}function guild(){open('<h2>ギルド</h2><button class="row" onclick="quest()"><b>依頼</b><span class="tiny">'+(S.q?'森林巡回路：進行中':'森林巡回路：未受注')+'</span></button><button class="row" onclick="toast(\'重装兵：壊弱点 / 斬耐性\')"><b>情報</b><span class="tiny">地形・敵・既知弱点</span></button><button class="row" onclick="toast(\'古器：推定1200G\')"><b>査定</b><span class="tiny">鑑定・引取・保管</span></button>'+back())}function quest(){S.q=1;save();toast('依頼を受注');setTimeout(guild,250)}function market(){open('<h2>市場</h2><p class="tiny">所持金 '+S.g.toLocaleString()+' G</p>'+[['王国剣',900],['軽装胴',650],['回復薬',120]].map(x=>'<button class="row" onclick="buy('+x[1]+',\''+x[0]+'\')"><b>'+x[0]+'</b><span class="tiny">'+x[1]+' G</span></button>').join('')+'<button class="row" onclick="craft()"><b>加工</b><span class="tiny">修理・強化・特性変更</span></button>'+back())}function buy(v,n){if(S.g<v)return toast('所持金不足');S.g-=v;if(n==='回復薬')S.p++;save();toast(n+'を購入');setTimeout(market,250)}function craft(){open('<h2>加工</h2><button class="row" onclick="if(S.g>=300){S.g-=300;save();toast(\'王国剣 +1\')}else toast(\'所持金不足\')"><b>武器強化　300G</b><span class="tiny">威力・崩しを強化</span></button><button class="row" onclick="toast(\'特性：対獣 を付与\')"><b>特性加工</b><span class="tiny">素材を使って特性変更</span></button><button class="row" onclick="toast(\'装備を修理した\')"><b>修理</b><span class="tiny">耐久を回復</span></button><div class="actions"><button onclick="market()">戻る</button></div>')}function pMenu(){open('<h2>編成</h2>'+C.map((c,i)=>'<button class="row" onclick="character('+i+')"><b>'+c[0]+' '+c[1]+'　'+c[2]+'</b><span class="tiny">'+c[7]+'</span></button>').join('')+back())}function character(i){let c=C[i];open('<h2>'+c[0]+' '+c[1]+'</h2><div class="stats"><div>PHY<b>'+c[3]+'</b></div><div>SKL<b>'+c[4]+'</b></div><div>ARC<b>'+c[5]+'</b></div><div>MND<b>'+c[6]+'</b></div></div><button class="row" onclick="equip('+i+')"><b>装備</b><span class="tiny">主/副/予備/防具/装飾/携行具</span></button><button class="row" onclick="skills('+i+')"><b>スキル</b><span class="tiny">アクティブ・パッシブ / Cost</span></button><button class="row" onclick="mastery('+i+')"><b>Mastery</b><span class="tiny">武器・防具・源泉・術法・技能</span></button><div class="actions"><button onclick="pMenu()">一覧</button><button onclick="S.rows[i]=S.rows[i]==='前列'?'後列':'前列';save();toast(S.rows[i]+'へ変更');setTimeout(()=>character(i),200)">列変更</button></div>')}function equip(i){open('<h2>装備</h2>'+S.eq[i].map((x,k)=>'<button class="row" onclick="cycleEq('+i+','+k+')"><b>'+x+'</b><span class="tiny">タップして装備変更</span></button>').join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function cycleEq(i,k){let names=['標準装備','軽量装備','高品質装備'];let a=S.eq[i][k].split('：')[0],cur=S.eq[i][k].split('：')[1],n=names[(names.indexOf(cur)+1)%3];S.eq[i][k]=a+'：'+n;save();equip(i)}function skills(i){let ns=['主力技 Cost5','反撃 Cost4','地形対応 Cost3','パッシブ Cost6'];open('<h2>スキルセット</h2><p class="tiny">Cost '+S.skill[i].reduce((a,v,k)=>a+v*[5,4,3,6][k],0)+' / 24</p>'+ns.map((x,k)=>'<button class="row" onclick="toggleSkill('+i+','+k+')"><b>'+(S.skill[i][k]?'✓ ':'○ ')+x+'</b></button>').join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function toggleSkill(i,k){S.skill[i][k]=S.skill[i][k]?0:1;save();skills(i)}function mastery(i){open('<h2>Mastery　Pt '+S.mp[i]+'</h2><p class="tiny">武器は複数育成可 / 源泉0〜1 / 術法0〜2 / 技能0〜2</p>'+Object.keys(S.mast[i]).map(x=>'<button class="row" onclick="growM('+i+',\''+x+'\')"><b>'+x+' Mastery　Lv.'+S.mast[i][x]+'</b><span class="tiny">1Ptで成長</span></button>').join('')+'<div class="actions"><button onclick="character('+i+')">戻る</button></div>')}function growM(i,x){let lim=x==='源泉'?1:(x==='術法'||x==='技能'?2:5);if(S.mp[i]<1)return toast('Mastery Pt不足');if(S.mast[i][x]>=lim)return toast('取得上限');S.mast[i][x]++;S.mp[i]--;save();mastery(i)}function inventory(){open('<h2>所持品</h2><button class="row" onclick="usePotion()"><b>回復薬 ×'+S.p+'</b><span class="tiny">使用する</span></button><button class="row"><b>解毒薬 ×3</b></button><button class="row"><b>森獣の皮 ×4</b></button><button class="row"><b>未鑑定の古器 ×1</b></button>'+back())}function usePotion(){if(S.p){S.p--;save();toast('回復薬を使用');setTimeout(inventory,250)}}function records(){open('<h2>記録</h2>'+['敵図鑑 12/48','ダンジョン 3/8','人物 9/32','探索記録 17件'].map(x=>'<button class="row" onclick="toast(\'詳細を表示\')"><b>'+x+'</b></button>').join('')+back())}function settings(){open('<h2>設定</h2><button class="row" onclick="toast(\'UI設定を変更\')"><b>UIサイズ</b></button><button class="row" onclick="toast(\'演出速度を変更\')"><b>演出速度</b></button><button class="row" onclick="if(confirm(\'データを初期化？\')){localStorage.removeItem(\'rpg3\');location.reload()}"><b>データ初期化</b></button>'+back())}function dungeons(){open('<h2>ダンジョン選択</h2>'+[['古代迷宮','森林・洞窟・廃墟都市'],['辺境遺跡','山岳・森林・地下遺構'],['深淵の樹海','沼地・森林・地下神殿']].map((x,i)=>'<button class="row" onclick="'+(i?'toast(\'現在は古代迷宮を選択可能\')':'location.href=\'dungeon-v3.html\'')+'"><b>'+x[0]+'</b><span class="tiny">'+x[1]+' / 全3層</span></button>').join('')+back())}function back(){return '<div class="actions"><button onclick="closeM()">戻る</button></div>'}$('#nav').innerHTML='<button onclick="town();closeM()"><span class="ico">⌂</span>拠点</button><button onclick="pMenu()"><span class="ico">♟</span>編成</button><button onclick="inventory()"><span class="ico">🎒</span>所持品</button><button onclick="records()"><span class="ico">▣</span>記録</button><button onclick="settings()"><span class="ico">⚙</span>設定</button>';party();town();save();</script></body></html>
