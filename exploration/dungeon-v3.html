<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>古代迷宮 V3</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#060a08;color:#eee;font-family:system-ui,sans-serif}button{font:inherit;color:inherit}#app{height:100dvh;max-width:620px;margin:auto;padding:10px;display:grid;grid-template-rows:52px 1fr 104px 48px;gap:7px;background:#08100c}header,.main,.party,nav{border:1px solid #725f2d;border-radius:10px;background:#0d1712}header{padding:7px 11px;display:flex;justify-content:space-between}h1{font-size:17px;color:#ead079;margin:0}.tiny{font-size:10px;color:#aeb8b0}.main{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#2d4a3b,#0b1712 55%)}.ttl{padding:12px;color:#e8cd75}.grid{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile,.row{border:1px solid #816d37;background:#14231b;border-radius:9px;text-align:left;padding:9px}.tile{height:68px}.tile b,.row b{display:block;color:#e8ca70}.tile i{font-style:normal;font-size:25px;float:left;margin-right:9px}.party{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:5px}.mem{border:1px solid #405547;background:#101d17;border-radius:6px;text-align:center;padding:3px}.face{height:42px;background:#26392e;border-radius:4px;display:grid;place-items:center;font-size:20px}.mem b{font-size:8px;display:block}.hp{height:3px;background:#3bad67}nav{display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden}nav button{border:0;border-right:1px solid #35442e;background:#0e1813;font-size:9px}.ico{display:block;font-size:16px}.ov{position:fixed;inset:0;background:#020403cc;z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.ov.on{display:flex}.panel{width:min(100%,560px);max-height:88dvh;overflow:auto;background:#0d1712;border:1px solid #a88c43;border-radius:12px;padding:13px}.panel h2{margin:0 0 8px;color:#e9cb70}.row{display:block;width:100%;margin:6px 0}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1;padding:9px;border:1px solid #806c38;border-radius:7px;background:#18251e}.primary{background:#715b1c!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stats div{text-align:center;border:1px solid #405046;border-radius:6px;padding:6px;font-size:9px}.stats b{display:block;color:#e9cb70;font-size:15px}.toast{position:fixed;z-index:20;left:50%;bottom:170px;transform:translateX(-50%);background:#111b15;border:1px solid #a78c43;border-radius:7px;padding:8px 12px;font-size:10px;display:none}.toast.on{display:block}.map{position:absolute;inset:42px 10px 10px}.node{position:absolute;width:44px;height:44px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #806d37;background:#14231b;font-size:20px}.node.open{border-color:#f0cf69;box-shadow:0 0 16px #d7b73e}.node.done{opacity:.42}.node.lock{opacity:.22}.return{position:absolute;top:8px;right:8px;border:1px solid #806d37;background:#14231b;border-radius:7px;padding:6px;z-index:3}.route{position:absolute;height:1px;background:#aa9558;opacity:.55;transform-origin:left center}</style></head><body><div id="app"><header><div><h1>古代迷宮</h1><div class="tiny" id="theme"></div></div><div id="progress" class="gold"></div></header><section class="main"><div class="ttl">分岐探索</div><button class="return" onclick="location.href='v3.html'">↩ 帰還</button><div class="map" id="map"></div></section><section class="party" id="party"></section><nav id="nav"></nav></div><div class="ov" id="ov"><div class="panel" id="panel"></div></div><div class="toast" id="toast"></div><script>
const C=[['🛡️','ガルド'],['🗡️','リゼ'],['⚔️','エルン'],['🏹','セナ'],['🔮','ミレア'],['✨','ユナ']];let D=JSON.parse(localStorage.getItem('rpgDungeon')||'null')||{floor:1,stage:0,done:[]};const themes=['森林','洞窟','廃墟都市'];const $=s=>document.querySelector(s);function save(){localStorage.setItem('rpgDungeon',JSON.stringify(D))}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),1000)}function open(h){$('#panel').innerHTML=h;$('#ov').classList.add('on')}function closeM(){$('#ov').classList.remove('on')}const N=[['⚔',25,78,'通常戦','獣×3・弓兵 / 茂み'],['◇',70,78,'探索','素材・遺物・隠しルート'],['?',18,55,'イベント','何かが木々の奥で動く'],['⛺',48,55,'野営','部分回復・装備・スキル調整'],['☠',80,55,'強敵','Mastery Pt・希少装備'],['⚔',30,32,'通常戦','重装×2・魔術師 / 狭所'],['⚒',65,32,'鍛冶','武器強化・特性変更'],['♛',50,10,'階層ボス','次層への門']];function party(){$('#party').innerHTML=C.map(c=>'<div class="mem"><div class="face">'+c[0]+'</div><b>'+c[1]+'</b><div class="hp"></div></div>').join('')}function available(i){return i<=Math.min(7,D.stage+1)}function render(){$('#theme').textContent='第'+D.floor+'層・'+themes[D.floor-1];$('#progress').textContent=(D.stage+1)+'/8';$('#map').innerHTML=N.map((n,i)=>'<button class="node '+(D.done.includes(i)?'done':available(i)?'open':'lock')+'" style="left:'+n[1]+'%;top:'+n[2]+'%" '+(available(i)&&!D.done.includes(i)?'onclick="inspect('+i+')"':'')+'>'+n[0]+'</button>').join('')}function inspect(i){let n=N[i];open('<h2>'+n[3]+'</h2><p class="tiny">'+n[4]+'</p><button class="row" onclick="toast(\'敵・地形の詳細を確認\')"><b>情報</b><span class="tiny">弱点・耐性・地形効果</span></button><button class="row" onclick="toast(\'6人の装備・列を確認\')"><b>出撃準備</b><span class="tiny">換装・スキルセット</span></button><div class="actions"><button onclick="closeM()">戻る</button><button class="primary" onclick="resolve('+i+')">進む</button></div>')}function resolve(i){let type=N[i][3];if(type==='通常戦'||type==='強敵'){localStorage.setItem('battleReturn','exploration/dungeon-v3.html');location.href='../index.html';return}D.done.push(i);D.stage=Math.max(D.stage,i);if(type==='探索')toast('森獣の皮と古器を発見');if(type==='野営')toast('HP・SP・MPを部分回復');if(type==='鍛冶')toast('武器の強化が可能になった');if(type==='イベント')toast('隠し情報を記録した');if(type==='階層ボス'){D.floor++;D.stage=0;D.done=[];if(D.floor>3){localStorage.removeItem('rpgDungeon');alert('古代迷宮 踏破！');location.href='v3.html';return}else toast('第'+D.floor+'層へ')}save();closeM();render()}function quickParty(){let s=JSON.parse(localStorage.getItem('rpg3')||'{}'),rows=s.rows||['前列','前列','前列','後列','後列','後列'];open('<h2>探索中の編成</h2>'+C.map((x,i)=>'<button class="row" onclick="toast(\''+x[1]+'：'+rows[i]+'\')"><b>'+x[0]+' '+x[1]+'</b><span class="tiny">'+rows[i]+' / 装備・スキルは拠点データを使用</span></button>').join('')+'<div class="actions"><button onclick="closeM()">戻る</button></div>')}function quickItems(){let s=JSON.parse(localStorage.getItem('rpg3')||'{}');open('<h2>携行品</h2><button class="row" onclick="if((s.p||0)>0){s.p--;localStorage.setItem(\'rpg3\',JSON.stringify(s));toast(\'回復薬を使用\');setTimeout(quickItems,200)}"><b>回復薬 ×'+(s.p||0)+'</b><span class="tiny">探索中に使用</span></button><button class="row"><b>解毒薬 ×3</b></button><div class="actions"><button onclick="closeM()">戻る</button></div>')}$('#nav').innerHTML='<button onclick="location.href=\'v3.html\'"><span class="ico">⌂</span>拠点</button><button onclick="quickParty()"><span class="ico">♟</span>編成</button><button onclick="quickItems()"><span class="ico">🎒</span>所持品</button><button onclick="toast(\'探索記録\')"><span class="ico">▣</span>記録</button><button onclick="toast(\'設定\')"><span class="ico">⚙</span>設定</button>';party();render();
</script></body></html>
