<!DOCTYPE html>

<html data-build="48" lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#0b121d" name="theme-color"/><title>薄明の回廊</title><link href="ui-v42.css" rel="stylesheet"/><link href="overlay-v43.css" rel="stylesheet"/><link href="stage-v45.css" rel="stylesheet"/><link href="formation-v46.css" rel="stylesheet"/><link href="party-formation-v47.css" rel="stylesheet"/><link href="reference-v48.css" rel="stylesheet"/></head><body><aside class="boot-status" id="bootStatus"><p>読み込み中…</p><a href="https://s36513723.github.io/-rpg-demo/play-v44.html?v=48">ブラウザ版を開く</a></aside><svg aria-hidden="true" class="svg-library" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-sword" viewbox="0 0 24 24"><path d="m5 19 3-3m1-5 4 4M9 12 18 3l3 0 0 3-9 9M4 16l4 4M3 21l2-2"></path></symbol>
<symbol id="i-star" viewbox="0 0 24 24"><path d="m12 2 2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3L12 2Z"></path><path d="m19 3 2 2M3 3l2 2"></path></symbol>
<symbol id="i-shield" viewbox="0 0 24 24"><path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6l8-3Z"></path><path d="M12 7v10"></path></symbol>
<symbol id="i-swap" viewbox="0 0 24 24"><path d="M7 20V4m-4 4 4-4 4 4M17 4v16m-4-4 4 4 4-4"></path></symbol>
<symbol id="i-equip" viewbox="0 0 24 24"><path d="M4 8a8 8 0 0 1 13-4l3 3M20 3v4h-4M20 16a8 8 0 0 1-13 4l-3-3M4 21v-4h4M9 15l6-6m-4 0 4 4"></path></symbol>
<symbol id="i-exit" viewbox="0 0 24 24"><path d="M10 3H4v18h6m4-5 4-4-4-4M9 12h12"></path></symbol>
<symbol id="i-target" viewbox="0 0 24 24"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 1v5m0 12v5M1 12h5m12 0h5"></path></symbol>
<symbol id="i-fire" viewbox="0 0 24 24"><path d="M13 2c2 6-5 7-3 12 2 0 4-3 5-5 4 4 6 7 3 11-4 4-12 2-13-3-1-5 3-7 3-11 1 3 2 3 2 3l3-7Z"></path></symbol>
<symbol id="i-bow" viewbox="0 0 24 24"><path d="M5 3c13 1 13 17 0 18l6-9-6-9ZM2 12h20m-4-3 4 3-4 3"></path></symbol>
<symbol id="i-hammer" viewbox="0 0 24 24"><path d="m6 3 11 5-3 7-11-5 3-7Zm5 11-3 7 3 1 3-7"></path></symbol>
<symbol id="i-heart" viewbox="0 0 24 24"><path d="M12 20 4 12C-1 5 7 1 12 7 17 1 25 5 20 12l-8 8Z"></path><path d="M12 10v6m-3-3h6"></path></symbol>
<symbol id="i-scroll" viewbox="0 0 24 24"><path d="M7 3h12l-3 18H4L7 3Z M9 7h6m-7 4h6m-7 4h5"></path></symbol>
<symbol id="i-more" viewbox="0 0 24 24"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></symbol>
<symbol id="i-play" viewbox="0 0 24 24"><path d="m8 4 12 8-12 8V4Z"></path></symbol>
<symbol id="i-book" viewbox="0 0 24 24"><path d="M12 5c-4-3-8-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-2-1-6-2-10 1Zm0 0v15"></path></symbol>
<symbol id="i-pause" viewbox="0 0 24 24"><path d="M8 5v14M16 5v14"></path></symbol><symbol id="i-fast" viewbox="0 0 24 24"><path d="m3 5 8 7-8 7V5Zm10 0 8 7-8 7V5Z"></path></symbol><symbol id="i-restart" viewbox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 8M3 3v7h7"></path></symbol><symbol id="i-moon" viewbox="0 0 24 24"><path d="M20 15a9 9 0 0 1-11-12 9 9 0 1 0 11 12Z"></path></symbol></defs></svg>
<main id="game">
<header class="hud">
<div aria-label="現在のラウンド" class="round-label"><small>R</small><b id="round">01</b></div>
<button aria-label="ラウンド開始" class="command round-start" disabled="" hidden="" id="resolve"><svg class="icon"><use href="#i-play"></use></svg><b>EXECUTE</b><small id="queueCount">0/6</small></button>
<nav aria-label="行動順の予測" class="order" id="turnOrder"></nav>
<button class="hud-button" id="auto" title="このラウンドだけ自動戦闘">AUTO</button>
<button aria-label="再生速度を変更" class="hud-button" id="pace">1×</button>
<button aria-label="戦闘メニュー" class="hud-button" id="more"><svg class="icon"><use href="#i-more"></use></svg></button>
<div class="scene-meta"><button aria-label="地形の効果" class="terrain-toggle" id="terrainButton"><svg class="icon"><use href="#i-moon"></use></svg><span id="terrainEffect">狭所</span></button><button aria-expanded="false" aria-label="戦闘履歴" class="history-trigger" id="historyButton"><svg class="icon"><use href="#i-book"></use></svg></button></div>
</header>
<section aria-label="敵の配置。奥が後列、手前が前列" class="enemy-stage" id="enemyStage">
<div aria-hidden="true" class="scene-floor"><div class="stone-plane"><svg aria-hidden="true" preserveaspectratio="none" viewbox="0 296 350 117"><image height="413" href="court-v32.svg" width="350"/></svg></div><div class="rank-trace rear-trace"></div><div class="rank-trace front-trace"></div></div>
<div class="enemy-lane enemy-back-lane"><div aria-label="敵・後列" class="enemy-row" id="eb" role="group"></div></div>
<div class="enemy-lane enemy-front-lane"><div aria-label="敵・前列" class="enemy-row" id="ef" role="group"></div></div>
</section>
<section aria-label="コマンド" class="command-panel" hidden="" id="commandPanel">
<div aria-hidden="true" class="actor-art" id="actorArt"><svg id="actorPortrait" preserveaspectratio="xMidYMin slice" viewbox="0 204 128 156"><defs><clippath id="portraitClip"><rect height="156" width="128" x="0" y="204"></rect></clippath></defs><image clip-path="url(#portraitClip)" height="540" href="scene-art-v32.svg" width="384"/></svg></div>
<div class="command-content"><button aria-label="コマンドを閉じる" class="close-command" id="closeCommand" type="button">×</button>
<button aria-label="操作する仲間を変更" class="actor-button" id="actor"><b id="actorName">ガルド</b></button>
<div id="commandInput">
<div class="target-line"><span aria-live="polite" class="target-hint" id="targetHint"></span><button class="text-button" hidden="" id="cancelTarget">取消</button></div>
<div class="command-buttons">
<button aria-label="攻撃" class="command attack" id="attack" title="攻撃"><svg class="icon"><use href="#i-sword"></use></svg><b>ATTACK</b></button>
<button aria-haspopup="dialog" aria-label="技を選ぶ" class="command magic" id="skills" title="技を選ぶ"><svg class="icon"><use href="#i-star"></use></svg><b>SKILL</b></button>
<button aria-label="防御" class="command guard" id="defend" title="防御"><svg class="icon"><use href="#i-shield"></use></svg><b>GUARD</b></button>
<button aria-label="3×3陣形内を移動" class="command" id="swap" title="陣形内を移動"><svg class="icon"><use href="#i-swap"></use></svg><b>SHIFT</b></button>
<button aria-label="予備武器に換装" class="command" id="switch" title="予備武器に換装"><svg class="icon"><use href="#i-equip"></use></svg><b>EQUIP</b></button>
</div>
</div>
<div class="battle-message" hidden="" id="battleMessage"><p aria-live="polite" id="battleMessageText" role="status"></p><div class="playback-tools"><button aria-label="一時停止" aria-pressed="false" id="pause"><svg class="icon"><use href="#i-pause"></use></svg></button><button aria-label="次のメッセージ" id="nextMessage"><svg class="icon"><use href="#i-fast"></use></svg></button></div></div>
</div>
</section>
<section aria-label="味方6人" class="allies party-hud" id="allies">
<div aria-label="味方6人のステータス" class="party-strip" id="partyStrip" role="group"></div>
</section>
<details class="history" id="history"><summary>履歴</summary><button aria-label="履歴を閉じる" id="closeHistory" type="button">×</button><div aria-label="戦闘履歴" class="log" id="log" role="log" tabindex="0"></div></details>
<div class="notice" hidden="" id="notice" role="status"></div>
<div hidden=""><span id="engineStatus"></span><span id="actorJob"></span><span id="playbackTitle"></span><span id="inputHint"></span><span id="logCount"></span><span id="lastLog"></span><button id="new">新しい戦闘</button></div>
<noscript><p>JavaScriptを有効にしたブラウザで開いてください。</p></noscript>
</main>
<dialog aria-labelledby="sheetTitle" class="choice-sheet" id="choiceSheet"><div aria-hidden="true" class="sheet-handle"></div><header class="sheet-head"><div><small id="sheetKicker"></small><h2 id="sheetTitle">技</h2></div><button aria-label="閉じる" id="closeSheet">×</button></header><p class="sheet-hint" id="sheetHint"></p><div class="sheet-list" id="sheetList"></div></dialog>
<script defer="" src="battle-v48.js"></script><script defer="" src="presentation-v47.js"></script></body></html>
